      burst(ty.x + 13, ty.y - 4, 10, { col:'#4a4a50', a0:Math.PI * 1.1, a1:Math.PI * 1.9,
                                       sp0:0.6, sp1:2.0, grav:0.18, life0:10, life1:22 });
    }
  }
}

function handleCables() {
  if (S.clamped || S.rolling || S.stomping || S.hurtT > 0) return;
  if (S.clampCool > 0) return;
  for (const c of LV.cables) {
    // A 12px catch radius, and only a fresh full-power jump passes through.
    // At 8px with a -2.5 cutoff the cables were essentially uncatchable in
    // flight, which is the only way they are ever approached.
    if (Math.abs(S.x - c.x) > 12) continue;
    const y = S.y - S.h * 0.55;
    if (y < c.y0 - 10 || y > c.y1 + 10) continue;
    if (S.vy < -5.5) continue;                    // rising hard: let them pass
    S.clamped = c;
    S.clampY = clamp(S.y, c.y0 + S.h, c.y1);
    S.clampSwing = clamp(S.x - c.x, -3, 3);
    S.vx = 0; S.vy = 0;
    SFX.clampOn();
    burst(c.x, S.clampY - 14, 5, { col:'#6fe3d4', sp0:0.4, sp1:1.4, grav:0.02, life0:8, life1:18, add:true });
    return;
  }
}

function handleTubes() {
  if (S.launch) return;
  for (const t of LV.tubes) {
    if (t.cooldown > 0) { t.cooldown--; continue; }
    if (Math.abs(S.x - (t.x + 12)) > 13) continue;
    if (S.y < t.y + 2 || S.y > t.y + 38) continue;
    S.launch = { x:t.x + 12, y:t.y, tx:t.tx, ty:t.ty };
    S.launchT = 20;                  // the hiss and the telegraph
    S.flightT = 0;
    S.flightDur = 0;
    S.rolling = false; S.stomping = false; S.clamped = null;
    t.cooldown = 45;
    noise({ cut:200, cutTo:1400, dur:0.35, g:0.16 });
    return;
  }
}

/* === WEAPON ==============================================================
   The arc welder (F18b, D31). SCRAP fires a flat laser bolt, and ammo comes
   from crates left around the level.

   This replaced carry-and-throw, which asked the player to find a power cell,
   pick it up, carry it to a WATCHER without being hit, and lob it on an arc -
   four steps, any one of which could go wrong, to get one kill. The owner asked
   for a weapon instead, and a weapon is one press.

   A bolt is deliberately NOT a physics object: no gravity, no arc, nothing to
   drop. Aim is simply which way SCRAP is facing.
   ========================================================================= */

const bolts  = [];       // laser bolts in flight
const crates = [];       // ammo crates lying in the world

function makeCrate(x, y) {
  crates.push({ x, y, vy:0, rest:false, bob:Math.random() * 6.283 });
}

function addAmmo(n) {
  S.ammo = Math.min(PH.ammoMax, S.ammo + n);
  UIF.ammoPop = 14;
}

function handleFire() {
  if (S.fireCool > 0) S.fireCool--;
  if (S.muzzle > 0) S.muzzle--;
  if (!IN.pressed.fire || S.fireCool > 0) return;
  // No firing mid-roll or off a cable: both have their own animation and their
  // own job, and letting the gun interrupt them made the roll feel unreliable.
  if (S.clamped || S.rolling || S.hurtT > 0 || S.dead) return;

  if (S.ammo <= 0) {
    SFX.dryFire();
    UIF.ammoEmpty = 26;                  // the counter flashes red - never a silent no
    return;
  }

  /* ---- AIM ----
     Hold UP to fire upward; add a direction for a 45-degree diagonal.

     Without this the gun was useless against the thing it exists to kill. A
     WATCHER hovers eight tiles up, deliberately out of jump reach (D13), and a
     purely horizontal bolt leaves from SCRAP's chest - so every shot passed
     harmlessly underneath it and the mandatory WATCHER could not be beaten at
     all. The old power cell reached it because it was LOBBED; replacing a lob
     with a flat shot quietly removed the answer to the puzzle. */
  const ix = inputX();
  const up = IN.held.up;
  let dx = S.face, dy = 0;
  if (up) {
    dy = -1; dx = ix ? ix : 0;
    /* AIM ASSIST, and only on the up-shot (D38).

       A WATCHER hovers with its box at y 346-358. A flat bolt leaves SCRAP's
       chest at 466-472, and even fired at the top of a double jump it only
       reaches 404 - still forty-six pixels short. There is no standing, running
       or jumping shot that can ever touch one, so "hold up" is not a
       convenience, it is the only way, and it had to actually connect.

       With UP held, snap to the nearest shootable machine that is genuinely
       above and in front. Nothing homes: the bolt still flies dead straight,
       this only picks the angle at the moment of firing. */
    let best = null, bestD = 1e9;
    for (const e of ents) {
      if (e.dead || e.dying || e.dormant) continue;
      if (e.type !== 'skitter' && e.type !== 'husk' && e.type !== 'husk-ambush' &&
          e.type !== 'watcher') continue;
      const ex = e.x - S.x, ey = (e.type === 'watcher' ? e.y : e.y - e.h / 2) - (S.y - 11);
      if (ey > -14) continue;                       // must be above, not level
      if (ix && Math.sign(ex) !== ix) continue;     // respect a held direction
      const d = Math.hypot(ex, ey);
      if (d > 190 || d > bestD) continue;
      best = { ex, ey }; bestD = d;
    }
    if (best) { dx = best.ex; dy = best.ey; }
  }
  const m = Math.hypot(dx, dy) || 1;
  dx /= m; dy /= m;
  if (dx) S.face = dx > 0 ? 1 : -1;

  S.ammo--;
  S.fireCool = PH.fireCool;
  S.muzzle = 5;
  S.aimX = dx; S.aimY = dy;
  UIF.ammoPop = 12;
  const bx = S.x + dx * 9, by = S.y - 11 + dy * 6;
  bolts.push({ x:bx, y:by, vx:dx * PH.boltSpeed, vy:dy * PH.boltSpeed,
               life:PH.boltLife, face:S.face });
  SFX.laser();
  burst(bx, by, 4, { col:'#8ef0ff', sp0:0.4, sp1:1.4, grav:0, life0:5, life1:10, add:true });
}

function updateBolts() {
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    let dead = false;
    /* Substepped, for the same reason the player's own collision is: at 7.6px a
       tick an unstepped bolt steps straight over a one-tile wall and carries on
       down the corridor behind it. */
    const steps = Math.max(1, Math.ceil(Math.hypot(b.vx, b.vy) / 4));
    for (let k = 0; k < steps; k++) {
      b.x += b.vx / steps;
      b.y += b.vy / steps;
      if (boltHitsAnything(b)) { dead = true; break; }
      if (solidSpan(b.x - 2, b.x + 2, b.y - 1, b.y + 1)) {
        boltSpark(b.x, b.y);
        dead = true; break;
      }
    }
    if (!dead && --b.life <= 0) dead = true;
    if (dead) bolts.splice(i, 1);
  }
}

function boltHitsAnything(b) {
  const bb = { l:b.x - 4, r:b.x + 4, t:b.y - 3, b:b.y + 3 };
  if (RUN.wardenOn && W.alive && wardenBoltHit(bb, b)) return true;
  for (const e of ents) {
    if (e.dead || e.dying || e.dormant) continue;
    if (e.type === 'roller') {
      if (!overlap(bb, { l:e.x - 7, r:e.x + 7, t:e.y - 7, b:e.y + 7 })) continue;
      e.dead = true;
      SFX.enemyDie();
      boltSpark(b.x, b.y);
      burst(e.x, e.y, 12, { col:'#4a4a50', sp0:0.8, sp1:2.6, grav:0.2, life0:12, life1:28 });
      return true;
    }
    if (e.type !== 'skitter' && e.type !== 'husk' && e.type !== 'husk-ambush' &&
        e.type !== 'watcher') continue;
    if (!overlap(bb, entBox(e))) continue;
    killEnemy(e, true);
    boltSpark(b.x, b.y);
    return true;
  }
  return false;
}

function boltSpark(x, y) {
  SFX.boltHit();
  burst(x, y, 9, { col:'#8ef0ff', sp0:0.7, sp1:2.6, grav:0.05, life0:8, life1:18, add:true });
  burst(x, y, 4, { col:'#f6d9a8', sp0:0.4, sp1:1.6, grav:0.14, life0:8, life1:16 });
}

function updateCrates() {
  const sb = hbox(S);
  for (let i = crates.length - 1; i >= 0; i--) {
    const c = crates[i];
    if (!c.rest) {
      // Dropped in above their spot and allowed to FALL, exactly as the power
      // cells were - hand-computing a resting height is how they ended up out
      // of reach last time.
      c.vy = Math.min(9, c.vy + PH.grav);
      const o = { x:c.x, y:c.y, w:10, h:11, vx:0, vy:c.vy };
      const r = moveActor(o, 0, c.vy);
      c.x = o.x; c.y = o.y; c.vy = o.vy;
      if (r.floor) { c.rest = true; c.vy = 0; }
      if (c.y > LH * TS + 30) { crates.splice(i, 1); continue; }
    } else {
      c.bob += 0.07;
    }
    /* Walked into, never picked up with a button. Ammo you can forget to
       collect is ammo you run out of in the boss arena. */
    if (S.dead || S.ending) continue;
    if (c.x + 8 > sb.l && c.x - 8 < sb.r && c.y + 3 > sb.t && c.y - 14 < sb.b) {
      addAmmo(PH.ammoPerCrate);
      SFX.ammoPickup();
      burst(c.x, c.y - 6, 12, { col:'#8ef0ff', sp0:0.5, sp1:2.0, grav:0.04,
                                life0:12, life1:24, add:true });
      crates.splice(i, 1);
    }
  }
}

/* === ENEMIES =============================================================
   Three types, one per kill method (D10). With six moves and one level there
   is no room for a tutorial, so mapping each enemy to exactly one solution
   makes the level teach its own moveset through geometry and necessity.
   ========================================================================= */

const ents = [];
const shots = [];

const RUN = {
  collected: new Set(),
  fuses: [false, false, false, false],
  scrap: 0, deaths: 0, ticks: 0,
  started: false, beat: 1,
  lightsOut: 0, lightsFade: 0, vista: 0, vistaT: 0,
  pursuit: false, pursuitX: 0, collapseX: 0,
  wardenOn: false, ended: false,
  cellTimer: 0
};

function spawnEntities() {
  ents.length = 0;
  shots.length = 0;
  bolts.length = 0;
  crates.length = 0;
  LV.spawns.forEach((d, i) => {
    if ((d.type === 'scrap' || d.type === 'fuse') && RUN.collected.has(i)) return;
    ents.push(makeEnt(d, i));
  });
  /* Dropped in slightly above their spot and allowed to FALL. Freezing them at
     a hand-computed height is how they ended up 22px out of reach. */
  for (const cs of LV.ammoSpots) makeCrate(cs.x, cs.y - 36);
  for (const t of LV.tubes) t.cooldown = 0;
}

function makeEnt(d, idx) {
  const e = { type:d.type, idx, x:d.x, y:d.y, vx:0, vy:0, face:-1,
              left:d.left, right:d.right, hp:1, dead:false, t:(idx * 7) % 240,
              frame:0, animT:0, stun:0, charge:0, cool:60, base:d.y, dormant:false,
              dying:false, dyingT:0, dieBig:false, dvx:0, dvy:0, dspin:0, drot:0 };
  /* Speeds eased across the board (D29). At 1.9 a SKITTER closed the distance
     faster than SCRAP could react on first sight, and two of them share a patrol
     range; the HUSK at 0.62 left almost no room to line a jump up. */
  if (d.type === 'skitter') { e.w = 14; e.h = 12; e.speed = 1.45; }
  if (d.type === 'husk')    { e.w = 16; e.h = 20; e.speed = 0.48; }
  if (d.type === 'husk-ambush') { e.w = 16; e.h = 20; e.speed = 0.48; e.dormant = true; }
  if (d.type === 'watcher') { e.w = 14; e.h = 12; e.speed = 0.42; e.cool = 110; }
  if (d.type === 'scrap')   { e.w = 9;  e.h = 9; }
  if (d.type === 'fuse')    { e.w = 11; e.h = 15; e.fuseIdx = d.idx; }
  return e;
}

function entBox(e) {
  if (e.type === 'watcher') return { l:e.x - e.w / 2, r:e.x + e.w / 2, t:e.y - e.h / 2, b:e.y + e.h / 2 };
  return { l:e.x - e.w / 2, r:e.x + e.w / 2, t:e.y - e.h, b:e.y };
}
function overlap(a, b) { return a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t; }

/* ---- the death beat (F19, D30) ----
   Enemies used to set `dead` and vanish between one frame and the next, which
   gave a kill no weight at all. They now play a 30-tick beat and are only
   really removed at the end of it:

     ticks 0-4    FLASH   - blown to white, squashed flat, frozen. The hit
                            registers before anything moves.
     ticks 5-12   POP     - launched up and back, spinning, still bright
     ticks 13-30  FALL    - gravity takes it, tint fades out, debris trails

   The enemy is non-colliding for all of it (`e.dying` is checked everywhere
   `e.dead` is), so a corpse can neither be re-killed nor hurt SCRAP.

   Reference points are Mega Man's pop and DKC's squash-then-scatter. Kept to
   three phases on purpose - any more reads as a cutscene on a 12px sprite. */
const DIE_TICKS = 30;

function killEnemy(e, big) {
  if (e.dying || e.dead) return;          // never start the beat twice
  e.dying = true;
  e.dyingT = 0;
  e.dieBig = !!big;
  e.dvx = (e.x < S.x ? -1 : 1) * (big ? 1.9 : 1.3) + (Math.random() - 0.5) * 0.5;
  e.dvy = big ? -3.4 : -2.7;
  e.dspin = e.dvx * 0.13;
  e.drot = 0;
  SFX.enemyDie();
  const cx = e.x, cy = e.y - e.h * 0.5;
  burst(cx, cy, big ? 14 : 9, { col:'#fdfbf4', sp0:1.0, sp1:big ? 3.2 : 2.4,
                                grav:0.06, life0:8, life1:16, add:true });
  shake(big ? 3 : 1.5);
}

/* Called once the pop is over: the scatter, and the actual removal. */
function finishEnemyDeath(e) {
  e.dead = true;
  const big = e.dieBig;
  const cx = e.x, cy = e.y - e.h * 0.5;
  burst(cx, cy, big ? 22 : 14, { col:'#6b6f76', sp0:0.8, sp1:big ? 3.4 : 2.6,
                                 grav:0.2, life0:14, life1:34 });
  burst(cx, cy, 6, { col:'#e04b3a', sp0:0.6, sp1:2.0, grav:0.1, life0:10, life1:22, add:true });
  burst(cx, cy, 4, { col:'#f2c14e', sp0:0.4, sp1:1.6, grav:0.24, life0:16, life1:30 });
  noise({ cut:1200, cutTo:300, dur:0.10, g:0.10 });
}

/* Advances one dying enemy. Returns true while it still needs drawing. */
function updateDying(e) {
  e.dyingT++;
  if (e.dyingT > 4) {                      // FLASH holds it perfectly still
    e.dvy += 0.30;
    e.x += e.dvx;
    e.y += e.dvy;
    e.drot += e.dspin;
    if (e.dyingT % 3 === 0)
      burst(e.x, e.y - e.h * 0.5, 1, { col:'#8d9299', sp0:0.1, sp1:0.6,
                                       grav:0.12, life0:10, life1:20 });
  }
  if (e.dyingT >= DIE_TICKS) { finishEnemyDeath(e); return false; }
  return true;
}


/* The stomp's ground shockwave: stuns HUSKS nearby and cracks weak panels. */
function stompImpact() {
  for (const e of ents) {
    if (e.dead || e.dying || e.dormant) continue;
    if (Math.abs(e.x - S.x) > 30 || Math.abs(e.y - S.y) > 26) continue;
    if (e.type === 'husk' || e.type === 'husk-ambush') { e.stun = 150; SFX.huskBounce(); }
    else if (e.type === 'skitter') killEnemy(e);
  }
  // Crack a weak floor panel directly below.
  const tx = Math.floor(S.x / TS), ty = Math.floor((S.y + 2) / TS);
  for (let dx = -1; dx <= 1; dx++) {
    if (tAt(tx + dx, ty) === T.WEAK) {
      LV.tiles[ty * LW + tx + dx] = T.EMPTY;
      SFX.crack();
      burst((tx + dx) * TS + 8, ty * TS + 8, 12,
            { col:'#b4552d', sp0:0.8, sp1:2.6, grav:0.24, life0:14, life1:30 });
    }
  }
}

/* One line of help, once per run, at the moment the game asks for something the
   player cannot guess. Both of these were reported as "impossible" rather than
   "hard", which is what an unguessable input feels like from the other side. */
function showTip(key, msg) {
  if (UIF.tipsShown[key]) return;
  UIF.tipsShown[key] = true;
  UIF.tip = msg;
  UIF.tipT = 240;
  SFX.ui();
}

function updateTips() {
  if (UIF.tipT > 0) UIF.tipT--;
  if (S.inCart) showTip('duck', 'HOLD DOWN TO DUCK UNDER BEAMS');
  else if (!S.dead) {
    for (const e of ents) {
      if (e.type !== 'watcher' || e.dead || e.dying) continue;
      if (Math.abs(e.x - S.x) > VIEW_W * 0.42) continue;
      showTip('aimup', 'HOLD UP AND FIRE TO HIT FLYERS');
      break;
    }
  }
}

function updateEnemies() {
  for (const e of ents) {
    if (e.dead) continue;
    // The death beat runs BEFORE the off-screen cull, or a kill made at the edge
    // of the screen would freeze mid-pop and never finish.
    if (e.dying) { updateDying(e); continue; }
    e.t++;

    if (e.type === 'scrap' || e.type === 'fuse') { updatePickup(e); continue; }

    // Cull far-away enemies so a long level costs nothing (step 47).
    if (Math.abs(e.x - S.x) > VIEW_W * 1.4) continue;

    if (e.dormant) {
      // The wrecked car that unfolds into a HUSK. Once, ever (F29).
      if (Math.abs(e.x - S.x) < 76 && S.x < e.x + 20) {
        e.dormant = false;
        e.t = 0;
        shake(3);
        SFX.crack();
        burst(e.x, e.y - 14, 18, { col:'#b4552d', sp0:1.0, sp1:3.2, grav:0.22, life0:14, life1:34 });
        tone({ type:'sawtooth', f:90, to:220, dur:0.5, g:0.16, cut:1200, q:3 });
      }
      continue;
    }
    if (e.stun > 0) { e.stun--; }

    if (e.type === 'skitter') {
      if (e.stun <= 0) {
        e.x += e.face * e.speed;
        if (e.x < e.left) { e.x = e.left; e.face = 1; }
        if (e.x > e.right) { e.x = e.right; e.face = -1; }
        // Servo-twitch: 1px jitter every 7 ticks. Red is never the only cue.
        if (e.t % 7 === 0) e.y = e.base + (Math.random() < 0.5 ? -1 : 0);
      }
      if (e.t % 4 === 0) e.frame = (e.frame + 1) % 4;
    }

    if (e.type === 'husk' || e.type === 'husk-ambush') {
      if (e.stun <= 0) {
        e.x += e.face * e.speed;
        if (e.x < e.left) { e.x = e.left; e.face = 1; }
        if (e.x > e.right) { e.x = e.right; e.face = -1; }
        if (e.t % 9 === 0) e.frame = (e.frame + 1) % 4;
      } else if (e.t % 6 === 0) {
        burst(e.x, e.y - 18, 2, { col:'#e04b3a', sp0:0.2, sp1:0.9, grav:0.05, life0:8, life1:16, add:true });
      }
    }

    if (e.type === 'watcher') {
      e.y = e.base + Math.sin(e.t / 46 * Math.PI * 2) * 5;
      const seek = clamp(S.x - e.x, -e.speed, e.speed);
      e.x = clamp(e.x + seek, e.left, e.right);
      e.face = S.x < e.x ? -1 : 1;
      if (e.t % 5 === 0) e.frame = (e.frame + 1) % 4;
      if (--e.cool <= 0 && Math.abs(e.x - S.x) < 150 && !S.dead) {
        e.charge++;
        if (e.charge === 1) tone({ type:'square', f:300, to:900, dur:0.4, g:0.07, exp:true });
        // 26 ticks of warning was under half a second. 40 is long enough to see
        // it, decide, and move (D29).
        if (e.charge > 40) {
          e.charge = 0; e.cool = 175;
          const dx = S.x - e.x, dy = (S.y - 9) - e.y;
          const m = Math.max(1, Math.hypot(dx, dy));
          shots.push({ x:e.x, y:e.y + 4, vx:dx / m * 1.7, vy:dy / m * 1.7, life:170 });
          SFX.shot();
        }
      }
    }

    // Contact damage, and the kill checks.
    const eb = entBox(e), sb = hbox(S);
    if (!overlap(eb, sb)) continue;

    /* ---- JUMP-TO-KILL (D30) ----
       Landing on ANY enemy from above kills it. The old rule was that only the
       servo stomp killed, which made a HUSK a precision test on a move the
       player had to remember to press - the single thing the owner said was
       "very hard to do". Falling onto something is a thing every player already
       tries, so it is now the answer, and the stomp is the *strong* version
       rather than the only version.

       "From above" is real geometry, not a guess: SCRAP must be DESCENDING and
       his feet must still be in the enemy's upper 60%. Walking into the side of
       a HUSK still hurts, exactly as before. */
    /* Tested against SCRAP's position at the START of the tick, not the end.
       Using the end position, a fast fall failed on short enemies: a SKITTER is
       12px tall, so the window between "feet above its head" and "feet on the
       floor it is standing on" is about 7px - and a jump lands at 8px a tick,
       stepping straight over it. SCRAP landed on the SKITTER, took damage, and
       the kill never registered. */
    const fromAbove = S.vy > 0 && S.prevY <= eb.t + e.h * 0.5;

    if (fromAbove || S.stomping) {
      const heavy = S.stomping;
      killEnemy(e, heavy || e.type !== 'skitter');
      S.stomping = false;
      S.vy = heavy ? -6.4 : -5.4;          // the bounce, so a kill carries you on
      S.airJumpsLeft = PH.airJumps;        // and refunds the air jump, so kills chain
      continue;
    }

    if (S.rolling) {
      if (e.type === 'husk' || e.type === 'husk-ambush') {
        // The roll still bounces off a HUSK's armour - harmless but
        // unmistakable. Failing has to teach rather than punish (D10), and it
        // is the one place the HUSK still says "not like that".
        S.rolling = false;
        S.vx = -S.face * 2.4;
        S.vy = -2.0;
        SFX.huskBounce();
        burst(S.x + S.face * 8, S.y - 8, 10,
              { col:'#a8adb5', sp0:0.8, sp1:2.4, grav:0.16, life0:10, life1:22 });
      } else {
        killEnemy(e);
      }
      continue;
    }

    // Stunned HUSKS are safe to stand next to - that is what the stun is for.
    if ((e.type === 'husk' || e.type === 'husk-ambush') && e.stun > 0) continue;
    hurtScrap(e.x);
  }

  // Enemy shots.
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    s.x += s.vx; s.y += s.vy;
    if (--s.life <= 0) { shots.splice(i, 1); continue; }
    if (solidSpan(s.x - 2, s.x + 2, s.y - 2, s.y + 2)) {
      burst(s.x, s.y, 6, { col:'#e04b3a', sp0:0.5, sp1:1.6, grav:0.1, life0:8, life1:16, add:true });
      shots.splice(i, 1); continue;
    }
    const sb = hbox(S);
    if (s.x > sb.l && s.x < sb.r && s.y > sb.t && s.y < sb.b) {
      shots.splice(i, 1);
      hurtScrap(s.x);
    }
  }
}

/* === PICKUPS =============================================================
   Scrap (F42) and the four hidden fuses spelling R-U-S-T (F43).

   Collection state is PER RUN, not per attempt (D12). A collected pickup stays
   collected through a respawn - otherwise a player could stand next to a
   cluster, die repeatedly, and farm it forever.
   ========================================================================= */

const FUSE_LETTERS = ['R', 'U', 'S', 'T'];

function updatePickup(e) {
  const isFuse = e.type === 'fuse';
  const dx = S.x - e.x, dy = (S.y - 9) - e.y;
  const d2 = dx * dx + dy * dy;
  const grab = isFuse ? 16 : 13;

  // A little magnetism, so near-misses still feel generous.
  if (!isFuse && d2 < 30 * 30) {
    e.x += dx * 0.06; e.y += dy * 0.06;
  }
  if (d2 < grab * grab) {
    e.dead = true;
    RUN.collected.add(e.idx);
    if (isFuse) {
      RUN.fuses[e.fuseIdx] = true;
      SFX.fuse();
      UIF.fusePop = 30; UIF.fuseIdx = e.fuseIdx;
      burst(e.x, e.y, 20, { col:'#f2c14e', sp0:0.8, sp1:2.8, grav:0.06, life0:20, life1:44, add:true });
    } else {
      RUN.scrap++;
      SFX.pickup();
      UIF.scrapPop = 12; UIF.scrapIdle = 0;
      burst(e.x, e.y, 5, { col:'#f2c14e', sp0:0.4, sp1:1.4, grav:0.04, life0:10, life1:20, add:true });
    }
  }
}

// Small UI flourish state - pops and fades, so the HUD stays out of the way.
const UIF = { scrapPop:0, scrapIdle:999, fusePop:0, fuseIdx:0, beatName:0, beatText:'',
              ammoPop:0, ammoEmpty:0,
              /* A single line of help, shown when the game asks for something the
                 player has no way to guess: aiming up at a flyer, or ducking a
                 beam. Each fires once per run. */
              tip:'', tipT:0, tipsShown:{} };

/* === CART ================================================================
   Beat 4, the showpiece (F34). A scripted second movement mode: the trolley
   accelerates and does not stop. Jump clears track gaps, down ducks under
   beams.

   Per AUDIT.md G3: being hit while riding is normal damage and the cart
   continues. Dying on the cart respawns at the cart's start with the cart
   reset. Deliberately leaving the cart is not possible.

   And the cart must NEVER come to rest on the edge of a gap - that is a
   soft-lock (DATA.md must-never #1). It cannot, because vx only ever
   accelerates and is never reduced to zero.
   ========================================================================= */

const CART_TOP = 3.7, CART_JUMP = -6.9, CART_END = 4480;
const CART_TRACK_Y = 12 * TS;
/* Three tiles below the rails is already unrecoverable, so that is where the
   ride ends. The old threshold sat BELOW the tunnel's decorative bore floor, so
   a cart that dropped through a gap landed on the scenery and carried on
   rolling along the bottom of the tunnel - the ride silently broken rather than
   failed. */
const CART_DEATH_Y = CART_TRACK_Y + TS * 3;

function boardCart() {
  if (S.inCart) return;
  S.inCart = { x:S.x, y:S.y, vx:1.2, vy:0, onTrack:true, bump:0 };
  S.rolling = false; S.stomping = false; S.clamped = null;
  SFX.crack();
  shake(3);
  setCartNoise(true, 0);
}

function updateCartRide() {
  const c = S.inCart;
  c.vx = approach(c.vx, CART_TOP, 0.035);
  S.ducking = !!IN.held.down;

  if (IN.pressed.jump && c.onTrack) {
    c.vy = CART_JUMP;
    c.onTrack = false;
    SFX.jump();
    burst(c.x, c.y, 8, { col:'#f2c14e', sp0:0.6, sp1:2.0, grav:0.2, life0:8, life1:18 });
  }
  c.vy = Math.min(11, c.vy + PH.grav);

  c.x += c.vx;

  /* Vertical movement is SUBSTEPPED, exactly like moveActor. The cart reaches
     11px a tick falling out of a jump, and a single unstepped move at that speed
     skips clean over the one-tile track: the old code then snapped to the tile
     containing wherever it had ended up, which parked the trolley INSIDE the
     rails a tile below the surface. */
  const wasOnTrack = c.onTrack;
  let landed = false;
  let remain = c.vy;
  while (Math.abs(remain) > 0.0001) {
    const step = clamp(remain, -6, 6);
    remain -= step;
    c.y += step;
    if (step > 0 && solidSpan(c.x - 11, c.x + 11, c.y - 1, c.y + 1)) {
      c.y = Math.floor(c.y / TS) * TS;
      c.vy = 0;
      landed = true;
      break;
    }
  }
  c.onTrack = landed || solidSpan(c.x - 11, c.x + 11, c.y + 0.5, c.y + 2);
  if (c.onTrack && !wasOnTrack) {
    SFX.land(0.7);
    burst(c.x, c.y, 8, { col:'#f2c14e', sp0:0.5, sp1:1.8, grav:0.2, life0:8, life1:18, add:true });
  }
  if (c.onTrack) c.vy = 0;

  // Sparks off the rails: the ride's signature look and its speed readout.
  if (c.onTrack && G.tick % 3 === 0) {
    burst(c.x - 10, c.y, 2, { col:'#ffe9a8', sp0:0.6, sp1:2.2, a0:Math.PI * 1.1, a1:Math.PI * 1.6,
                              grav:0.22, life0:8, life1:18, add:true });
  }
  setCartNoise(true, c.vx / CART_TOP);

  /* Ducking under a beam. A beam BUMPS, it does not wound (D37).

     It used to cost a hit. Measured: ducking leaves five pixels of clearance,
     and that vanishes entirely if the trolley is still airborne from the gap
     before it - every gap in this ride is three to five tiles ahead of a beam,
     so a clean jump routinely puts you into one. A bot that jumped and ducked
     correctly still took a hit. Seven beams against three hearts made the
     showpiece the most lethal thing in the game, and it was reported that way:
     "these huge black rectangles which just kill me".

     Losing half your speed and a second of control is punishment enough. The
     real skill test in beat 4 is the gaps, and those still kill. */
  S.x = c.x; S.y = c.y;
  const headH = S.ducking ? 11 : 18;
  if (solidSpan(c.x - 5, c.x + 5, c.y - headH, c.y - headH + 3)) {
    if (c.bump <= 0) {
      c.bump = 18;
      c.vx = Math.max(1.2, c.vx * 0.45);
      shake(4);
      SFX.huskBounce();
      burst(c.x + 6, c.y - 16, 10, { col:'#a8adb5', sp0:0.7, sp1:2.4, grav:0.18,
                                     life0:10, life1:22 });
      UIF.tip = 'HOLD DOWN TO DUCK'; UIF.tipT = 150;
    }
  }
  if (c.bump > 0) c.bump--;

  // Fell into a gap.
  if (c.y > CART_DEATH_Y) { killScrap(true); return; }

  // End of the ride: the trolley leaves the rails and SCRAP keeps the speed.
  if (c.x > CART_END) {
    S.inCart = null;
    S.vx = c.vx * 0.8;
    S.vy = -2;
    S.rollJumped = true;
    setCartNoise(false, 0);
    shake(4);
    burst(c.x, c.y, 20, { col:'#b4552d', sp0:1.0, sp1:3.4, grav:0.2, life0:14, life1:34 });
    SFX.crack();
    return;
  }

  S.treadPhase = (S.treadPhase + c.vx * 0.05) % 1;
  setAnim(c.onTrack ? (S.ducking ? 'crouch' : 'idle') : (c.vy < 0 ? 'rise' : 'fall'));
}

/* === WARDEN ==============================================================
   THE WARDEN (F30). The highest-risk feature in the build, because boss feel
   cannot be designed on paper (AUDIT.md risk #1).

   The loop, and why it is shaped this way:
     - it hovers out of reach, so a thrown cell cannot touch it
     - a SLAM brings it down to the ground and leaves it RECOVERING and low
     - that recovery is the only window in which its optic housing is
       reachable, so the fight is: survive the slam, then punish it
   That makes one clean learnable rule instead of a damage race.

   Difficulty comes from a SHORTER TELEGRAPH each phase (45 -> 34 -> 26), never
   from a faster attack, and cadence never drops below 85 ticks or there is no
   window to throw (DATA.md). SCRAP still has only 2 HP here.
   ========================================================================= */

const WPHASES = [
  { hp:3, attacks:['sweep','slam'],            telegraph:45, cadence:150, recover:96 },
  { hp:3, attacks:['sweep','slam','spawn'],    telegraph:34, cadence:110, recover:76 },
  { hp:3, attacks:['sweep','slam','beam'],     telegraph:26, cadence:85,  recover:58, debris:true }
];

const ARENA_L = 5680, ARENA_R = 6640, ARENA_FLOOR = GY * TS;
/* EVERY height THE WARDEN uses, expressed as a distance above the arena floor.

   These were originally absolute numbers - hover at y=96, telegraph at 92, and
   so on - written as if the camera sat near the top of the world. It does not:
   the camera keeps SCRAP about 62% of the way down the frame, so with the floor
   at y=480 the visible band is roughly 313 to 583. A boss at y=96 is TWO
   HUNDRED PIXELS above the top of the screen, and the entire fight - every
   telegraph, every attack, the whole reason the arena exists - played out where
   the player could not see any of it.

   Anchoring to the floor is also what stops it happening again: the numbers now
   say what they mean. */
const WARDEN_HOVER_Y = ARENA_FLOOR - 140;   // sprite sits well above SCRAP's head
const WARDEN_TELE_Y  = ARENA_FLOOR - 148;   // rears up a little to telegraph
const WARDEN_RISE_Y  = ARENA_FLOOR - 175;   // the wind-up before a slam
const WARDEN_SWEEP_Y = ARENA_FLOOR - 108;   // low enough for the arm to reach
const WARDEN_SPAWN_Y = ARENA_FLOOR - 135;
const WARDEN_BEAM_Y  = ARENA_FLOOR - 155;
const WARDEN_PHASE_Y = ARENA_FLOOR - 145;
// How low the slam leaves it. Low enough that the optic housing is within a
// lobbed cell's arc from the ground - that is the entire damage window.
const WARDEN_LOW_Y   = ARENA_FLOOR - 52;

const W = {
  alive:false, x:6640, y:120, vx:0, vy:0,
  hp:9, phase:0, dmg:0,
  state:'enter', t:0, telegraph:0, attack:null, cadence:0,
  armAng:-0.3, armTarget:-0.3,
  hitFlash:0, invuln:0, deadT:0, pulse:0,
  low:false, debrisT:0
};

function wardenStart() {
  W.alive = true;
  W.x = ARENA_R + 60; W.y = WARDEN_HOVER_Y; W.vx = -1.6; W.vy = 0;
  W.hp = 9; W.phase = 0; W.dmg = 0;
  W.state = 'enter'; W.t = 0; W.cadence = 90;
  W.armAng = W.armTarget = -0.3;
  W.hitFlash = 0; W.invuln = 60; W.deadT = 0; W.low = false;
  RUN.wardenOn = true;
  RUN.cellTimer = 0;
  musicSet('boss');
  SFX.phase();
  shake(5);
}

function wardenPhase() { return WPHASES[Math.min(W.phase, 2)]; }

/* Its vulnerable hitbox is the OPTIC HOUSING, not the body (DATA.md example
   3). The body damages SCRAP on contact and shrugs off everything. */
/* Deliberately generous, and deliberately the LOWER part of the housing: the
   player is lobbing a battery at a machine the size of a bus, and a pixel-tight
   target on something that only exposes itself for a second is not a skill
   test, it is a lottery. */
function wardenOpticBox() {
  return { l:W.x - 20, r:W.x + 20, t:W.y + 4, b:W.y + 30 };
}
/* The chassis. Narrower while it is coming down than while it sits there,
   because during a slam the player is being asked to step out of the way and a
   full-width crush box makes that impossible. */
function wardenBodyBox() {
  const half = W.state === 'slam' ? 34 : 38;
  return { l:W.x - half, r:W.x + half, t:W.y + 18, b:W.y + 54 };
}

/* The box a LASER BOLT is tested against when the optic is exposed - taller
   than the optic is drawn, deliberately.

   Measured: while THE WARDEN is slumped its optic occupies y 432-458, and a
   bolt fired by a standing SCRAP travels at y 466-472. A flat shot passes
   EIGHT PIXELS UNDERNEATH IT at every range, so the boss could not be damaged
   at all - which is D20 happening a second time, for the same reason (that
   entry records the old thrown cell missing by eleven pixels).

   Rather than move the boss or re-aim the gun, the exposed weak point is simply
   generous: the hit box runs the height of the optic housing, so a shot taken
   while standing next to a slumped WARDEN connects, and so does one taken
   mid-jump. It is the one target in the game that MUST be hittable, and being
   forgiving here costs nothing - the skill is in reading when the armour opens,
   not in finding a pixel. */
function wardenOpticHitBox() {
  return { l:W.x - 24, r:W.x + 24, t:W.y - 4, b:W.y + 50 };
}

function wardenBoltHit(cb, c) {
  if (W.invuln > 0 || !W.low) {
    // Bounces off the armour when it is not exposed - readable feedback that
    // this is the wrong moment, rather than a silent miss.
    if (overlap(cb, wardenBodyBox())) {
      SFX.huskBounce();
      burst(c.x, c.y, 8, { col:'#a8adb5', sp0:0.8, sp1:2.4, grav:0.2, life0:10, life1:20 });
      return true;
    }
    return false;
  }
  if (!overlap(cb, wardenOpticHitBox())) return false;

  W.hp = Math.max(0, W.hp - 1);
  W.hitFlash = 16;
  W.invuln = 24;
  boltSpark(c.x, c.y);
  shake(4);

  const ph = wardenPhase();
  const done = 9 - W.hp;
  if (W.hp <= 0) {
    W.state = 'dying'; W.t = 0; W.alive = true;
    SFX.bossDie();
    shake(6);
  } else if (done >= (W.phase + 1) * 3) {
    W.phase++;
    W.dmg = Math.min(2, W.phase);
    W.state = 'phase'; W.t = 0; W.invuln = 70;
    SFX.phase();
    shake(6);
  }
  return true;
}

function wardenTelegraphPulse() {
  // The optic pulse mirrors the rising telegraph tone EXACTLY, so the fight is
  // equally playable with the sound off (accessibility, DESIGN.md).
  const ph = wardenPhase();
  const t = 1 - W.telegraph / ph.telegraph;
  return 0.5 + 0.5 * Math.sin(t * t * 26);
}

function updateWarden() {
  if (!W.alive) return;
  W.t++;
  if (W.invuln > 0) W.invuln--;
  if (W.hitFlash > 0) W.hitFlash--;
  W.armAng = lerp(W.armAng, W.armTarget, 0.12);

  const ph = wardenPhase();

  /* The arena regenerates ammo. THIS RULE IS LOAD-BEARING (DATA.md): without
     it the player runs dry and the fight becomes unwinnable, which is the worst
     possible bug in this game. It mattered when ammo was thrown power cells and
     it matters more now, because the laser spends ammo far faster than a player
     could ever throw. */
  if (W.state !== 'dying') {
    RUN.cellTimer++;
    const loose = crates.length;
    if (RUN.cellTimer >= 150 && loose < 4) {
      /* The spot is picked from the ARENA's spots only, and the timer resets
         only when a crate actually appears.

         The first version picked at random from every spot in the level -
         including the three outside the arena - and reset the timer whether or
         not the pick was usable. Half the time it burned a full cycle spawning
         nothing, and a player who was out could be left with no ammo at all. */
      const spots = LV.ammoSpots.filter(sp => sp.x > ARENA_L && sp.x < ARENA_R);
      if (spots.length) {
        const spot = spots[(Math.random() * spots.length) | 0];
        RUN.cellTimer = 0;
        makeCrate(spot.x, spot.y - 60);
        SFX.ui();
        burst(spot.x, spot.y - 60, 8, { col:'#8ef0ff', sp0:0.4, sp1:1.6, grav:0.05, life0:12, life1:24, add:true });
      }
    }
  }

  switch (W.state) {
    case 'enter':
      W.x += W.vx;
      W.y = WARDEN_HOVER_Y + Math.sin(W.t / 40) * 6;
      if (W.x < 6200) { W.state = 'hover'; W.cadence = ph.cadence; }
      break;

    case 'hover': {
      W.low = false;
      const want = clamp(S.x, ARENA_L + 70, ARENA_R - 70);
      W.x = lerp(W.x, want, 0.012);
      W.y = lerp(W.y, WARDEN_HOVER_Y, 0.06) + Math.sin(W.t / 44) * 0.9;
      W.armTarget = -0.25 + Math.sin(W.t / 60) * 0.15;
      if (--W.cadence <= 0) {
        W.attack = ph.attacks[(Math.random() * ph.attacks.length) | 0];
        // Guarantee a slam reasonably often: it is the only damage window, so
        // the fight must not stall if the RNG dislikes the player.
        if (W.t % 3 === 0 || Math.random() < 0.45) W.attack = 'slam';
        W.telegraph = ph.telegraph;
        W.state = 'telegraph'; W.t = 0;
        SFX.telegraph(ph.telegraph);
      }
      break;
    }

    case 'telegraph':
      W.telegraph--;
      W.y = lerp(W.y, WARDEN_TELE_Y, 0.08);
      W.armTarget = W.attack === 'slam' ? -0.35 : -0.1;
      /* The slam tracks the player for the FIRST HALF of the telegraph, then
         LOCKS ON and commits.

         Tracking for the whole telegraph made the slam essentially undodgeable:
         it followed sideways faster than stepping aside could escape, so the
         only out was a jump - which put SCRAP inside the descending body and
         was worse than standing still. The damage log for a full test run was
         twelve deaths to "slam while airborne, directly underneath".

         Committing early is also what makes the telegraph mean something: the
         warning is not just "something is coming", it is "it is coming HERE,
         move". */
      if (W.attack === 'slam' && W.telegraph > ph.telegraph * 0.5) {
        W.x = lerp(W.x, clamp(S.x, ARENA_L + 60, ARENA_R - 60), 0.14);
      }
      if (W.telegraph <= 0) { W.state = W.attack; W.t = 0; }
      break;

    case 'sweep': {
      // The arm scythes across at body height. Dodge by jumping or rolling.
      W.armTarget = 1.5;
      W.x += sign(S.x - W.x) * 1.9;
      W.y = lerp(W.y, WARDEN_SWEEP_Y, 0.07);
      if (W.t === 2) SFX.sweep();
      if (W.t > 4 && W.t < 70) {
        const ax = W.x + (S.x < W.x ? -1 : 1) * 40;
        const ab = { l:ax - 26, r:ax + 26, t:W.y + 36, b:W.y + 70 };
        if (overlap(ab, hbox(S))) hurtScrap(W.x);
        if (W.t % 4 === 0)
          burst(ax + (Math.random() - 0.5) * 40, W.y + 56, 2,
                { col:'#e04b3a', sp0:0.3, sp1:1.2, grav:0.05, life0:8, life1:16, add:true });
      }
      if (W.t > 84) { W.state = 'hover'; W.cadence = ph.cadence; W.t = 0; }
      break;
    }

    case 'slam': {
      W.armTarget = 1.75;
      if (W.t < 16) { W.y = lerp(W.y, WARDEN_RISE_Y, 0.2); }
      else {
        W.vy = Math.min(13, W.vy + 1.1);
        W.y += W.vy;
        if (W.y + 54 >= ARENA_FLOOR + 2) {
          W.y = WARDEN_LOW_Y;
          W.vy = 0;
          W.state = 'recover'; W.t = 0; W.low = true;
          SFX.slam();
          shake(6);
          burst(W.x - 40, ARENA_FLOOR, 14, { col:'#8d9299', a0:Math.PI * 1.05, a1:Math.PI * 1.5,
                                             sp0:1.4, sp1:3.6, grav:0.22, life0:14, life1:32 });
          burst(W.x + 40, ARENA_FLOOR, 14, { col:'#8d9299', a0:Math.PI * 1.5, a1:Math.PI * 1.95,
                                             sp0:1.4, sp1:3.6, grav:0.22, life0:14, life1:32 });
          // The shockwave, which is what actually threatens the player.
          /* A GROUND wave, with two answers: be 84px clear, or be genuinely IN
             THE AIR when it lands. Testing `onGround` alone let a player who
             hopped a single pixel off the floor walk through it, and the damage
             log for a full clean run came back empty - the attack had no teeth
             at all. Requiring 26px of clearance means a real, timed jump (the
             jump measures 39px), which is a skill check rather than a formality. */
          const sb = hbox(S);
          if (Math.abs(S.x - W.x) < 84 && sb.b > ARENA_FLOOR - 26) hurtScrap(W.x);
        }
      }
      /* NOTE: no body-contact damage during the descent. The slam's danger is
         the ground shockwave, and the answer to a ground shockwave is to jump
         it. When the falling chassis ALSO hurt on contact, jumping put SCRAP
         inside the thing he was jumping over - the two demands contradicted
         each other and the damage log showed a player dying to exactly that,
         every single attempt. One attack, one answer. */
      break;
    }

    case 'recover':
      // THE DAMAGE WINDOW. Low, still, optic exposed. Shortens each phase.
      W.low = true;
      W.armTarget = 1.6 - (W.t / ph.recover) * 0.6;
      W.y = WARDEN_LOW_Y + Math.sin(W.t / 8) * 0.6;
      if (W.t === 1) tone({ type:'sawtooth', f:200, to:80, dur:0.6, g:0.12, exp:true, cut:900 });
      if (W.t % 10 === 0)
        burst(W.x + (Math.random() - 0.5) * 70, W.y + 50, 2,
              { col:'#6b6f76', sp0:0.2, sp1:0.9, grav:-0.03, life0:14, life1:28, kind:'smoke' });
      /* NOTE: no contact damage here either. Recovery is the REWARD window -
         the one moment the player is invited to close in and hit it. Making the
         same moment a contact hazard muddles the read completely: the fight
         says "come here" and "stay away" at once, and the player learns
         nothing from dying. When it is down, it is safe to approach. */
      if (W.t > ph.recover) { W.state = 'hover'; W.low = false; W.cadence = ph.cadence; W.t = 0; }
      break;

    case 'spawn':
      W.low = false;
      W.armTarget = 0.6;
      W.y = lerp(W.y, WARDEN_SPAWN_Y, 0.08);
      if (W.t === 10) {
        const e = makeEnt({ type:'skitter', x:W.x, y:ARENA_FLOOR,
                            left:ARENA_L + 30, right:ARENA_R - 30 }, -1);
        e.base = ARENA_FLOOR;
        ents.push(e);
        SFX.crack();
        burst(W.x, W.y + 50, 10, { col:'#e04b3a', sp0:0.6, sp1:2.2, grav:0.2, life0:12, life1:24, add:true });
      }
      if (W.t > 46) { W.state = 'hover'; W.cadence = ph.cadence; W.t = 0; }
      break;

    case 'beam': {
      W.low = false;
      W.armTarget = -0.3;
      W.y = lerp(W.y, WARDEN_BEAM_Y, 0.08);
      if (W.t === 2) SFX.beam();
      if (W.t > 6 && W.t < 56) {
        const bx = W.x;
        const bb = { l:bx - 8, r:bx + 8, t:W.y + 40, b:ARENA_FLOOR };
        if (overlap(bb, hbox(S))) hurtScrap(bx);
        if (W.t % 2 === 0)
          burst(bx + (Math.random() - 0.5) * 12, W.y + 44 + Math.random() * (ARENA_FLOOR - W.y - 44), 1,
                { col:'#ff8f7a', sp0:0.1, sp1:0.6, grav:0.02, life0:8, life1:14, add:true });
      }
      if (W.t > 70) { W.state = 'hover'; W.cadence = ph.cadence; W.t = 0; }
      break;
    }

    case 'phase':
      W.low = false;
      W.y = lerp(W.y, WARDEN_PHASE_Y, 0.06);
      W.armTarget = -0.35;
      if (W.t % 5 === 0)
        burst(W.x + (Math.random() - 0.5) * 80, W.y + 20 + Math.random() * 30, 3,
              { col:'#e09a63', sp0:0.5, sp1:2.0, grav:0.14, life0:12, life1:26 });
      if (W.t > 70) { W.state = 'hover'; W.cadence = ph.cadence; W.t = 0; }
      break;

    case 'dying':
      W.y += 0.45;
      W.x += Math.sin(W.t / 6) * 1.4;
      W.armTarget = 1.9;
      if (W.t % 4 === 0) {
        burst(W.x + (Math.random() - 0.5) * 90, W.y + Math.random() * 50, 5,
              { col:'#e09a63', sp0:0.8, sp1:2.8, grav:0.16, life0:14, life1:34 });
        shake(2);
      }
      if (W.t === 60) {
        burst(W.x, W.y + 30, 40, { col:'#f2c14e', sp0:1.4, sp1:4.4, grav:0.12, life0:20, life1:50, add:true });
        shake(7);
      }
      if (W.t > 96) { W.alive = false; startEnding(); }
      break;
  }

  // Phase 3's arena hazard: debris off the roof. Always telegraphed by dust
  // before anything solid falls.
  if (ph.debris && W.state !== 'dying') {
    if (--W.debrisT <= 0) {
      W.debrisT = 90;
      const dx = clamp(S.x + (Math.random() - 0.5) * 90, ARENA_L + 20, ARENA_R - 20);
      ents.push({ type:'debris', x:dx, y:ARENA_FLOOR - 170, vx:0, vy:0, w:14, h:14,
                  dead:false, warn:40, t:0, frame:0 });
    }
  }
}

/* Falling debris, phase 3 only. Warned first, so nothing off screen kills. */
function updateDebris(e) {
  e.t++;
  if (e.warn > 0) {
    e.warn--;
    if (e.warn % 6 === 0)
      burst(e.x, ARENA_FLOOR - 2, 2, { col:'#8d9299', sp0:0.2, sp1:0.8, grav:-0.04, life0:10, life1:20, kind:'smoke' });
    return;
  }
  e.vy = Math.min(9, e.vy + 0.5);
  e.y += e.vy;
  e.frame = (e.frame + 1) % 4;
  if (overlap({ l:e.x - 7, r:e.x + 7, t:e.y - 7, b:e.y + 7 }, hbox(S))) { hurtScrap(e.x); e.dead = true; }
  if (e.y > ARENA_FLOOR - 6) {
    e.dead = true;
    shake(2);
    SFX.huskBounce();
    burst(e.x, ARENA_FLOOR, 10, { col:'#6b6f76', a0:Math.PI * 1.1, a1:Math.PI * 1.9,
                                  sp0:0.8, sp1:2.4, grav:0.2, life0:10, life1:22 });
  }
}

/* === DAMAGE ==============================================================
   Two hit points, shown as ARMOUR, not as a bar (F21). The first hit
   physically removes the shoulder panel and it stays gone. There is no HUD
   health indicator anywhere in this game, by design.
   ========================================================================= */

function hurtScrap(fromX) {
  if (S.invuln > 0 || S.dead || S.ending) return;
  S.hp--;
  S.invuln = PH.invuln;
  S.hurtT = 22;
  S.rolling = false; S.stomping = false; S.clamped = null;
  const away = S.x < fromX ? -1 : 1;
  if (!S.inCart) { S.vx = away * 2.6; S.vy = -3.2; S.onGround = false; }
  shake(4);

  if (S.hp <= 0) { killScrap(false); return; }

  SFX.hurt();
  if (S.panel) {
    // The panel flies off as a real physics object and never comes back.
    S.panel = false;
    emit({ x:S.x - S.face * 5, y:S.y - 14, vx:-S.face * 2.2 + Math.random(), vy:-3.4,
           life:110, grav:0.32, drag:0.995, kind:'img', img:SCRAP_ANIM._panel, spin:0.22 });
    burst(S.x, S.y - 12, 10, { col:'#d97a45', sp0:0.8, sp1:2.6, grav:0.2, life0:12, life1:26 });
  }
}

/* === DEATH ===============================================================
   Unlimited attempts, respawn at the start of the CURRENT beat, no lives, no
   game-over screen (D6). Difficulty lives in the moment-to-moment, never in
   the retry cost.
   ========================================================================= */

function killScrap(silentFall) {
  if (S.dead || S.ending) return;
  S.dead = true;
  S.deadT = PH.respawnDelay;
  RUN.deaths++;
  SFX.die();
  setTread(0, false); setRoll(false, 0); setCartNoise(false, 0);
  shake(5);
  // He comes apart. The panel and a shower of plating.
  burst(S.x, S.y - 10, 26, { col:'#e8dcc4', sp0:1.0, sp1:3.6, grav:0.28, life0:20, life1:50 });
  burst(S.x, S.y - 10, 12, { col:'#d97a45', sp0:0.8, sp1:3.0, grav:0.3, life0:20, life1:46 });
  burst(S.x, S.y - 12, 8, { col:'#6fe3d4', sp0:0.6, sp1:2.2, grav:0.1, life0:16, life1:34, add:true });
  emit({ x:S.x, y:S.y - 14, vx:-1.8, vy:-3.8, life:120, grav:0.32, kind:'img',
         img:SCRAP_ANIM._panel, spin:0.26 });
}

/* `R` is a convenience, not a death: it does NOT increment the counter. It
   must work from every state including pause, cart and boss - that is the
   anti-soft-lock guarantee (DATA.md must-never #1). */
function retryBeat(countDeath) {
  const b = BEATS[RUN.beat - 1];
  if (countDeath) RUN.deaths++;
  respawnAt(b);
}

function respawnAt(b) {
  clearParticles();
  scrapReset(b.spawnPt);
  spawnEntities();
  cam.x = clamp(S.x - VIEW_W / 2, 0, LW * TS - VIEW_W);
  cam.y = clamp(S.y - VIEW_H * 0.62, 0, LH * TS - VIEW_H);
  cam.shake = 0;
  RUN.lightsOut = 0; RUN.vista = 0; RUN.vistaT = 0;
  RUN.pursuit = false; RUN.collapseX = 0;
  setCartNoise(false, 0);

  /* Beat 4 always starts back on the trolley, reset (G3).

     These three were INVERTED, and it broke the back half of the game (D34).
     The rule is: a set-piece trigger is spent ONLY when this respawn has
     already started that set piece by hand, just below. Respawning anywhere
     else must leave it ARMED so that walking in later still fires it.

     Written as `b.id !== 4` it did the exact opposite. Every run begins with
     respawnAt(BEATS[0]), so from the first frame of a new game the cart, the
     pursuit and THE WARDEN were all flagged as already fired - and
     updateTriggers skips a fired trigger forever. Walk into the metro and no
     trolley arrives; walk into the arena and no boss arrives. Both were
     reported from real play.

     It survived every test because the boss and the cart were only ever
     verified by respawning DIRECTLY into their beat, which takes the
     hand-started path below and never consults the trigger at all. */
  for (const t of LV.triggers) {
    if (t.kind === 'lights-out' || t.kind === 'vista' || t.kind === 'wave-hint') t.fired = false;
    if (t.kind === 'board-cart')    t.fired = b.id === 4;
    if (t.kind === 'pursuit-start') t.fired = b.id === 5;
    if (t.kind === 'warden-start')  t.fired = b.id === 6;
  }
  if (b.id === 4) boardCart();
  if (b.id === 5) { RUN.pursuit = true; RUN.collapseX = S.x - 190; }
  if (b.id === 6) wardenStart();
  else { W.alive = false; RUN.wardenOn = false; }
  // Only on a fresh run - replaying a 1.6s boot animation every time the player
  // presses R in beat 1 is a lock-out, not a flourish.
  if (b.id === 1 && RUN.ticks === 0 && !RUN.started) S.bootT = 96;
  musicSet(b.music);
  SFX.respawn();
}

/* === CAMERA ==============================================================
   Deadzone, velocity look-ahead, exponential smoothing, and a vertical SNAP on
   landing - a camera that lags on landing feels seasick, and the snap is the
   fix that is easiest to leave out (F6).

   All of this runs inside the fixed step, so "0.12 per tick" means per tick
   (C4 in AUDIT.md).
   ========================================================================= */

const cam = { x:0, y:0, tx:0, ty:0, shake:0, zoom:1, zoomT:1 };

function shake(n) { cam.shake = Math.max(cam.shake, n); }

function updateCamera() {
  const lookAhead = clamp(S.vx * 15, -40, 40);
  let wantX = S.x + lookAhead - VIEW_W / 2;
  let wantY = S.y - VIEW_H * 0.62;

  // Deadzone: 48x32 around the target, so tiny movements do not shift the view.
  if (Math.abs(wantX - cam.tx) > 24) cam.tx = wantX + sign(cam.tx - wantX) * 24;
  if (Math.abs(wantY - cam.ty) > 16) cam.ty = wantY + sign(cam.ty - wantY) * 16;

  cam.x = lerp(cam.x, cam.tx, 0.12);
  // The landing snap.
  cam.y = lerp(cam.y, cam.ty, (S.onGround && !S.wasOnGround) ? 0.34 : 0.12);

  const maxX = LW * TS - VIEW_W, maxY = LH * TS - VIEW_H;
  cam.x = clamp(cam.x, 0, maxX); cam.tx = clamp(cam.tx, 0, maxX);
  cam.y = clamp(cam.y, 0, maxY); cam.ty = clamp(cam.ty, 0, maxY);

  if (cam.shake > 0) cam.shake = Math.max(0, cam.shake - cam.shake / 8 - 0.12);
  cam.zoom = lerp(cam.zoom, cam.zoomT, 0.05);
}

/* === WILDLIFE ============================================================
   Birds, a deer, rats (F53). ZERO gameplay effect (D4) - they cannot hurt
   SCRAP and he cannot touch them. This is tone work only: it is what says the
   world is dead but not empty.
   ========================================================================= */

const wild = [];
function seedWildlife() {
  wild.length = 0;
  const rnd = mulberry32(7777);
  for (let i = 0; i < 26; i++) {
    const x = 200 + rnd() * 5200;
    wild.push({ kind:'bird', x, y:GY * TS - 40 - rnd() * 90, vx:0, vy:0,
                spooked:false, frame:0, t:(rnd() * 60) | 0, home:x });
  }
  for (let i = 0; i < 4; i++)
    wild.push({ kind:'deer', x:400 + rnd() * 1400, y:GY * TS, vx:0, spooked:false, t:0 });
  for (let i = 0; i < 14; i++)
    wild.push({ kind:'rat', x:600 + rnd() * 5000, y:GY * TS - 1, vx:0, dir:1, frame:0, t:0 });
}

function updateWildlife() {
  for (const a of wild) {
    if (Math.abs(a.x - S.x) > VIEW_W) { a.spooked = false; continue; }
    a.t++;
    if (a.kind === 'bird') {
      if (!a.spooked && Math.abs(a.x - S.x) < 60 && Math.abs(a.y - S.y) < 90) {
        a.spooked = true;
        a.vx = (a.x < S.x ? -1 : 1) * (0.8 + Math.random() * 1.2);
        a.vy = -1.4 - Math.random();
      }
      if (a.spooked) {
        a.x += a.vx; a.y += a.vy;
        a.vy += 0.012;
        a.vy = Math.min(a.vy, -0.25);
        if (a.t % 4 === 0) a.frame = (a.frame + 1) % 3;
      } else if (a.t % 20 === 0) {
        a.frame = 1;
      }
    } else if (a.kind === 'deer') {
      if (!a.spooked && Math.abs(a.x - S.x) < 150) { a.spooked = true; a.vx = -1.9; }
      if (a.spooked) a.x += a.vx;
    } else if (a.kind === 'rat') {
      if (Math.abs(a.x - S.x) < 90) { a.dir = a.x < S.x ? -1 : 1; a.x += a.dir * 1.5; }
      if (a.t % 5 === 0) a.frame = (a.frame + 1) % 2;
    }
  }
}

/* === SCENE ===============================================================
   Triggers, the pursuit, and the world renderer.
   ========================================================================= */

/* ---- triggers ---- */
function updateTriggers() {
  for (const t of LV.triggers) {
    if (t.fired) continue;
    if (S.x < t.x || S.x > t.x + t.w) continue;
    t.fired = true;
    if (t.kind === 'board-cart') boardCart();
    if (t.kind === 'pursuit-start') startPursuit();
    if (t.kind === 'warden-start') wardenStart();
    if (t.kind === 'lights-out') { RUN.lightsOut = 1; SFX.crack(); }
    if (t.kind === 'vista') { RUN.vista = 1; RUN.vistaT = 0; }
  }
  // Leaving the lights-out stretch brings the power back.
  if (RUN.lightsOut) {
    const lt = LV.triggers.find(t => t.kind === 'lights-out');
    if (lt && (S.x < lt.x - 30 || S.x > lt.x + lt.w + 30)) RUN.lightsOut = 0;
  }
  /* The vista (F41): the camera lifts to show the whole dead skyline, holds,
     and returns. Implemented as a camera LIFT rather than a zoom-out, so the
     pixel grid stays exact - a fractional zoom would resample every sprite for
     90 ticks and undo the whole look. */
  if (RUN.vista) {
    RUN.vistaT++;
    if (RUN.vistaT > 200) RUN.vista = 0;
  }
}

function startPursuit() {
  RUN.pursuit = true;
  RUN.collapseX = S.x - 210;
  musicSet('pursuit');
  SFX.collapse();
  shake(6);
  setRumble(1);
}

function updatePursuit() {
  if (!RUN.pursuit) return;
  // The collapse always stays BEHIND the player. It is pressure, not a hazard
  // to dodge (BUILD-PLAN step 34). Slightly slower than a comfortable run.
  RUN.collapseX += 2.15;
  if (RUN.collapseX > S.x - 90) RUN.collapseX = lerp(RUN.collapseX, S.x - 90, 0.04);
  if (S.x < RUN.collapseX + 6) killScrap(true);

  // Rolling debris and loose wheels, chasing him downhill.
  if (G.tick % 96 === 0) {
    ents.push({ type:'roller', x:RUN.collapseX + 30, y:S.y - 40, vx:3.0, vy:0,
                w:16, h:16, dead:false, frame:0, t:0 });
  }
  if (G.tick % 3 === 0) {
    burst(RUN.collapseX + Math.random() * 40, S.y - Math.random() * 80, 2,
          { col:'#4a4e55', sp0:0.3, sp1:1.4, grav:0.05, life0:24, life1:54, kind:'smoke' });
  }
  setRumble(clamp(1 - (S.x - RUN.collapseX) / 260, 0.15, 1));
  if (S.x > BEATS[5].x0) { RUN.pursuit = false; setRumble(0); }
}

function updateRoller(e) {
  e.t++;
  e.vy = Math.min(9, e.vy + PH.grav);
  const o = { x:e.x, y:e.y, w:14, h:14, vx:e.vx, vy:e.vy };
  const hit = moveActor(o, e.vx, e.vy);
  e.x = o.x; e.y = o.y; e.vy = o.vy;
  if (hit.floor) e.vy = -1.6;                       // it bounces as it rolls
  if (hit.wall) e.vx *= 0.5;
  e.frame = (e.frame + 1) % 4;
  if (e.t % 6 === 0)
    burst(e.x, e.y + 6, 1, { col:'#6b6f76', sp0:0.2, sp1:0.8, grav:0.05, life0:12, life1:24, kind:'smoke' });
  const rb = { l:e.x - 7, r:e.x + 7, t:e.y - 7, b:e.y + 7 };
  if (overlap(rb, hbox(S))) {
    // Rolling debris answers to the same rules as everything else, or the pause
    // screen's "land on anything from above" would be a lie in beat 5.
    const fromAbove = S.vy > 0 && S.prevY <= rb.t + 7;
    if (S.rolling || S.stomping || fromAbove) {
      e.dead = true;
      SFX.enemyDie();
      if (fromAbove && !S.stomping) { S.vy = -5.4; S.airJumpsLeft = PH.airJumps; }
      burst(e.x, e.y, 12, { col:'#4a4a50', sp0:0.8, sp1:2.6, grav:0.2, life0:12, life1:28 });
    } else hurtScrap(e.x);
  }
  if (e.x > S.x + VIEW_W || e.y > LH * TS) e.dead = true;
}

/* ---- environment crossfade ---- */
const ENVX = { cur:ENV.OUTDOOR, prev:ENV.OUTDOOR, mix:1 };
function updateEnv(beat) {
  if (beat.env !== ENVX.cur) { ENVX.prev = ENVX.cur; ENVX.cur = beat.env; ENVX.mix = 0; }
  ENVX.mix = Math.min(1, ENVX.mix + 1 / 60);
}

/* ---- the world renderer ---- */
function drawLayerSet(c, env, camX, camY, alpha) {
  c.globalAlpha = alpha;
  c.drawImage(BG.sky[env], 0, 0);
  for (const L of BG.layers[env]) {
    const off = -(camX * L.scroll) % STRIP_W;
    const y = Math.round(L.y - camY * L.scroll * 0.35);
    for (let x = Math.round(off) - STRIP_W; x < VIEW_W; x += STRIP_W)
      c.drawImage(L.img, x, y);
  }
  c.globalAlpha = 1;
}

function drawForeLayer(c, env, camX, alpha) {
  const F = BG.fore[env];
  c.globalAlpha = alpha * 0.9;
  const off = -(camX * F.scroll) % STRIP_W;
  for (let x = Math.round(off) - STRIP_W; x < VIEW_W; x += STRIP_W) {
    c.drawImage(F.img, x, 0);
  }
  c.globalAlpha = 1;
}

function drawTiles(c, camX, camY) {
  const tx0 = Math.max(0, Math.floor(camX / TS));
  const tx1 = Math.min(LW - 1, Math.ceil((camX + VIEW_W) / TS));
  const ty0 = Math.max(0, Math.floor(camY / TS));
  const ty1 = Math.min(LH - 1, Math.ceil((camY + VIEW_H) / TS));
  for (let ty = ty0; ty <= ty1; ty++) {
    const row = ty * LW;
    const sy = ty * TS - camY;
    for (let tx = tx0; tx <= tx1; tx++) {
      const t = LV.tiles[row + tx];
      if (!t) continue;
      const set = TILES[t];
      if (!set) continue;
      c.drawImage(set[LV.variant[row + tx]], tx * TS - camX, sy);
    }
  }
}

function drawSprite(c, img, x, y, face, sx, sy) {
  // Left-facing art is a separately baked frame, never a flipped blit - see
  // the SHADE section header for why.
  const w = img.width, h = img.height;
  if ((sx === undefined || sx === 1) && (sy === undefined || sy === 1)) {
    c.drawImage(img, Math.round(x - w / 2), Math.round(y - h));
    return;
  }
  const dw = w * sx, dh = h * sy;
  c.drawImage(img, Math.round(x - dw / 2), Math.round(y - dh), Math.round(dw), Math.round(dh));
}

function drawScrap(c, camX, camY) {
  if (S.dead) return;
  const a = SCRAP_ANIM[S.anim] || SCRAP_ANIM.idle;
  const frames = S.panel ? a.frames : a.framesNoPanel;
  const f = frames[Math.min(S.animFrame, frames.length - 1)];
  const img = S.face > 0 ? f.r : f.l;
  const x = S.x - camX, y = S.y - camY;

  // The contact shadow (the fourth trick in SHADE). Scales with height above
  // the ground; nothing else sells weight like it.
  let gap = 0;
  for (let d = 0; d < 90; d += 3) {
    if (solidSpan(S.x - 5, S.x + 5, S.y + d, S.y + d + 2)) break;
    gap = d;
  }
  const sh = contactShadow(Math.max(8, Math.round(18 - gap * 0.14)));
  c.globalAlpha = clamp(0.85 - gap / 110, 0.10, 0.85);
  c.drawImage(sh, Math.round(x - sh.width / 2), Math.round(y + gap - sh.height / 2 + 1));
  c.globalAlpha = 1;

  // The invulnerability flash. Never a full-screen flash; just the sprite.
  if (S.invuln > 0 && (S.invuln >> 1) % 3 === 0) return;

  drawSprite(c, img, x, y + 3, S.face, S.sqX, S.sqY);

  // A soft additive glow on the optic. The only cool colour in a warm palette,
  // which is why the eye finds SCRAP instantly, every frame.
  const eye = S.face > 0 ? f.eye : f.eyeL;
  const lit = f.lit === undefined ? 1 : f.lit;
  if (lit > 0.05) {
    const ex = Math.round(x - img.width / 2 + eye[0] * S.sqX);
    const ey = Math.round(y + 3 - img.height * S.sqY + eye[1] * S.sqY);
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.28 * lit;
    c.fillStyle = '#6fe3d4';
    c.beginPath(); c.arc(ex, ey, 4.5, 0, 6.284); c.fill();
    c.globalAlpha = 0.16 * lit;
    c.beginPath(); c.arc(ex, ey, 8, 0, 6.284); c.fill();
    c.restore();
  }

  // Muzzle flash, on the frames right after a shot.
  if (S.muzzle > 0) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = S.muzzle / 5;
    c.fillStyle = '#8ef0ff';
    const mx = x + S.aimX * 10, my = y - 11 + S.aimY * 7;
    c.fillRect(Math.round(mx - 2), Math.round(my - 1), 4, 2);
    c.beginPath(); c.arc(mx, my, 3.4, 0, 6.284); c.fill();
    c.restore();
  }
}

/* The death beat, drawn (D30). Three phases matching updateDying():
   a squashed white flash, then a spinning fade-out. The flash is two ADDITIVE
   re-draws of the same frame rather than a white-tinted copy of every enemy
   sprite - same read, no extra atlas space, and it works for any enemy. */
function drawDyingEnt(c, e, img, x, y) {
  const cy = (e.type === 'watcher') ? y : y + 2 - img.height / 2;
  const ox = -(img.width >> 1), oy = -(img.height >> 1);
  c.save();
  c.translate(Math.round(x), Math.round(cy));
  if (e.dyingT <= 4) {
    const k = e.dyingT / 4;
    c.scale(1 + 0.5 * (1 - k), 1 - 0.5 * (1 - k));   // squashed flat by the hit
    c.drawImage(img, ox, oy);
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 1 - k * 0.5;
    c.drawImage(img, ox, oy);
    c.drawImage(img, ox, oy);
  } else {
    const k = (e.dyingT - 4) / (DIE_TICKS - 4);
    c.globalAlpha = clamp(1 - k * k, 0, 1);          // holds bright, then goes fast
    c.rotate(e.drot);
    c.drawImage(img, ox, oy);
  }
  c.restore();
  c.globalAlpha = 1;
  c.globalCompositeOperation = 'source-over';
}

function drawEnt(c, e, camX, camY) {
  const x = e.x - camX, y = e.y - camY;
  if (x < -70 || x > VIEW_W + 70) return;
  const L = e.face < 0;

  if (e.type === 'scrap') {
    const bob = Math.sin((G.tick + e.idx * 11) / 70 * Math.PI * 2) * 2;
    c.drawImage(ART.scrap, Math.round(x - 6), Math.round(y - 6 + bob));
    // The moving glint. Motion is what makes a pickup catch the eye.
    const gl = (G.tick + e.idx * 7) % 90;
    if (gl < 10) {
      c.save(); c.globalCompositeOperation = 'lighter';
      c.fillStyle = '#fff6e2';
      c.fillRect(Math.round(x - 4 + gl * 0.7), Math.round(y - 4 + bob), 1, 1);
      c.restore();
    }
    return;
  }
  if (e.type === 'fuse') {
    const bob = Math.sin(G.tick / 60 * Math.PI * 2) * 2;
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.22 + Math.sin(G.tick / 18) * 0.06;
    c.fillStyle = '#f2c14e';
    c.beginPath(); c.arc(x, y - 6 + bob, 11, 0, 6.284); c.fill();
    c.restore();
    c.drawImage(ART.fuse, Math.round(x - 8), Math.round(y - 14 + bob));
    text(c, FUSE_LETTERS[e.fuseIdx], x - 1, y - 11 + bob, '#54241a', { scale:1 });
    return;
  }
  if (e.type === 'debris' || e.type === 'roller') {
    if (e.type === 'debris' && e.warn > 0) {
      // Telegraphed before anything solid falls (DATA.md must-never #2).
      c.save();
      c.globalAlpha = 0.35 + Math.sin(G.tick / 4) * 0.2;
      c.fillStyle = '#e04b3a';
      c.fillRect(Math.round(x - 8), Math.round(ARENA_FLOOR - camY - 2), 16, 2);
      c.restore();
      return;
    }
    c.drawImage(ART.debrisWheel[e.frame], Math.round(x - 11), Math.round(y - 11));
    return;
  }
  if (e.dormant) {
    c.drawImage(ART.car, Math.round(x - 29), Math.round(y - 26));
    return;
  }

  let img = null;
  if (e.type === 'skitter') img = ART.skitter[e.frame][L ? 'l' : 'r'];
  else if (e.type === 'husk' || e.type === 'husk-ambush')
    img = (e.stun > 0 ? ART.huskStun[(G.tick >> 3) % 2] : ART.husk[e.frame])[L ? 'l' : 'r'];
  else if (e.type === 'watcher')
    img = (e.charge > 0 ? ART.watcherCharge[(G.tick >> 2) % 2] : ART.watcher[e.frame])[L ? 'l' : 'r'];
  if (!img) return;

  if (e.dying) { drawDyingEnt(c, e, img, x, y); return; }

  if (e.type === 'watcher') {
    c.drawImage(img, Math.round(x - img.width / 2), Math.round(y - img.height / 2));
  } else {
    // Enemies get a contact shadow too, so they sit in the world.
    const sh = contactShadow(Math.max(8, e.w));
    c.globalAlpha = 0.5;
    c.drawImage(sh, Math.round(x - sh.width / 2), Math.round(y - sh.height / 2 + 1));
    c.globalAlpha = 1;
    drawSprite(c, img, x, y + 2, e.face);
  }
  // Charging WATCHER: a red bloom, mirroring the audio telegraph.
  if (e.type === 'watcher' && e.charge > 0) {
    c.save(); c.globalCompositeOperation = 'lighter';
    c.globalAlpha = clamp(e.charge / 40, 0, 1) * 0.4;
    c.fillStyle = '#e04b3a';
    c.beginPath(); c.arc(x, y + 4, 4 + e.charge / 4, 0, 6.284); c.fill();
    c.restore();
  }
}

function drawWardenSprite(c, camX, camY) {
  if (!W.alive) return;
  const x = W.x - camX, y = W.y - camY;

  // Two arms, drawn from a bank of baked angles so the light stays consistent.
  const ai = clamp(Math.round((W.armAng + 0.35) / 1.9 * (ARM_ANGLES - 1)), 0, ARM_ANGLES - 1);
  const arm = ART.wardenArm[ai].img;
  c.drawImage(arm, Math.round(x - 36 - 8), Math.round(y + 44 - 8));
  c.save();
  c.translate(Math.round(x + 36 + 8), Math.round(y + 44 - 8)); c.scale(-1, 1);
  c.drawImage(arm, -8, 0);
  c.restore();

  const body = ART.warden[Math.min(2, W.dmg)];
  c.drawImage(body, Math.round(x - body.width / 2), Math.round(y));

  // The optic. Its pulse mirrors the telegraph tone exactly.
  const p = W.state === 'telegraph' ? wardenTelegraphPulse()
          : (W.low ? 0.35 + Math.sin(G.tick / 10) * 0.15 : 0.5 + Math.sin(G.tick / 26) * 0.2);
  c.save();
  c.globalCompositeOperation = 'lighter';
  c.globalAlpha = 0.30 + p * 0.45;
  c.fillStyle = W.low ? '#ffd0c4' : '#e04b3a';
  c.beginPath(); c.arc(x, y + 15, 9 + p * 7, 0, 6.284); c.fill();
  c.globalAlpha = 0.12 + p * 0.2;
  c.beginPath(); c.arc(x, y + 15, 20 + p * 12, 0, 6.284); c.fill();
  c.restore();

  // When it is LOW its optic housing is the target. Say so, without a UI.
  if (W.low && W.invuln <= 0) {
    c.save();
    c.globalAlpha = 0.5 + Math.sin(G.tick / 6) * 0.25;
    c.strokeStyle = '#6fe3d4';
    c.lineWidth = 1;
    c.strokeRect(Math.round(x - 17) + 0.5, Math.round(y + 6) + 0.5, 34, 16);
    c.restore();
  }
  if (W.hitFlash > 0) {
    c.save(); c.globalCompositeOperation = 'lighter';
    c.globalAlpha = W.hitFlash / 16 * 0.5;
    c.fillStyle = '#fff6e2';
    c.fillRect(Math.round(x - 50), Math.round(y), 100, 74);
    c.restore();
  }
  // The beam.
  if (W.state === 'beam' && W.t > 6 && W.t < 56) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.55 + Math.sin(G.tick / 3) * 0.2;
    for (let yy = y + 40; yy < ARENA_FLOOR - camY; yy += 8)
      c.drawImage(ART.beamSeg, Math.round(x - 6), Math.round(yy));
    c.restore();
  }
  // Health, told through the boss itself: three lamps per phase on the livery.
  for (let i = 0; i < 9; i++) {
    const on = i < W.hp;
    c.fillStyle = on ? '#f2c14e' : '#2c2f35';
    c.fillRect(Math.round(x - 34 + i * 8), Math.round(y + 60), 5, 3);
  }
}

function drawWildlife(c, camX, camY) {
  for (const a of wild) {
    const x = a.x - camX, y = a.y - camY;
    if (x < -30 || x > VIEW_W + 30) continue;
    if (a.kind === 'bird') c.drawImage(ART.bird[a.frame], Math.round(x - 4), Math.round(y - 3));
    else if (a.kind === 'deer') {
      c.globalAlpha = 0.85;
      c.drawImage(ART.deer, Math.round(x - 16), Math.round(y - 28));
      c.globalAlpha = 1;
    } else c.drawImage(ART.rat[a.frame], Math.round(x - 5), Math.round(y - 6));
  }
}

function drawProps(c, camX, camY, front) {
  for (const p of LV.props) {
    if (!!p.front !== !!front) continue;
    const x = p.x - camX, y = p.y - camY;
    if (x < -140 || x > VIEW_W + 140) continue;
    c.globalAlpha = p.back ? 0.55 : 1;
    c.drawImage(p.img, Math.round(x), Math.round(y));
    c.globalAlpha = 1;
  }
}

function drawWorldFurniture(c, camX, camY) {
  for (const cb of LV.cables) {
    const x = Math.round(cb.x - camX);
    if (x < -20 || x > VIEW_W + 20) continue;
    for (let y = cb.y0 - 14; y < cb.y1; y += 8)
      c.drawImage(ART.cableSeg, x - 3, Math.round(y - camY));
    c.drawImage(ART.rebar, x - 8, Math.round(cb.y0 - 18 - camY));
  }
  for (const t of LV.tubes) {
    c.drawImage(ART.tube, Math.round(t.x - camX - 2), Math.round(t.y - camY - 2));
    if (t.cooldown > 20) {
      c.save(); c.globalCompositeOperation = 'lighter';
      c.globalAlpha = 0.4;
      c.fillStyle = '#f2c14e';
      c.beginPath(); c.arc(t.x - camX + 12, t.y - camY, 8, 0, 6.284); c.fill();
      c.restore();
    }
  }
  for (const ty of LV.tyres) {
    const img = ty.squash > 0 ? ART.tyreSquash : ART.tyre;
    c.drawImage(img, Math.round(ty.x - camX - 2), Math.round(ty.y - 20 - camY));
  }
  // Ammo crates: a soft cyan glow so they read as "yours" at a glance, and a
  // slow bob once they have settled so they never look like scenery.
  for (const cr of crates) {
    const x = Math.round(cr.x - camX);
    const y = Math.round(cr.y - camY + (cr.rest ? Math.sin(cr.bob) * 1.5 : 0));
    if (x < -20 || x > VIEW_W + 20) continue;
    c.save(); c.globalCompositeOperation = 'lighter';
    c.globalAlpha = cr.rest ? 0.20 + Math.sin(cr.bob) * 0.06 : 0.3;
    c.fillStyle = '#8ef0ff';
    c.beginPath(); c.arc(x, y - 5, 7.5, 0, 6.284); c.fill();
    c.restore();
    c.drawImage(ART.ammo, x - (ART.ammo.width >> 1), y - ART.ammo.height + 2);
  }

  // Laser bolts: a bright core with a trail behind it, so speed is legible.
  c.save();
  c.globalCompositeOperation = 'lighter';
  for (const b of bolts) {
    const x = Math.round(b.x - camX), y = Math.round(b.y - camY);
    if (x < -20 || x > VIEW_W + 20) continue;
    // Drawn along its own velocity, so an upward shot reads as an upward shot.
    c.save();
    c.translate(x, y);
    c.rotate(Math.atan2(b.vy, b.vx));
    c.globalAlpha = 0.30; c.fillStyle = '#3fb6d8'; c.fillRect(-11, -2, 14, 4);
    c.globalAlpha = 0.85; c.fillStyle = '#8ef0ff'; c.fillRect(-7, -1, 10, 2);
    c.globalAlpha = 1;    c.fillStyle = '#f2fdff'; c.fillRect(-2, -1, 4, 1);
    c.restore();
  }
  c.restore();
  c.globalAlpha = 1;
  for (const s of shots) {
    const x = Math.round(s.x - camX), y = Math.round(s.y - camY);
    c.drawImage(ART.shot, x - 5, y - 5);
  }
}

/* ---- atmosphere: god rays, the lights-out mask, the vignette ---- */
function drawAtmosphere(c, env, camX, camY) {
  // God rays (F48). Additive shafts, angled to match the one light direction.
  if (env === ENV.OUTDOOR || env === ENV.ARENA || env === ENV.MALL) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    const warm = env === ENV.ARENA ? '255,208,138' : '246,217,168';
    // A gradient across each shaft, not a flat fill - a hard-edged parallelogram
    // reads as a rendering artefact rather than as light.
    for (let i = 0; i < 4; i++) {
      let x = ((i * 260) - (camX * 0.35)) % 900;
      if (x < -200) x += 900;
      const peak = env === ENV.MALL ? 0.055 : 0.085;
      const g = c.createLinearGradient(x - 130, 0, x + 46, 0);
      g.addColorStop(0,    'rgba(' + warm + ',0)');
      g.addColorStop(0.45, 'rgba(' + warm + ',' + peak.toFixed(3) + ')');
      g.addColorStop(1,    'rgba(' + warm + ',0)');
      c.fillStyle = g;
      c.beginPath();
      c.moveTo(x, -10); c.lineTo(x + 46, -10);
      c.lineTo(x - 60, VIEW_H + 10); c.lineTo(x - 130, VIEW_H + 10);
      c.closePath(); c.fill();
    }
    c.restore();
  }

  // The lights-out section (F40). Fades over 30 ticks - NEVER a flash
  // (accessibility, DESIGN.md).
  if (RUN.lightsOut > 0 || RUN.lightsFade > 0) {
    RUN.lightsFade = approach(RUN.lightsFade, RUN.lightsOut ? 1 : 0, 1 / 30);
    const a = RUN.lightsFade;
    if (a > 0.001) {
      const sx = S.x - camX, sy = S.y - camY - 9;
      const g = c.createRadialGradient(sx, sy, 6, sx, sy, 96);
      g.addColorStop(0, 'rgba(10,11,15,0)');
      g.addColorStop(0.55, 'rgba(10,11,15,' + (0.55 * a).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(10,11,15,' + (0.94 * a).toFixed(3) + ')');
      c.fillStyle = g;
      c.fillRect(0, 0, VIEW_W, VIEW_H);
    }
  }

  // A quiet vignette everywhere, so the frame has edges.
  c.save();
  const vg = c.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.42,
                                    VIEW_W / 2, VIEW_H / 2, VIEW_W * 0.72);
  vg.addColorStop(0, 'rgba(10,11,15,0)');
  vg.addColorStop(1, 'rgba(10,11,15,0.34)');
  c.fillStyle = vg;
  c.fillRect(0, 0, VIEW_W, VIEW_H);
  c.restore();
}

function drawPursuitWall(c, camX, camY) {
  if (!RUN.pursuit) return;
  const x = Math.round(RUN.collapseX - camX);
  if (x < -80 || x > VIEW_W) return;
  const g = c.createLinearGradient(x - 60, 0, x + 30, 0);
  g.addColorStop(0, 'rgba(10,11,15,0.98)');
  g.addColorStop(0.6, 'rgba(30,26,24,0.75)');
  g.addColorStop(1, 'rgba(40,32,28,0)');
  c.fillStyle = g;
  c.fillRect(x - 90, 0, 120, VIEW_H);
  // THE WARDEN's red optic lighting the tunnel from behind, casting SCRAP as a
  // silhouette. The only place the danger hue floods the frame.
  c.save();
  c.globalCompositeOperation = 'lighter';
  c.globalAlpha = 0.20 + Math.sin(G.tick / 12) * 0.05;
  const rg = c.createRadialGradient(x - 20, VIEW_H * 0.5, 8, x - 20, VIEW_H * 0.5, 220);
  rg.addColorStop(0, 'rgba(224,75,58,0.85)');
  rg.addColorStop(1, 'rgba(224,75,58,0)');
  c.fillStyle = rg;
  c.fillRect(0, 0, VIEW_W, VIEW_H);
  c.restore();
}

/* ---- the HUD ------------------------------------------------------------
   Almost none, and that is the design (DESIGN.md). No health bar, no minimap,
   no tutorial popups.
   -------------------------------------------------------------------- */
function drawHUD(c) {
  /* Layout: life top-LEFT, ammo top-RIGHT, progress underneath.
     Hearts and ammo are the two numbers you check mid-fight, so they get the
     corners where the eye already goes. Scrap and fuses are progress rather
     than state, so they sit quieter below and still fade when idle. */

  // ---- hearts (F21, D28) ----
  // Empty hearts stay on screen: how many hits you have LOST should be as
  // readable as how many you have left.
  for (let i = 0; i < MAX_HP; i++) {
    const full = i < S.hp;
    // The last heart pulses when it is the only one left.
    const crit = full && S.hp === 1 && ((G.tick >> 3) & 1) === 0;
    c.globalAlpha = full ? 1 : 0.5;
    c.drawImage(full ? ART.heart : ART.heartEmpty, 6 + i * 9, 6 - (crit ? 1 : 0));
  }
  c.globalAlpha = 1;

  // ---- ammo (F18b) ----
  if (UIF.ammoPop > 0) UIF.ammoPop--;
  if (UIF.ammoEmpty > 0) UIF.ammoEmpty--;
  const dry  = UIF.ammoEmpty > 0 && ((UIF.ammoEmpty >> 2) & 1) === 0;
  const apop = UIF.ammoPop > 0 ? 1 : 0;
  const astr = String(S.ammo);
  const ax   = VIEW_W - 7 - textWidth(astr, 1);
  c.globalAlpha = S.ammo > 0 ? 1 : 0.55;
  c.drawImage(ART.bullet, ax - 8, 6 - apop);
  c.globalAlpha = 1;
  text(c, astr, ax, 6 - apop,
       dry ? '#e8404a' : (S.ammo > 0 ? '#8ef0ff' : '#7d8894'), { shadow:'#16323a' });

  // ---- scrap ----
  // Fades to 40% after 3s of no change, so it stops existing when it is not
  // relevant.
  UIF.scrapIdle++;
  if (UIF.scrapPop > 0) UIF.scrapPop--;
  const fade = UIF.scrapIdle > 180 ? 0.4 : 1;
  const pop = UIF.scrapPop > 0 ? 1 : 0;
  c.globalAlpha = fade;
  c.drawImage(ART.scrap, 6, 19 - pop);
  text(c, String(RUN.scrap), 19, 20 - pop, '#f2c14e', { shadow:'#2c2f35' });
  c.globalAlpha = 1;

  // ---- fuses: four letter slots, faint until found ----
  if (UIF.fusePop > 0) UIF.fusePop--;
  for (let i = 0; i < 4; i++) {
    const got = RUN.fuses[i];
    const popping = UIF.fusePop > 0 && UIF.fuseIdx === i;
    const yy = 31 - (popping ? 2 : 0);
    c.globalAlpha = got ? 1 : 0.2;
    text(c, FUSE_LETTERS[i], 7 + i * 8, yy, got ? '#f2c14e' : '#a8b6c4',
         { shadow: got ? '#54241a' : null, scale: popping ? 2 : 1 });
    c.globalAlpha = 1;
  }

  // ---- a one-line tip, when the game needs something you cannot guess ----
  if (UIF.tipT > 0 && UIF.tip) {
    const a = UIF.tipT > 60 ? 1 : UIF.tipT / 60;
    c.globalAlpha = a * 0.75;
    c.fillStyle = '#0d1016';
    c.fillRect(0, VIEW_H - 58, VIEW_W, 13);
    c.globalAlpha = a;
    text(c, UIF.tip, VIEW_W / 2, VIEW_H - 55, '#8ef0ff',
         { align:'centre', shadow:'#16323a' });
    c.globalAlpha = 1;
  }

  // ---- the beat name, briefly, on entry ----
  // DKC named its levels; so does this.
  if (UIF.beatName > 0) {
    UIF.beatName--;
    const a = UIF.beatName > 60 ? 1 : UIF.beatName / 60;
    c.globalAlpha = a;
    text(c, UIF.beatText, VIEW_W / 2, VIEW_H - 34, '#f6d9a8',
         { align:'centre', shadow:'#2c2f35' });
    c.globalAlpha = a * 0.5;
    c.fillStyle = '#f2c14e';
    c.fillRect(VIEW_W / 2 - 30, VIEW_H - 24, 60, 1);
    c.globalAlpha = 1;
  }
}

/* === SCREENS =============================================================
   TITLE, PLAY, PAUSE, ENDING, FINISH (JOURNEY.md). No loading screens
   anywhere, and no options screen - there is nothing to configure. Mute is a
   key; everything else is fixed.

   PAUSE is the tutorial. There are no popups or prompts during play, so every
   control has to be listed there or the player cannot discover it.
   ========================================================================= */

function setState(s) {
  G.state = s;
  G.stateTick = 0;
}

function fmtTime(ticks) {
  const total = ticks / 60;
  const m = Math.floor(total / 60);
  const s = Math.floor(total % 60);
  const cs = Math.floor((total * 100) % 100);
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s + '.' +
         (cs < 10 ? '0' : '') + cs;
}

/* ---- TITLE ---- */
const titleCam = { x:300 };

function startRun() {
  RUN.collected = new Set();
  RUN.fuses = [false, false, false, false];
  RUN.scrap = 0; RUN.deaths = 0; RUN.ticks = 0;
  RUN.started = false; RUN.beat = 1;
  RUN.lightsOut = 0; RUN.lightsFade = 0;
  RUN.vista = 0; RUN.vistaT = 0;
  RUN.pursuit = false; RUN.collapseX = 0;
  RUN.wardenOn = false; RUN.ended = false; RUN.cellTimer = 0;
  UIF.tip = ''; UIF.tipT = 0; UIF.tipsShown = {};
  W.alive = false;
  S.ending = false; S.endT = 0;
  seedWildlife();
  respawnAt(BEATS[0]);
  RUN.deaths = 0;                        // respawnAt does not count, but be sure
  UIF.beatText = BEATS[0].name; UIF.beatName = 150;
  setState(ST.PLAY);
}

function updateTitle() {
  titleCam.x += 0.22;
  musicSet('title');
  // A short grace period, or the press that chose QUIT TO TITLE immediately
  // starts a new run on the frame it arrives.
  if (G.stateTick < 24) { IN.anyPressed = false; return; }
  if (IN.anyPressed || IN.pressed.jump || IN.pressed.confirm) {
    SFX.uiBig();
    startRun();
  }
}

function drawTitle(c) {
  const camX = titleCam.x;
  drawLayerSet(c, ENV.OUTDOOR, camX, 60, 1);

  // A ground strip and a scrap heap for SCRAP to idle on.
  c.fillStyle = '#2c2f35';
  c.fillRect(0, VIEW_H - 34, VIEW_W, 34);
  for (let x = -(camX % 16); x < VIEW_W; x += 16)
    c.drawImage(TILES[T.GRASSY][2], Math.round(x), VIEW_H - 34);
  c.drawImage(ART.container, 300 - (camX % 90), VIEW_H - 78);
  c.drawImage(ART.tree, 30, VIEW_H - 122);

  // The logotype.
  const ty = 30 + Math.sin(G.tick / 90) * 1.5;
  c.drawImage(TITLE_ART, Math.round((VIEW_W - TITLE_ART.width) / 2), Math.round(ty));

  // SCRAP, idling, waving now and then.
  const useWave = (G.tick % 480) > 380;
  const a = useWave ? SCRAP_ANIM.wave : SCRAP_ANIM.idle;
  const fi = Math.floor(G.tick / (useWave ? 7 : 22)) % a.frames.length;
  const f = a.frames[fi];
  const sx = VIEW_W / 2 + 6, sy = VIEW_H - 34;
  const sh = contactShadow(18);
  c.globalAlpha = 0.7;
  c.drawImage(sh, Math.round(sx - sh.width / 2), Math.round(sy - sh.height / 2 + 1));
  c.globalAlpha = 1;
  c.drawImage(f.r, Math.round(sx - f.r.width / 2), Math.round(sy - f.r.height + 3));
  c.save();
  c.globalCompositeOperation = 'lighter';
  c.globalAlpha = 0.3;
  c.fillStyle = '#6fe3d4';
  c.beginPath(); c.arc(sx + 3, sy - 22, 5, 0, 6.284); c.fill();
  c.restore();

  const blink = (G.tick % 80) < 56;
  if (blink) text(c, 'PRESS ANY KEY', VIEW_W / 2, VIEW_H - 22, '#f6d9a8',
                  { align:'centre', shadow:'#2c2f35' });

  if (SAVE.bestTimeTicks) {
    text(c, 'BEST ' + fmtTime(SAVE.bestTimeTicks), 6, 6, '#a8b6c4', { alpha:0.8 });
    text(c, 'SCRAP ' + (SAVE.mostScrap || 0) + '   FUSES ' + (SAVE.mostFuses || 0),
         6, 15, '#a8b6c4', { alpha:0.6 });
  }
  text(c, A.muted ? 'M  SOUND OFF' : 'M  SOUND ON', VIEW_W - 6, 6,
       '#a8b6c4', { align:'right', alpha:0.5 });
  drawAtmosphere(c, ENV.OUTDOOR, camX, 60);
}

/* ---- PLAY ---- */
function updatePlay() {
  // The timer starts on the first MOVEMENT input, not on the keypress that
  // left the title - so a player who reads the pause screen first is not
  // penalised (JOURNEY.md).
  if (!RUN.started && (IN.held.left || IN.held.right || IN.pressed.jump) && S.bootT <= 0) {
    RUN.started = true;
  }
  if (RUN.started && !S.ending) RUN.ticks++;

  if (IN.pressed.pause) { openPause(); return; }
  if (IN.pressed.retry) { SFX.ui(); retryBeat(false); return; }

  const beat = beatAt(S.x);
  if (beat.id !== RUN.beat) {
    RUN.beat = beat.id;
