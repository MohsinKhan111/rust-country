    }
    for (let i = 0; i < 4; i++)
      P.ellipse(rnd() * TS, rnd() * TS, 1 + rnd() * 1.8, 1 + rnd() * 1.2,
                H.dome(0.30 + rnd() * 0.14, 0.10));
  }

  if (openTop) {
    // A raised lip along the top, falling away below. This one line is most of
    // what makes ground look like ground.
    P.rect(0, 0, TS, 5, H.slab(0.95, 0.5));
  }
  if (openL) P.rect(0, openTop ? 4 : 0, 3, TS - (openTop ? 4 : 0), H.bevel(0.84, 0.42));
  if (openR) P.rect(TS - 3, openTop ? 4 : 0, 3, TS - (openTop ? 4 : 0), H.flat(0.22));
  if (openBot) P.rect(0, TS - 3, TS, 3, H.flat(0.18));

  // Material character.
  if (type === T.CONCRETE || type === T.MALLFLOOR || type === T.ARENA) {
    for (let i = 0; i < 5; i++) {
      const x = rnd() * (TS - 3), y = (openTop ? 5 : 1) + rnd() * (TS - 7);
      P.rect(x, y, 1 + rnd() * 2, 1, H.flat(0.30 + rnd() * 0.12));
    }
    if (type === T.MALLFLOOR && openTop) {                 // tiled floor joints
      P.use('concrete');
      P.rect(7, 0, 1, 5, H.flat(0.26));
    }
  }
  if (type === T.RUSTMETAL || type === T.GIRDER) {
    for (let i = 0; i < 4; i++)                            // rivets
      P.ellipse(3 + i * 3.4, openTop ? 7 : 4, 1.1, 1.1, H.dome(0.8, 0.36));
    for (let i = 0; i < 3; i++) {
      const x = rnd() * (TS - 4), y = 8 + rnd() * 6;
      P.rect(x, y, 2 + rnd() * 3, 1, H.flat(0.24));        // corrosion streaks
    }
  }
  if (type === T.TUNNEL) {
    P.rect(0, openTop ? 6 : 2, TS, 1.4, H.flat(0.24));
    for (let i = 0; i < 3; i++) {
      const x = rnd() * (TS - 4);
      P.rect(x, 9 + rnd() * 5, 1.4, 2 + rnd() * 2, H.flat(0.2));
    }
  }
  if (type === T.WEAK) {
    // Weak floor panel: visibly cracked, so the stomp target is obvious.
    P.use('rust');
    P.rect(0, 0, TS, TS, H.flat(0.34));
    P.use('darkmetal');
    P.poly([[3,0],[6,7],[2,11],[5,16],[4,16],[1,11],[5,7],[2,0]], H.flat(0.14));
    P.poly([[11,0],[13,6],[9,12],[12,16],[11,16],[8,12],[12,6],[10,0]], H.flat(0.14));
    P.use('gold');
    P.rect(0, 0, TS, 1.4, H.flat(0.7));                    // hazard stripe
  }
  if (type === T.GRASSY && openTop) {
    // Overgrowth spilling over the lip. This is the world eating the city.
    P.use('green');
    P.rect(0, 0, TS, 3.2, H.slab(0.96, 0.5));
    for (let i = 0; i < 7; i++) {
      const x = rnd() * (TS - 2);
      const hgt = 2 + rnd() * 4;
      P.poly([[x, 3], [x + 1.4, 3], [x + 0.7 + rnd(), 3 - hgt]], H.flat(0.6 + rnd() * 0.3));
    }
  }
}

function buildTiles() {
  for (const key in TILE_MAT) {
    const type = key | 0;
    TILES[type] = [];
    for (let mask = 0; mask < 16; mask++) {
      const rnd = mulberry32(type * 977 + mask * 31 + 7);
      TILES[type][mask] = bake(TS, TS, P => drawTileVariant(P, type, mask, rnd),
                               { pad:0, relief:2.6, rim:0, outline:false });
    }
  }
}

/* === LAYERS ==============================================================
   Six parallax layers (F45, F46). Most of the depth in this game comes from
   here and it is nearly free: each layer is baked once as a wide tileable
   strip and blitted at an offset.

   Two things do the actual work:
     HAZE - each further layer is mixed toward #a8b6c4 and desaturated.
            Atmospheric perspective; the cheapest convincing depth cue there is.
     LAYER 5 - the foreground, scrolling at 1.45, FASTER than the play layer.
            Something passing in front of the player faster than they move is
            unmistakably closer than they are. In motion this is the single
            strongest cue in the game.

   Four environments, because a mall interior and a dawn skyline cannot share
   a backdrop. They crossfade at beat boundaries.
   ========================================================================= */

const ENV = { OUTDOOR:'OUTDOOR', MALL:'MALL', TUNNEL:'TUNNEL', ARENA:'ARENA' };
const STRIP_W = 960;
const FORE_H = VIEW_H;      // the foreground layer spans the full frame height
const BG = { sky:{}, layers:{}, fore:{} };

/* ---- sky ---- */
function buildSky(env) {
  const s = makeSurface(VIEW_W, VIEW_H);
  const c = s.ctx;
  const g = c.createLinearGradient(0, 0, 0, VIEW_H);

  if (env === ENV.OUTDOOR) {
    g.addColorStop(0.00, '#1b1f3a');
    g.addColorStop(0.34, '#3c3357');
    g.addColorStop(0.58, '#8a5560');
    g.addColorStop(0.78, '#e8955e');
    g.addColorStop(1.00, '#f6d9a8');
  } else if (env === ENV.ARENA) {
    g.addColorStop(0.00, '#4a5a86');
    g.addColorStop(0.30, '#9a7a86');
    g.addColorStop(0.58, '#e8a86a');
    g.addColorStop(0.80, '#ffd08a');
    g.addColorStop(1.00, '#fff0c4');
  } else if (env === ENV.MALL) {
    g.addColorStop(0.00, '#2a2f38');
    g.addColorStop(0.45, '#3a4048');
    g.addColorStop(1.00, '#22262d');
  } else {
    g.addColorStop(0.00, '#0f1216');
    g.addColorStop(0.60, '#14181e');
    g.addColorStop(1.00, '#0b0d11');
  }
  c.fillStyle = g;
  c.fillRect(0, 0, VIEW_W, VIEW_H);

  // Stars, fading out toward the warm horizon. Only where there is a sky.
  if (env === ENV.OUTDOOR || env === ENV.ARENA) {
    const rnd = mulberry32(env === ENV.OUTDOOR ? 4242 : 8484);
    const n = env === ENV.OUTDOOR ? 90 : 26;
    for (let i = 0; i < n; i++) {
      const x = rnd() * VIEW_W, y = rnd() * VIEW_H * 0.5;
      const a = (1 - y / (VIEW_H * 0.5)) * (0.15 + rnd() * 0.5);
      c.fillStyle = 'rgba(246,217,168,' + a.toFixed(3) + ')';
      c.fillRect(x | 0, y | 0, 1, 1);
    }
    // The dawn glow behind the city. Warm, low, and off to one side.
    const gx = env === ENV.OUTDOOR ? VIEW_W * 0.72 : VIEW_W * 0.5;
    const gy = env === ENV.OUTDOOR ? VIEW_H * 0.80 : VIEW_H * 0.68;
    const rg = c.createRadialGradient(gx, gy, 4, gx, gy, VIEW_W * 0.55);
    rg.addColorStop(0, env === ENV.ARENA ? 'rgba(255,240,196,0.75)' : 'rgba(246,217,168,0.42)');
    rg.addColorStop(1, 'rgba(246,217,168,0)');
    c.fillStyle = rg;
    c.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  return s.canvas;
}

/* ---- skyline generators ------------------------------------------------
   Deterministic, so the city is identical every run - a "hidden" collectible
   is not hidden if its scenery moves between sessions.
   --------------------------------------------------------------------- */

function drawSkylineFar(P, rnd) {
  P.use('concrete');
  let x = -10;
  while (x < STRIP_W + 10) {
    const w = 14 + rnd() * 40;
    const h = 30 + rnd() * 110;
    const broken = rnd() < 0.45;
    if (broken) {
      // A snapped-off tower. Jagged tops are what say "this city died".
      const pts = [[x, 200], [x, 200 - h]];
      const steps = 3 + (rnd() * 3 | 0);
      for (let i = 0; i <= steps; i++)
        pts.push([x + (w * i) / steps, 200 - h + (rnd() - 0.35) * 26]);
      pts.push([x + w, 200]);
      P.poly(pts, H.flat(0.5));
    } else {
      P.rect(x, 200 - h, w, h, H.flat(0.5));
      if (rnd() < 0.5) P.rect(x + w * 0.4, 200 - h - 14, 2.4, 14, H.flat(0.5));  // mast
    }
    x += w + 2 + rnd() * 14;
  }
  // A collapsed radio mast leaning across the skyline.
  P.use('darkmetal');
  P.poly([[300, 200], [306, 200], [372, 96], [366, 94]], H.flat(0.5));
  for (let i = 0; i < 9; i++) {
    const t = i / 9;
    P.rect(300 + t * 68, 198 - t * 104, 5, 1.6, H.flat(0.5));
  }
}

function drawSkylineMid(P, rnd) {
  let x = -20;
  while (x < STRIP_W + 20) {
    const w = 30 + rnd() * 56;
    const h = 46 + rnd() * 108;
    P.use(rnd() < 0.35 ? 'rust' : 'concrete');
    P.rect(x, 200 - h, w, h, H.cylX(0.72, 0.30));
    // Dark windows, in a grid, with a few missing. Never lit - nobody is home.
    P.use('darkmetal');
    const cols = Math.max(1, (w / 8) | 0), rows = Math.max(1, (h / 11) | 0);
    for (let cc = 0; cc < cols; cc++)
      for (let rr = 0; rr < rows; rr++) {
        if (rnd() < 0.22) continue;
        P.rect(x + 3 + cc * 8, 200 - h + 5 + rr * 11, 4, 6, H.flat(0.12));
      }
    // Trees bursting through roofs (DESIGN.md, mid-city layer).
    if (rnd() < 0.4) {
      P.use('green');
      P.ellipse(x + w * (0.2 + rnd() * 0.6), 200 - h - 4, 8 + rnd() * 9, 6 + rnd() * 5, H.dome(0.8, 0.3));
    }
    x += w + 4 + rnd() * 16;
  }
  // A tower crane, still standing over a job nobody finished.
  P.use('gold');
  P.rect(640, 40, 4, 160, H.cylX(0.8, 0.3));
  P.rect(560, 40, 170, 4, H.cylY(0.8, 0.3));
  P.use('darkmetal');
  P.rect(690, 44, 2, 26, H.flat(0.5));
}

function drawNearStructures(P, rnd, env) {
  if (env === ENV.MALL) {
    // Shopfronts and a dead atrium beyond.
    for (let x = 0; x < STRIP_W; x += 120) {
      P.use('concrete');
      P.rect(x, 60, 112, 140, H.cylX(0.76, 0.28));
      P.use('glass');
      P.rect(x + 8, 74, 96, 58, H.bevel(0.86, 0.4));
      P.use('darkmetal');
      P.rect(x + 8, 130, 96, 5, H.flat(0.3));
      for (let i = 0; i < 5; i++) P.rect(x + 14 + i * 20, 136, 14, 40, H.flat(0.24));
      P.use('rust');
      P.rect(x + 6, 62, 100, 10, H.slab(0.9, 0.44));           // fascia signage
      P.use('green');
      if (rnd() < 0.6) P.ellipse(x + 20 + rnd() * 70, 176, 14, 9, H.dome(0.8, 0.3));
    }
  } else if (env === ENV.TUNNEL) {
    // Pipe runs and cable trays down both sides of the bore.
    P.use('darkmetal');
    for (let i = 0; i < 4; i++) P.rect(0, 30 + i * 13, STRIP_W, 7, H.cylY(0.7, 0.2));
    P.use('rust');
    for (let x = 0; x < STRIP_W; x += 64) {
      P.rect(x, 26, 6, 90, H.cylX(0.7, 0.22));
      P.ellipse(x + 3, 118, 5, 3.4, H.dome(0.7, 0.24));
    }
    for (let x = 0; x < STRIP_W; x += 180) {
      P.use('gold');                                            // sparse emergency lamp
      P.ellipse(x + 40, 22, 4.4, 3, H.dome(0.95, 0.4));
    }
  } else {
    // Overpass supports, gantries, hanging cable, big foliage.
    for (let x = -40; x < STRIP_W + 40; x += 170) {
      P.use('concrete');
      P.rect(x, 96, 26, 110, H.cylX(0.82, 0.28));
      P.rect(x - 30, 84, 86, 14, H.slab(0.9, 0.42));
      P.use('rust');
      P.rect(x - 30, 98, 86, 4, H.flat(0.4));
      P.use('darkmetal');
      for (let i = 0; i < 6; i++) {
        const cx0 = x - 24 + i * 15;
        P.poly([[cx0, 102], [cx0 + 2, 102], [cx0 + 5, 118 + (i % 2) * 8], [cx0 + 3, 118 + (i % 2) * 8]], H.flat(0.36));
      }
      P.use('green');
      P.ellipse(x + 44, 104, 24, 15, H.dome(0.86, 0.26));
      P.ellipse(x - 22, 118, 18, 12, H.dome(0.84, 0.26));
    }
    for (let x = 20; x < STRIP_W; x += 96) {
      P.use('darkmetal');
      P.rect(x, 60, 3, 46, H.cylX(0.78, 0.24));                 // dangling cables
    }
  }
}

/* ---- the foreground layer (scroll 1.45) ----
   Kept SMALL and soft. An earlier version drew long tapered fronds and
   mirrored them along the bottom edge, which read as stalactites rather than
   foliage - the shapes were too large, too pointed and too opaque to be
   anything a plant would do. Small overlapping leaf clusters hanging from the
   top edge, plus a couple of cables, do the job at a fraction of the coverage. */
function drawForeground(P, rnd, env) {
  if (env === ENV.TUNNEL) {
    for (let x = 0; x < STRIP_W; x += 150) {
      P.use('darkmetal');
      P.rect(x, 0, 11, 30, H.flat(0.6));                        // girder edges overhead
      P.rect(x - 5, 24, 21, 7, H.flat(0.6));
    }
    return;
  }
  if (env === ENV.MALL) {
    for (let x = 0; x < STRIP_W; x += 210) {
      P.use('darkmetal');
      P.rect(x, 0, 6, 26, H.flat(0.6));
      P.ellipse(x + 3, 28, 9, 4, H.flat(0.6));                  // hanging light fittings
    }
    return;
  }
  // Leaf clusters along the top edge only.
  P.use('green');
  for (let x = 0; x < STRIP_W; x += 34) {
    const n = 2 + (rnd() * 3 | 0);
    for (let i = 0; i < n; i++) {
      const bx = x + rnd() * 30;
      const drop = 8 + rnd() * 16;
      const rx = 5 + rnd() * 6, ry = 3 + rnd() * 4;
      P.ellipse(bx, drop, rx, ry, H.flat(0.6));
      P.rect(bx - 0.7, 0, 1.4, drop, H.flat(0.6));              // the stem
    }
  }
  /* A few FULL-HEIGHT trunks and posts. These are the strongest depth cue in
     the game: something crossing the whole frame at 1.45x the player's own
     scroll rate is unmistakably in front of them. Sparse on purpose - roughly
     one every 300px, so they punctuate rather than obstruct. */
  P.use('bark');
  for (let x = 46; x < STRIP_W; x += 300) {
    const w = 8 + rnd() * 5;
    // Tapered, with a canopy and a branch. A bare parallel-sided bar read as a
    // rendering seam rather than as a tree.
    P.poly([[x, FORE_H], [x - 2, FORE_H * 0.45], [x + 1, 0],
            [x + w - 1, 0], [x + w + 2, FORE_H * 0.45], [x + w, FORE_H]], H.flat(0.6));
    P.poly([[x + w, FORE_H * 0.32], [x + w + 22, FORE_H * 0.20],
            [x + w + 22, FORE_H * 0.26], [x + w, FORE_H * 0.40]], H.flat(0.6));
    P.use('green');
    P.ellipse(x + w * 0.5, FORE_H * 0.06, 26, 15, H.flat(0.6));
    P.ellipse(x + w + 22, FORE_H * 0.19, 15, 9, H.flat(0.6));
    P.use('bark');
  }
  for (let x = 170; x < STRIP_W; x += 290) {
    P.use('darkmetal');
    P.rect(x, 0, 3, FORE_H, H.flat(0.6));                       // a cable, full drop
  }
}

function buildLayers() {
  const strip = (h, fn, opts) => bake(STRIP_W, h, fn, Object.assign({ pad:0, rim:0 }, opts || {}));

  for (const env of [ENV.OUTDOOR, ENV.MALL, ENV.TUNNEL, ENV.ARENA]) {
    BG.sky[env] = buildSky(env);

    const rndA = mulberry32(1001), rndB = mulberry32(2002), rndC = mulberry32(3003);
    const isDark = (env === ENV.TUNNEL || env === ENV.MALL);

    // L1 far: flattened to one tone, then heavily hazed. Near-silhouette.
    const far = env === ENV.MALL || env === ENV.TUNNEL
      ? strip(200, P => drawNearStructures(P, mulberry32(11), env), { flatten:3 })
      : strip(200, P => drawSkylineFar(P, rndA), { flatten:2 });

    // L2 mid: real shading, moderately hazed.
    const mid = env === ENV.MALL || env === ENV.TUNNEL
      ? strip(200, P => drawNearStructures(P, rndB, env), { relief:2.2 })
      : strip(200, P => drawSkylineMid(P, rndB), { relief:2.2 });

    // L3 near: real shading, barely hazed.
    const near = strip(210, P => drawNearStructures(P, rndC, env), { relief:2.6 });

    BG.layers[env] = [
      { img: hazed(far,  isDark ? 0.20 : 0.75), scroll: 0.10, y: VIEW_H - 200 - (isDark ? 0 : 24) },
      { img: hazed(mid,  isDark ? 0.12 : 0.45), scroll: 0.25, y: VIEW_H - 200 - (isDark ? 0 : 6) },
      { img: hazed(near, isDark ? 0.06 : 0.15), scroll: 0.55, y: VIEW_H - 210 + 22 }
    ];

    // The foreground: pure dark, partly transparent, scrolling faster than play.
    const fore = strip(FORE_H, P => drawForeground(P, mulberry32(5005), env), { flatten:3 });
    BG.fore[env] = { img: silhouette(fore, 0.88), scroll: 1.45 };
  }
}

/* === PARTICLES ===========================================================
   ONE hard-capped pool serving dust, sparks, debris, smoke, the shed shoulder
   panel and enemy death bursts (D14 - F19 and F49 turned out to be the same
   system described twice).

   The cap is enforced in the pool, not at the call sites, because it is the
   only performance guard on a weak machine and call sites forget.
   ========================================================================= */

const PART_MAX = 220;
const parts = [];
for (let i = 0; i < PART_MAX; i++)
  parts.push({ live:false, x:0, y:0, vx:0, vy:0, life:0, max:0, r:1,
               col:'#fff', grav:0.18, drag:0.99, kind:'dot', spin:0, rot:0, img:null });
let partCursor = 0;

function emit(o) {
  // Recycle the oldest slot rather than dropping the effect, so a burst never
  // silently vanishes - it just costs an older particle.
  let p = null;
  for (let i = 0; i < PART_MAX; i++) {
    const q = parts[(partCursor + i) % PART_MAX];
    if (!q.live) { p = q; partCursor = (partCursor + i + 1) % PART_MAX; break; }
  }
  if (!p) { p = parts[partCursor]; partCursor = (partCursor + 1) % PART_MAX; }

  p.live = true;
  p.x = o.x; p.y = o.y;
  p.vx = o.vx || 0; p.vy = o.vy || 0;
  p.max = p.life = o.life || 24;
  p.r = o.r || 1;
  p.col = o.col || '#a8adb5';
  p.grav = o.grav !== undefined ? o.grav : 0.18;
  p.drag = o.drag !== undefined ? o.drag : 0.99;
  p.kind = o.kind || 'dot';
  p.img = o.img || null;
  p.spin = o.spin || 0;
  p.rot = o.rot || 0;
  p.add = !!o.add;
  return p;
}

function burst(x, y, n, o) {
  o = o || {};
  for (let i = 0; i < n; i++) {
    const a = o.a0 !== undefined ? lerp(o.a0, o.a1, Math.random()) : Math.random() * Math.PI * 2;
    const sp = lerp(o.sp0 || 0.4, o.sp1 || 2.2, Math.random());
    emit(Object.assign({}, o, {
      x, y,
      vx: Math.cos(a) * sp + (o.bx || 0),
      vy: Math.sin(a) * sp + (o.by || 0),
      life: Math.round(lerp(o.life0 || 14, o.life1 || 30, Math.random())),
      r: o.r || (Math.random() < 0.4 ? 2 : 1)
    }));
  }
}

function updateParticles() {
  for (let i = 0; i < PART_MAX; i++) {
    const p = parts[i];
    if (!p.live) continue;
    p.vy += p.grav;
    p.vx *= p.drag; p.vy *= p.drag;
    p.x += p.vx; p.y += p.vy;
    p.rot += p.spin;
    if (--p.life <= 0) p.live = false;
  }
}

function drawParticles(c, camX, camY) {
  for (let i = 0; i < PART_MAX; i++) {
    const p = parts[i];
    if (!p.live) continue;
    const sx = Math.round(p.x - camX), sy = Math.round(p.y - camY);
    if (sx < -20 || sx > VIEW_W + 20 || sy < -20 || sy > VIEW_H + 20) continue;
    const t = p.life / p.max;

    if (p.kind === 'img' && p.img) {
      c.save();
      c.globalAlpha = clamp(t * 1.6, 0, 1);
      c.translate(sx, sy); c.rotate(p.rot);
      c.drawImage(p.img, -p.img.width / 2 | 0, -p.img.height / 2 | 0);
      c.restore();
      continue;
    }
    c.globalAlpha = clamp(t * 1.4, 0, 1);
    if (p.add) c.globalCompositeOperation = 'lighter';
    c.fillStyle = p.col;
    const r = Math.max(1, Math.round(p.r * (p.kind === 'smoke' ? (2 - t) : t + 0.35)));
    c.fillRect(sx - (r >> 1), sy - (r >> 1), r, r);
    if (p.add) c.globalCompositeOperation = 'source-over';
  }
  c.globalAlpha = 1;
}

function clearParticles() { for (let i = 0; i < PART_MAX; i++) parts[i].live = false; }

/* === AUDIO ===============================================================
   Every sound in the game is synthesised through Web Audio at runtime (D5).
   No audio files ship, because the single-file offline constraint rules them
   out - and synthesised SFX are a solved problem, so this is not a compromise
   in the way synthesised music is.

   Roughly half of "game feel" in a platformer is audio. The specific goal from
   DESIGN.md is that SCRAP's SPEED should be audible with your eyes shut: the
   tread loop's filter cutoff and pitch track his actual velocity.

   Chrome blocks audio until a user gesture, so the context is resumed on the
   first keypress - which is a large part of why the TITLE screen exists at all
   rather than dropping straight into play (D16.3).
   ========================================================================= */

const SAVE_KEY = 'rustcountry.v1';

/* localStorage throws outright in some private modes. A storage failure must
   never break the game, so both directions are wrapped (D16.2). */
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return {};
    const o = JSON.parse(raw);
    return (o && typeof o === 'object') ? o : {};
  } catch (e) { return {}; }
}
function storeSave(o) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(o)); return true; }
  catch (e) { return false; }
}

const SAVE = loadSave();

const A = {
  ctx: null,
  master: null, sfx: null, music: null,
  muted: !!SAVE.muted,
  ready: false,
  noiseBuf: null,
  tread: null, roll: null, cart: null, rumble: null,
  pickupChain: 0, pickupChainAt: -999
};

function audioInit() {
  if (A.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { A.ctx = new AC(); } catch (e) { return; }

  A.master = A.ctx.createGain();
  A.master.gain.value = A.muted ? 0 : 0.85;
  A.master.connect(A.ctx.destination);

  A.sfx = A.ctx.createGain();   A.sfx.gain.value = 0.9;   A.sfx.connect(A.master);
  A.music = A.ctx.createGain(); A.music.gain.value = 0.40; A.music.connect(A.master);

  // One second of noise, reused by every noise-based sound.
  const sr = A.ctx.sampleRate;
  A.noiseBuf = A.ctx.createBuffer(1, sr, sr);
  const d = A.noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  buildLoops();
  A.ready = true;
}

let gestureDone = false;
function onFirstGesture() {
  if (gestureDone) return;
  gestureDone = true;
  audioInit();
  if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume().catch(() => {});
  if (hintEl) hintEl.classList.add('gone');
}

function setMuted(m) {
  A.muted = m;
  if (A.master) A.master.gain.value = m ? 0 : 0.85;
  SAVE.muted = m;
  storeSave(SAVE);
}

/* ---- primitives ---- */

function now() { return A.ctx ? A.ctx.currentTime : 0; }

function tone(o) {
  if (!A.ready || A.muted) return;
  const t = now() + (o.delay || 0);
  const osc = A.ctx.createOscillator();
  const g = A.ctx.createGain();
  osc.type = o.type || 'square';
  osc.frequency.setValueAtTime(o.f, t);
  if (o.to !== undefined) {
    if (o.exp) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), t + o.dur);
    else osc.frequency.linearRampToValueAtTime(Math.max(1, o.to), t + o.dur);
  }
  if (o.detune) osc.detune.value = o.detune;

  const peak = (o.g === undefined ? 0.22 : o.g);
  const atk = o.atk === undefined ? 0.004 : o.atk;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);

  let node = osc;
  if (o.cut) {
    const f = A.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = o.cut; f.Q.value = o.q || 1;
    osc.connect(f); node = f;
  }
  node.connect(g);
  g.connect(o.bus || A.sfx);
  osc.start(t); osc.stop(t + o.dur + 0.02);
}

function noise(o) {
  if (!A.ready || A.muted) return;
  const t = now() + (o.delay || 0);
  const src = A.ctx.createBufferSource();
  src.buffer = A.noiseBuf;
  src.loop = true;
  const f = A.ctx.createBiquadFilter();
  f.type = o.type || 'lowpass';
  f.frequency.setValueAtTime(o.cut || 1200, t);
  if (o.cutTo !== undefined) f.frequency.exponentialRampToValueAtTime(Math.max(40, o.cutTo), t + o.dur);
  f.Q.value = o.q || 1;
  const g = A.ctx.createGain();
  const peak = o.g === undefined ? 0.3 : o.g;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + (o.atk || 0.004));
  g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
  src.connect(f); f.connect(g); g.connect(o.bus || A.sfx);
  src.start(t); src.stop(t + o.dur + 0.02);
}

/* ---- continuous loops, created once and modulated ---- */
function buildLoops() {
  const mk = (cut, q, gain, type) => {
    const src = A.ctx.createBufferSource();
    src.buffer = A.noiseBuf; src.loop = true;
    const f = A.ctx.createBiquadFilter();
    f.type = type || 'lowpass'; f.frequency.value = cut; f.Q.value = q;
    const g = A.ctx.createGain(); g.gain.value = 0;
    src.connect(f); f.connect(g); g.connect(A.sfx);
    src.start();
    return { src, f, g, base:gain };
  };
  A.tread  = mk(420, 1.2, 0.13);
  A.roll   = mk(900, 6.0, 0.16, 'bandpass');
  A.cart   = mk(300, 2.0, 0.14);
  A.rumble = mk(120, 1.0, 0.20);
}

/* SCRAP's speed, made audible. */
function setTread(speed01, on) {
  if (!A.ready || !A.tread) return;
  const g = on ? 0.13 * (0.35 + speed01 * 0.65) : 0;
  A.tread.g.gain.setTargetAtTime(g, now(), 0.05);
  A.tread.f.frequency.setTargetAtTime(300 + speed01 * 1500, now(), 0.05);
}
function setRoll(on, t01) {
  if (!A.ready || !A.roll) return;
  A.roll.g.gain.setTargetAtTime(on ? 0.15 : 0, now(), 0.04);
  A.roll.f.frequency.setTargetAtTime(600 + (1 - (t01 || 0)) * 2600, now(), 0.04);
}
function setCartNoise(on, sp) {
  if (!A.ready || !A.cart) return;
  A.cart.g.gain.setTargetAtTime(on ? 0.16 : 0, now(), 0.08);
  A.cart.f.frequency.setTargetAtTime(220 + (sp || 0) * 900, now(), 0.08);
}
function setRumble(amt) {
  if (!A.ready || !A.rumble) return;
  A.rumble.g.gain.setTargetAtTime(0.22 * clamp(amt, 0, 1), now(), 0.12);
}

/* ---- the sound table (DESIGN.md) ---- */
const SFX = {
  jump()      { tone({ type:'square', f:300, to:720, dur:0.13, g:0.16, exp:true, cut:2600 }); },
  land(hard)  {
    const h = clamp(hard, 0.2, 1);
    noise({ cut:1500, cutTo:200, dur:0.12, g:0.17 * h, q:0.9 });
    tone({ type:'sine', f:130, to:52, dur:0.16, g:0.26 * h, exp:true });
  },
  rollStart() { tone({ type:'sawtooth', f:180, to:520, dur:0.22, g:0.1, exp:true, cut:1800, q:4 }); },
  stomp()     {
    noise({ cut:2600, cutTo:180, dur:0.20, g:0.30, q:1.2 });
    tone({ type:'sine', f:64, to:34, dur:0.30, g:0.36, exp:true });
    tone({ type:'square', f:170, to:60, dur:0.10, g:0.10, exp:true, cut:1200 });
  },
  enemyDie()  {
    noise({ type:'bandpass', cut:1500, cutTo:500, dur:0.16, g:0.26, q:2.2 });
    tone({ type:'square', f:420, to:110, dur:0.18, g:0.13, exp:true });
    tone({ type:'square', f:404, to:104, dur:0.18, g:0.08, exp:true, detune:-18 });
  },
  huskBounce(){ tone({ type:'triangle', f:220, to:150, dur:0.12, g:0.16, exp:true, cut:900 });
                noise({ cut:900, cutTo:300, dur:0.08, g:0.12 }); },
  pickup()    {
    // Pitch rises with each consecutive pickup and resets after a pause. The
    // standard trick that makes collecting compulsive.
    if (G.tick - A.pickupChainAt > 42) A.pickupChain = 0;
    A.pickupChainAt = G.tick;
    const step = Math.min(A.pickupChain, 11);
    A.pickupChain++;
    const base = 660 * Math.pow(2, step / 12);
    tone({ type:'square', f:base, dur:0.06, g:0.10, cut:5200 });
    tone({ type:'square', f:base * 1.5, dur:0.09, g:0.08, delay:0.045, cut:5200 });
  },
  fuse()      {
    [0, 4, 7, 12].forEach((s, i) =>
      tone({ type:'triangle', f:520 * Math.pow(2, s / 12), dur:0.20, g:0.13, delay:i * 0.075 }));
  },
  // The laser: a short bright chirp falling fast, doubled an octave down so it
  // has some body. Kept quieter than the stomp - it fires ten times as often.
  laser()     { tone({ type:'square', f:1500, to:430, dur:0.085, g:0.095, exp:true, cut:5400 });
                tone({ type:'sawtooth', f:750, to:215, dur:0.07, g:0.045, exp:true, cut:3000 }); },
  boltHit()   { noise({ cut:3200, cutTo:600, dur:0.10, g:0.19 });
                tone({ type:'square', f:540, to:150, dur:0.10, g:0.08, exp:true }); },
  // Dry trigger: a dead click. Never a silent press.
  dryFire()   { tone({ type:'square', f:190, to:120, dur:0.045, g:0.07, exp:true, cut:1400 });
                noise({ cut:1200, cutTo:500, dur:0.04, g:0.06 }); },
  ammoPickup(){ [0, 7].forEach((n, i) =>
                  tone({ type:'triangle', f:700 * Math.pow(2, n / 12), dur:0.10,
                         g:0.11, delay:i * 0.05, cut:5200 })); },
  shot()      { tone({ type:'square', f:800, to:200, dur:0.14, g:0.11, exp:true, cut:2600 }); },
  hurt()      {
    tone({ type:'sawtooth', f:300, to:90, dur:0.26, g:0.2, exp:true, cut:1400, q:3 });
    noise({ cut:1800, cutTo:300, dur:0.2, g:0.2 });
  },
  die()       {
    noise({ cut:2400, cutTo:120, dur:0.5, g:0.3 });
    tone({ type:'sawtooth', f:260, to:40, dur:0.6, g:0.2, exp:true, cut:1100, q:2 });
    [0,-3,-7].forEach((s,i)=>tone({ type:'triangle', f:330*Math.pow(2,s/12), dur:0.3, g:0.09, delay:0.1+i*0.09 }));
  },
  respawn()   { [0,7,12].forEach((s,i)=>tone({ type:'triangle', f:330*Math.pow(2,s/12), dur:0.14, g:0.1, delay:i*0.05 })); },
  launch()    {
    noise({ cut:400, cutTo:3000, dur:0.28, g:0.26, q:1.4 });
    tone({ type:'square', f:120, to:900, dur:0.26, g:0.12, exp:true, cut:3000 });
  },
  bounce()    { tone({ type:'triangle', f:200, to:620, dur:0.16, g:0.18, exp:true, cut:2400 });
                noise({ cut:1200, cutTo:600, dur:0.07, g:0.1 }); },
  clampOn()   { tone({ type:'square', f:900, to:1400, dur:0.06, g:0.09, exp:true });
                noise({ type:'bandpass', cut:2600, dur:0.05, g:0.1, q:5 }); },
  crack()     { noise({ cut:3000, cutTo:500, dur:0.22, g:0.26, q:1.4 });
                tone({ type:'square', f:200, to:70, dur:0.2, g:0.1, exp:true }); },
  collapse()  { noise({ cut:600, cutTo:90, dur:0.7, g:0.3 });
                tone({ type:'sine', f:70, to:30, dur:0.8, g:0.24, exp:true }); },

  // The player must be able to HEAR how long they have left. Pitch maps
  // directly to the telegraph timer, and the boss's optic pulse mirrors it
  // exactly, so the fight is equally playable with the sound off.
  telegraph(ticks) {
    const dur = Math.max(0.12, ticks / 60);
    tone({ type:'triangle', f:280, to:900, dur, g:0.10, exp:true, cut:3000 });
  },
  slam()      {
    noise({ cut:900, cutTo:60, dur:0.5, g:0.34 });
    tone({ type:'sine', f:52, to:26, dur:0.6, g:0.4, exp:true });
    tone({ type:'square', f:150, to:44, dur:0.2, g:0.1, exp:true, cut:800 });
  },
  sweep()     { noise({ type:'bandpass', cut:500, cutTo:2400, dur:0.4, g:0.2, q:1.2 }); },
  beam()      { tone({ type:'sawtooth', f:120, dur:0.5, g:0.14, cut:1400, q:6 });
                noise({ type:'bandpass', cut:1800, dur:0.5, g:0.12, q:3 }); },
  phase()     {
    noise({ cut:3000, cutTo:200, dur:0.6, g:0.3 });
    [0,-5,-12].forEach((s,i)=>tone({ type:'sawtooth', f:220*Math.pow(2,s/12), dur:0.5, g:0.14, delay:i*0.1, cut:1600 }));
  },
  bossDie()   {
    noise({ cut:2600, cutTo:80, dur:1.4, g:0.34 });
    tone({ type:'sawtooth', f:200, to:28, dur:1.6, g:0.24, exp:true, cut:1200, q:2 });
    // Resolve to A major - the payoff chord (DESIGN.md).
    [0,4,7,12].forEach((s,i)=>tone({ type:'triangle', f:440*Math.pow(2,s/12), dur:1.6, g:0.11, delay:0.5+i*0.06 }));
  },
  ui()        { tone({ type:'square', f:600, dur:0.05, g:0.08, cut:4000 }); },
  uiBig()     { [0,7,12].forEach((s,i)=>tone({ type:'triangle', f:440*Math.pow(2,s/12), dur:0.22, g:0.11, delay:i*0.06 })); },
  record()    { [0,4,7,12,16].forEach((s,i)=>tone({ type:'triangle', f:523*Math.pow(2,s/12), dur:0.3, g:0.12, delay:i*0.08 })); }
};

/* === MUSIC ===============================================================
   Adaptive: one synthesised bed per beat, crossfading at beat boundaries
   (F52). Moody electronic - detuned saw pads, a plucked bass, percussion from
   filtered noise. Deliberately not jungle percussion; the setting is a ruined
   city.

   The ENDING reprises beat 1's melody, resolved to major. Same notes. It is
   the cheapest way to make a seven-minute game feel like it was about
   something, and it is not to be cut.
   ========================================================================= */

const A4 = 440;
const hz = semi => A4 * Math.pow(2, semi / 12);

// A minor pentatonic. Offsets in semitones from A4.
const MAIN_MELODY = [
   0, null,  3, null,  7, null,  5, null,
   3, null, null, null,  0, null, null, null,
   7, null,  5, null,  3, null,  0, null,
  -2, null, null, null,  0, null, null, null
];

const CHORDS = {
  Am: [0, 3, 7], F: [-4, 0, 3], C: [3, 7, 10], G: [-2, 2, 5],
  AM: [0, 4, 7], Dm: [-7, -4, 0], E: [7, 11, 14]
};

const BEDS = {
  quiet:   { bpm:76,  prog:['Am','F','C','G'], pad:0.16, bass:0,    perc:0,    lead:0.10, leadOct:0,  arp:0 },
  street:  { bpm:96,  prog:['Am','F','C','G'], pad:0.15, bass:0.14, perc:0.10, lead:0.09, leadOct:0,  arp:0 },
  mall:    { bpm:104, prog:['Am','Dm','F','C'],pad:0.16, bass:0.13, perc:0.09, lead:0.08, leadOct:12, arp:0.06 },
  cart:    { bpm:148, prog:['Am','Am','F','G'],pad:0.10, bass:0.17, perc:0.16, lead:0.09, leadOct:12, arp:0.09 },
  pursuit: { bpm:160, prog:['Am','G','F','E'], pad:0.13, bass:0.18, perc:0.18, lead:0,    leadOct:0,  arp:0.10, dissonant:true },
  boss:    { bpm:88,  prog:['Am','Am','F','E'],pad:0.20, bass:0.16, perc:0.07, lead:0,    leadOct:0,  arp:0 },
  ending:  { bpm:76,  prog:['AM','F','C','G'], pad:0.20, bass:0.12, perc:0,    lead:0.13, leadOct:0,  arp:0, major:true },
  title:   { bpm:70,  prog:['Am','F','C','G'], pad:0.15, bass:0,    perc:0,    lead:0.08, leadOct:0,  arp:0 },
  none:    null
};

const M = {
  bed: null, bedName:'none', nextName:null,
  step: 0, nextTime: 0, gain: 1, fadeTo: 1
};

function musicSet(name) {
  if (M.bedName === name) return;
  M.bedName = name;
  M.bed = BEDS[name] || null;
  M.step = 0;
  M.nextTime = 0;
}

function musicUpdate() {
  if (!A.ready || A.muted || !A.ctx) return;
  const bed = M.bed;
  if (!bed) return;

  const spb = 60 / bed.bpm / 4;                     // one 16th note
  const t0 = now();
  if (!M.nextTime) M.nextTime = t0 + 0.06;

  // Schedule ahead by 0.25s. At 60Hz this is called far more often than it
  // needs to be, which is exactly what keeps it gap-free under frame spikes.
  let guard = 0;
  while (M.nextTime < t0 + 0.25 && guard++ < 32) {
    const s = M.step;
    const bar = (s >> 4) % bed.prog.length;
    const chord = CHORDS[bed.prog[bar]] || CHORDS.Am;
    const at = M.nextTime - t0;
    const g = M.gain;

    // Pad: a detuned saw chord, re-struck each bar. The bed of the whole thing.
    if (bed.pad && (s % 16) === 0) {
      chord.forEach((n, i) => {
        tone({ type:'sawtooth', f:hz(n - 12), dur:spb * 15, g:bed.pad * g * 0.5,
               atk:0.25, cut:900, q:0.8, delay:at, bus:A.music, detune:i * 7 - 7 });
        tone({ type:'sawtooth', f:hz(n - 12), dur:spb * 15, g:bed.pad * g * 0.35,
               atk:0.3, cut:700, delay:at, bus:A.music, detune:-i * 9 + 5 });
      });
    }
    // Bass: a plucked root on the off-eighths.
    if (bed.bass && (s % 4) === 0) {
      const pat = [0, 0, 7, 0, 0, 3, 0, 0][(s >> 2) % 8];
      tone({ type:'triangle', f:hz(chord[0] - 24 + pat), dur:spb * 3.2,
             g:bed.bass * g, atk:0.006, cut:520, delay:at, bus:A.music });
    }
    // Percussion: filtered noise. A kick on the beat, a tick on the offbeat.
    if (bed.perc) {
      if ((s % 8) === 0) {
        noise({ cut:200, cutTo:60, dur:0.12, g:bed.perc * g * 1.5, delay:at, bus:A.music });
      } else if ((s % 4) === 2) {
        noise({ type:'highpass', cut:4200, dur:0.05, g:bed.perc * g * 0.5, delay:at, bus:A.music });
      }
      if (bed.bpm > 130 && (s % 2) === 1) {
        noise({ type:'highpass', cut:6000, dur:0.03, g:bed.perc * g * 0.3, delay:at, bus:A.music });
      }
    }
    // Arp: sixteenth chord tones. Only on the fast beds.
    if (bed.arp && (s % 2) === 0) {
      const n = chord[(s >> 1) % chord.length] + 12;
      tone({ type:'square', f:hz(n), dur:spb * 1.4, g:bed.arp * g,
             cut:2600, delay:at, bus:A.music });
    }
    // Lead: the main melody. Reprised, resolved, at the end.
    if (bed.lead) {
      const note = MAIN_MELODY[s % MAIN_MELODY.length];
      if (note !== null) {
        let n = note + bed.leadOct;
        if (bed.major && note === 3) n = 4 + bed.leadOct;      // minor third -> major
        tone({ type:'triangle', f:hz(n), dur:spb * 3.6, g:bed.lead * g,
               atk:0.02, cut:2400, delay:at, bus:A.music });
      }
    }
    // The pursuit bed leans on a dissonant tritone, once a bar.
    if (bed.dissonant && (s % 16) === 8) {
      tone({ type:'sawtooth', f:hz(chord[0] + 6), dur:spb * 6, g:0.07 * g,
             cut:1200, delay:at, bus:A.music });
    }

    M.step = (s + 1) % (16 * bed.prog.length);
    M.nextTime += spb;
  }

  if (M.nextTime < t0) M.nextTime = t0 + 0.06;      // recover from a long stall
  M.gain = approach(M.gain, M.fadeTo, 0.02);
}

/* === LEVEL ===============================================================
   ONE continuous tilemap for all six beats (BUILD-PLAN step 22). Beats are
   x-ranges of one world, not separate levels - there is no loading anywhere in
   this game, and crossing a boundary only crossfades the music and moves the
   respawn point.

   The map is generated by the helpers below rather than hand-authored as ASCII,
   because 420 x 46 tiles of ASCII is unreadable and untunable. Gameplay
   distances are chosen against the real physics numbers in DATA.md:

     normal jump  : 37 px of height, ~23 ticks of airtime, ~60 px of reach
                    -> clears a 3-tile gap
     roll-jump    : 4.2 px/tick carried through 20 ticks -> ~86 px of reach
                    -> clears a 5-tile gap, which a normal jump CANNOT

   That 3-vs-5 tile difference is how the level teaches F15 without any text.
   ========================================================================= */

const LW = 420, LH = 46;              // world size in tiles
const GY = 30;                        // outdoor ground surface row

const LV = {
  w: LW, h: LH,
  tiles: new Uint8Array(LW * LH),
  variant: new Uint8Array(LW * LH),
  props: [],        // decoration, drawn behind or in front of the play layer
  spawns: [],       // entity definitions, instantiated on beat entry
  cables: [],       // clamp runs
  tubes: [],
  tyres: [],
  ammoSpots: [],
  triggers: []
};

const tAt = (tx, ty) => (tx < 0 || ty < 0 || tx >= LW || ty >= LH) ? 0 : LV.tiles[ty * LW + tx];
const isSolidTile = (tx, ty) => {
  if (tx < 0 || tx >= LW) return true;             // world edges are walls
  if (ty < 0) return false;                        // open sky
  if (ty >= LH) return false;                      // the void below kills
  return !!TILE_SOLID[LV.tiles[ty * LW + tx]];
};

/* ---- map-building helpers ---- */
function fillT(x0, y0, x1, y1, type) {
  for (let y = Math.max(0, y0); y <= Math.min(LH - 1, y1); y++)
    for (let x = Math.max(0, x0); x <= Math.min(LW - 1, x1); x++)
      LV.tiles[y * LW + x] = type;
}
function groundRun(x0, x1, top, type, depth) {
  fillT(x0, top, x1, top + (depth === undefined ? (LH - top) : depth), type);
}
function platform(x, y, w, type) { fillT(x, y, x + w - 1, y, type || T.GIRDER); }
function carve(x0, y0, x1, y1) { fillT(x0, y0, x1, y1, T.EMPTY); }

function prop(img, px, py, opts) {
  LV.props.push(Object.assign({ img, x:px, y:py, front:false, alpha:1 }, opts || {}));
}
function spawn(def) { LV.spawns.push(def); }
function scrapLine(px, py, n, dx) {
  for (let i = 0; i < n; i++) spawn({ type:'scrap', x:px + i * (dx || 16), y:py });
}
function scrapArc(px, py, n, dx, rise) {
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    spawn({ type:'scrap', x:px + i * dx, y:py - Math.sin(t * Math.PI) * rise });
  }
}
function cable(px, yTop, yBot) { LV.cables.push({ x:px, y0:yTop, y1:yBot }); }
/* A tube is defined by WHERE IT LANDS YOU, not by a launch velocity.
   Velocity-based launches made the mall's climb impossible to lay out: the
   impulse that cleared one floor bonked on the next floor's underside, and any
   change to a floor height silently broke the route. A barrel cannon in the
   game this is homaging always lands you somewhere specific, so this one does
   too - see updateScrap's launch branch. */
function tube(px, py, tx, ty) {
  LV.tubes.push({ x:px, y:py, tx, ty, cooldown:0 });
}
function tyre(px, py) { LV.tyres.push({ x:px, y:py, squash:0 }); }
function ammoSpot(px, py) { LV.ammoSpots.push({ x:px, y:py }); }
function trigger(px, w, kind, data) {
  LV.triggers.push(Object.assign({ x:px, w, kind, fired:false }, data || {}));
}

/* ---- the beats ---------------------------------------------------------
   x0/x1 are pixel ranges. `spawnPt` is where a death in this beat returns the
   player - the start of the CURRENT beat, never further back (D6).
   -------------------------------------------------------------------- */
const BEATS = [
  { id:1, name:'COLD BOOT',            x0:0,    x1:608,  env:ENV.OUTDOOR, music:'quiet',   spawnPt:{ x:96,   y:GY*TS } },
  { id:2, name:'THE OVERGROWN STREET', x0:608,  x1:1952, env:ENV.OUTDOOR, music:'street',  spawnPt:{ x:648,  y:GY*TS } },
  { id:3, name:'UP THROUGH THE MALL',  x0:1952, x1:3040, env:ENV.MALL,    music:'mall',    spawnPt:{ x:1984, y:GY*TS } },
  { id:4, name:'THE RAIL CART',        x0:3040, x1:4512, env:ENV.TUNNEL,  music:'cart',    spawnPt:{ x:3072, y:12*TS } },
  { id:5, name:'THE PURSUIT',          x0:4512, x1:5600, env:ENV.TUNNEL,  music:'pursuit', spawnPt:{ x:4544, y:14*TS } },
  { id:6, name:'THE WARDEN',           x0:5600, x1:6720, env:ENV.ARENA,   music:'boss',    spawnPt:{ x:5664, y:GY*TS } }
];
function beatAt(px) {
  for (let i = BEATS.length - 1; i >= 0; i--) if (px >= BEATS[i].x0) return BEATS[i];
  return BEATS[0];
}

function buildLevel() {
  const rnd = mulberry32(90210);

  /* ================= BEAT 1 - COLD BOOT (tiles 0..37) =================
     Tone before difficulty. NOTHING in this beat can kill the player: no
     hazards, no enemies, and no pits (F31). It is the only place they can
     safely discover that the controls exist. */
  groundRun(0, 37, GY, T.GRASSY);
  fillT(0, GY - 6, 1, GY - 1, T.CONCRETE);          // left wall: no walking off the world
  platform(20, GY - 3, 3, T.RUSTMETAL);             // two easy steps, to teach the jump
  platform(25, GY - 5, 3, T.RUSTMETAL);
  fillT(30, GY - 2, 33, GY - 1, T.CONCRETE);        // a scrap heap to walk over

  prop(ART.container, 40, GY * TS - 44);
  prop(ART.containerDoor, 112, GY * TS - 34, { door:true });
  prop(ART.lamp, 300, GY * TS - 68);
  prop(ART.car, 380, GY * TS - 26);
  prop(ART.tree, 470, GY * TS - 88);
  prop(ART.girderProp, 210, GY * TS - 60);

  scrapLine(248, GY * TS - 12, 5);                  // DATA.md example 2
  scrapArc(330, GY * TS - 20, 5, 16, 22);
  spawn({ type:'scrap', x:336, y:(GY - 4) * TS - 6 });
  spawn({ type:'scrap', x:352, y:(GY - 4) * TS - 6 });
  spawn({ type:'scrap', x:412, y:(GY - 6) * TS - 6 });

  trigger(150, 40, 'wave-hint');

  /* ================= BEAT 2 - THE OVERGROWN STREET (38..121) ==========
     First combat. Teaches the roll on flat ground with room to retreat, then
     asks for the roll-jump over a gap a normal jump cannot clear. */
  groundRun(38, 51, GY, T.GRASSY);
  // 2 tiles for the FIRST gap in the game. A plain running jump measures ~4.4
  // tiles of reach, so 3 is near its limit - fine later, too tight as an
  // introduction.
  carve(52, GY, 53, LH - 1);
  groundRun(54, 79, GY, T.GRASSY);

  /* Hidden cache #1 (F39), and fuse R.

     This was originally a solid block four tiles tall with a ONE-tile crawl
     space threaded through it. SCRAP's hitbox is 18px, so a 16px crawl space is
     not a crawl space - it is a wall, and that block sat directly across the
     only route through beat 2. The whole level was impassable and no amount of
     looking at screenshots would have said so.

     It is now a RECESS in the ground: five tiles wide, two deep. Two tiles is
     32px, well inside the 39px jump, so it can always be climbed out of. And it
     is genuinely easy to miss, because anyone sprinting right roll-jumps
     straight over the top of it. */
  carve(65, GY, 69, GY + 1);
  fillT(65, GY + 2, 69, GY + 2, T.CONCRETE);         // the recess floor
  scrapLine(1058, (GY + 1) * TS - 6, 4, 15);
  spawn({ type:'fuse', idx:0, x:1122, y:(GY + 1) * TS - 6 });   // fuse R

  tyre(960, GY * TS);                                // burst-tyre trampolines
  tyre(1088, GY * TS);

  // The roll tutorial. Flat ground, after the tyres, before the gap - a player
  // who has not worked out the roll meets it with room to back off (DATA.md).
  spawn({ type:'skitter', x:1184, y:(GY - 1) * TS, left:1120, right:1280 });
  spawn({ type:'skitter', x:1256, y:(GY - 1) * TS, left:1120, right:1280 });

  carve(80, GY, 84, LH - 1);                         // 5-TILE GAP: roll-jump only
  groundRun(85, 121, GY, T.GRASSY);
  platform(82, GY - 5, 2, T.GIRDER);                 // a bail-out for the brave
  spawn({ type:'scrap', x:1312, y:(GY - 6) * TS });

  // The wrecked car that unfolds into a HUSK. Used EXACTLY ONCE in the whole
  // game (F29) - an ambush lands only if it is never repeated.
  spawn({ type:'husk-ambush', x:1520, y:(GY - 1) * TS, left:1440, right:1650 });
  prop(ART.car, 1424, GY * TS - 26);
  prop(ART.bus, 1600, GY * TS - 44);
  prop(ART.tree, 900, GY * TS - 88);
  prop(ART.tree, 1480, GY * TS - 88);
  prop(ART.traffic, 1260, GY * TS - 34);
  prop(ART.lamp, 1040, GY * TS - 68);

  // First mandatory WATCHER (D13). Hovering over a pit, out of jump reach, so
  // a thrown cell is the ONLY solution. The thrown cell is the only thing that
  // damages THE WARDEN, and the boss fight is no place to learn it.
  fillT(104, GY - 3, 106, GY - 3, T.GIRDER);
  ammoSpot(1648, (GY - 1) * TS);
  spawn({ type:'watcher', x:1760, y:(GY - 8) * TS, left:1712, right:1840 });
  spawn({ type:'husk', x:1856, y:(GY - 1) * TS, left:1800, right:1920 });
  scrapArc(1660, GY * TS - 24, 6, 15, 26);
  scrapLine(1700, (GY - 4) * TS, 3);

  /* ================= BEAT 3 - UP THROUGH THE MALL (122..189) ==========
     Vertical, and laid out floor by floor, left to right, with every distance
     checked against the measured moveset.

     Two earlier versions were unfinishable. The first tried to climb with
     velocity launches and cables strung under solid floors: the tube's 67px of
     rise could not reach a floor 96px up, and a cable hanging beneath a floor
     has no way through it. The second fixed the launches but landed the player
     two tiles short of a nine-tile gap, with no room to build up speed.

     The route now reads:
       F0  run right                      -> TUBE A
       F1  land, run up to speed, then a 9-TILE GAP crossed on three cables
           (9 tiles is past the roll-jump's measured 7, so the clamp is the
           only way over), then run right -> TUBE B
       F2  land; fuse U and a scrap cache are back at the far LEFT dead end,
           which every tube arc flies straight past          -> TUBE C
       F3  land, run right                                    -> TUBE D
       ROOF exit into the metro
     Every tube states its landing tile, and each is placed so the player lands
     clear of the hole they were fired through. */
  const F0 = GY, F1 = GY - 6, F2 = GY - 12, F3 = GY - 18, FR = GY - 24;

  groundRun(122, 189, F0, T.MALLFLOOR, 3);
  fillT(122, F0 + 3, 189, LH - 1, T.CONCRETE);
  fillT(121, 4, 121, F0 - 1, T.CONCRETE);            // mall outer wall
  /* THE WAY IN. Without this the wall above runs unbroken from the ceiling to
     the ground across the only route, and beat 2 cannot be finished at all -
     the same class of bug as the one-tile crawl gap in D18, and invisible for
     the same reason: it renders perfectly. Three tiles (48px) clears SCRAP's
     18px body with room to run or roll through, per D18's rule that a gap a
     body barely fits is not a gap. */
  carve(121, F0 - 3, 121, F0 - 1);                   // doorway into the mall
  fillT(189, 4, 189, F0 - 1, T.CONCRETE);            // and the far wall

  platform(128, F1, 46, T.MALLFLOOR);                // 128..173
  platform(126, F2, 52, T.MALLFLOOR);                // 126..177
  platform(132, F3, 50, T.MALLFLOOR);                // 132..181
  platform(168, FR, 22, T.MALLFLOOR);                // 168..189, roof

  // A hole above each tube, so a launch visibly flies THROUGH the floor rather
  // than through solid concrete. (The arc ignores collision, so these are for
  // the eye, not the physics.)
  carve(137, F1, 140, F1);
  carve(165, F2, 168, F2);
  carve(173, F3, 176, F3);
  carve(179, FR, 182, FR);

  // THE mandatory clamp crossing: nine tiles, three cables over the middle.
  carve(150, F1, 158, F1);
  cable(152 * TS + 8, (F1 - 4) * TS, (F1 + 2) * TS);
  cable(154 * TS + 8, (F1 - 4) * TS, (F1 + 2) * TS);
  cable(156 * TS + 8, (F1 - 4) * TS, (F1 + 2) * TS);

  tube(138 * TS, F0 * TS - 30, 145 * TS, F1 * TS);   // A: ground -> floor 1
  tube(166 * TS, F1 * TS - 30, 172 * TS, F2 * TS);   // B: floor 1 -> floor 2
  tube(174 * TS, F2 * TS - 30, 178 * TS, F3 * TS);   // C: floor 2 -> floor 3
  tube(180 * TS, F3 * TS - 30, 185 * TS, FR * TS);   // D: floor 3 -> roof

  prop(ART.escalator, 2080, F1 * TS - 46);
  prop(ART.escalator, 2560, F2 * TS - 46);
  prop(ART.vending, 2000, F0 * TS - 44);
  prop(ART.shelf, 2380, F1 * TS - 30);
  prop(ART.shelf, 2620, F2 * TS - 30);
  prop(ART.vending, 2820, F3 * TS - 44);

  /* Enemies, each on a stretch of floor that actually exists.

     Floor 1 is solid on tiles 128-136, 141-149 and 159-173 - the gaps between
     are the launch hole and the nine-tile clamp crossing. An earlier pass put a
     SKITTER at tile 154, in mid-air over the crossing, and put the WATCHER
     close enough that it shot the player off the cables: knocked off a cable,
     you fall to the ground floor, so a hazard aimed at the crossing turns one
     mistake into re-climbing the whole beat. The WATCHER now sits over floor
     1's right-hand stretch, well past the cables.

     Its height is (F1 - 3) = 48px above floor 1, just outside the measured 39px
     jump - so a thrown cell really is the only answer (D13). */
  spawn({ type:'skitter', x:2100, y:(F0 - 1) * TS, left:2040, right:2180 });
  spawn({ type:'skitter', x:2360, y:(F1 - 1) * TS, left:2270, right:2390 });
  spawn({ type:'husk',    x:2660, y:(F1 - 1) * TS, left:2570, right:2740 });
  spawn({ type:'watcher', x:2700, y:(F1 - 3) * TS, left:2640, right:2760 });
  ammoSpot(2600, (F1 - 1) * TS);
  spawn({ type:'husk',    x:2820, y:(F2 - 1) * TS, left:2780, right:2850 });
  ammoSpot(2760, (F2 - 1) * TS);
  spawn({ type:'skitter', x:2880, y:(F3 - 1) * TS, left:2840, right:2900 });

  // Hidden cache #2 and fuse U: the dead end at the far LEFT of floor 2.
  scrapLine(2040, (F2 - 1) * TS - 8, 4, 15);
  spawn({ type:'fuse', idx:1, x:2036, y:(F2 - 1) * TS - 8 });        // fuse U

  scrapArc(2150, (F0 - 1) * TS - 20, 6, 16, 28);
  scrapLine(2330, (F1 - 1) * TS - 10, 5);
  scrapLine(2600, (F1 - 1) * TS - 10, 4);
  scrapLine(2800, (F2 - 1) * TS - 10, 5);
  scrapArc(2860, (F3 - 1) * TS - 18, 5, 15, 24);
  scrapLine(2950, (FR - 1) * TS - 10, 4);

  // The lights-out section (F40) and the vista pullback (F41), which fires on
  // the roof where the whole dead skyline is visible.
  trigger(2420, 260, 'lights-out');
  trigger(2960, 200, 'vista');

  /* ================= BEAT 4 - THE RAIL CART (190..281) ================
     The showpiece. A metro viaduct out of the mall roof and into a black
     tunnel. Scripted ride; jump clears track gaps, down ducks under beams.
     Every hazard is lit by the headlight cone well before SCRAP reaches it
     (DATA.md must-never #2). */
  const CY = 12;                                      // track row
  fillT(190, CY, 281, CY + 1, T.RUSTMETAL);
  /* The ceiling is SOLID TO THE TOP OF THE WORLD, not a one-tile slab (D35).

     As a single row its upper face was a walkable surface at y=48, and there
     was a staircase straight onto it: the mall roof sits at y=96, the lip of
     the mall's far wall at y=64, and the ceiling at y=48 - two easy steps. From
     there SCRAP could walk the entire length of the metro on its roof, over the
     top of the rail cart and the pursuit, and drop into beat 6 having played
     neither. Reported from real play as "I went above the map".

     Four tiles thick puts the only standable face at y=0, which is 96px above
     the roof - well past the 64px a jump plus an air jump can reach. */
  fillT(190, 0, 281, 3, T.TUNNEL);                    // ceiling
  fillT(190, CY + 6, 281, LH - 1, T.TUNNEL);          // the bore floor, far below

  const cartGaps = [[204,206],[216,219],[230,232],[241,244],[252,254],[262,265],[272,274]];
  for (const [a, b] of cartGaps) carve(a, CY, b, CY + 1);
  const cartBeams = [210, 224, 236, 248, 258, 268, 277];
  for (const bx of cartBeams) fillT(bx, 8, bx + 1, 10, T.TUNNEL);

  /* Take the lip off the mall's far wall where it pokes above the roof. It was
     the first step of the climb above (D35), and it was never needed: with it
     gone SCRAP simply runs off the end of the roof and drops onto the track,
     which is the route beat 4 always meant him to take. The wall below the roof
     is untouched - it is still the mall's right-hand boundary. */
  carve(189, 4, 189, 5);

  trigger(3072, 48, 'board-cart');
  spawn({ type:'fuse', idx:2, x:3760, y:(CY - 5) * TS });          // fuse S: a deliberate jump
  for (let i = 0; i < 26; i++) spawn({ type:'scrap', x:3140 + i * 48, y:(CY - 2) * TS - 6 });

  /* ================= BEAT 5 - THE PURSUIT (282..349) ==================
     Descending sprint. The collapse always stays BEHIND the player - it is
     pressure, not a hazard to dodge. */
  let py = CY + 2;
  for (let x = 282; x <= 300; x += 3) { groundRun(x, x + 2, py, T.TUNNEL, 4); py += 3; }
  groundRun(300, 349, GY, T.TUNNEL, 6);
  fillT(282, 0, 349, 2, T.TUNNEL);                    // sealed to the top, as above
  fillT(282, GY + 7, 349, LH - 1, T.TUNNEL);

  /* Carved to the BOTTOM of the world, like beat 2's gap at tiles 80-84 (D36).

     Stopping the carve at GY+6 left the bore floor intact underneath, so these
     were not gaps at all - they were 112px-deep pits with a floor. Falling in
     did not kill: SCRAP landed, and a 44px jump plus a 62px air jump cannot
     climb 112px. The pursuit's collapse does not rescue him either, because it
     lerps to a stop 90px behind the player and never reaches someone standing
     still. The only way out was the retry key.

     `nothingBelow()` is what makes a fall lethal, and it needs an empty column
     all the way down. Now it gets one. */
  carve(312, GY, 314, LH - 1);                        // 3-tile gap
  carve(324, GY, 328, LH - 1);                        // 5-tile: roll-jump again
  platform(320, GY - 4, 2, T.GIRDER);
  carve(338, GY, 340, LH - 1);

  spawn({ type:'fuse', idx:3, x:5280, y:(GY - 5) * TS });          // fuse T
  scrapLine(4700, (GY - 3) * TS, 6);
  scrapArc(4980, GY * TS - 22, 7, 16, 30);
  scrapLine(5380, (GY - 2) * TS, 6);
  trigger(4544, 40, 'pursuit-start');

  /* ================= BEAT 6 - THE WARDEN (350..419) ===================
     Bursting out of the dark into full sunrise. The payoff of the whole
     dark-to-light arc across the level (DESIGN.md). */
  groundRun(350, 419, GY, T.ARENA, 5);
  fillT(350, GY + 5, 419, LH - 1, T.CONCRETE);
  fillT(419, 4, 419, GY - 1, T.CONCRETE);
  fillT(349, GY - 12, 349, GY - 1, T.CONCRETE);       // no backtracking into the tunnel

  /* Cover you can get ON TOP of, and nothing you cannot.

     The first version put 3-tile blocks (48px) and girder platforms 5 tiles up
     (80px) in an arena where the jump measures 39px. Both were unclimbable
     walls: SCRAP could be trapped in a corner of his own boss arena, unable to
     reach the cells he needs, which makes the fight unwinnable in the most
     boring way possible. Cover is now two tiles - inside the jump - and there
     is nothing else on the floor to snag on. */
  fillT(360, GY - 2, 362, GY - 1, T.ARENA);
  fillT(400, GY - 2, 402, GY - 1, T.ARENA);

  prop(ART.girderProp, 5760, (GY - 9) * TS);
  prop(ART.girderProp, 6320, (GY - 9) * TS);
  // Four cell spots, spread across the arena and clear of the cover blocks, so
  // ammo is always within a short run.
  ammoSpot(5700, GY * TS);
  ammoSpot(5950, GY * TS);
  ammoSpot(6250, GY * TS);
  ammoSpot(6500, GY * TS);
  trigger(5664, 40, 'warden-start');

  /* ---- decorative fill along the whole outdoor stretch ---- */
  for (let x = 60; x < 1950; x += 90) {
    if (rnd() < 0.5) prop(ART.tree, x + rnd() * 40, GY * TS - 88, { back:true });
    if (rnd() < 0.35) prop(ART.lamp, x + 20, GY * TS - 68, { back:true });
  }

  /* ---- precompute the neighbour mask for every tile ----
     Done once here so the renderer never has to look at neighbours. */
  for (let y = 0; y < LH; y++) {
    for (let x = 0; x < LW; x++) {
      const t = LV.tiles[y * LW + x];
      if (!t) continue;
      let m = 0;
      if (isSolidTile(x, y - 1)) m |= 1;
      if (isSolidTile(x, y + 1)) m |= 2;
      if (isSolidTile(x - 1, y)) m |= 4;
      if (isSolidTile(x + 1, y)) m |= 8;
      LV.variant[y * LW + x] = m;
    }
  }
}

/* === COLLIDE =============================================================
   Swept AABB against the tile grid. X IS RESOLVED FIRST, THEN Y, always
   (BUILD-PLAN step 10). Resolving Y first makes SCRAP catch on wall corners
   while running, which feels like a bug even when it technically is not.

   Both axes substep at 6px, because the stomp reaches 11 px/tick and terminal
   fall is 9 - without substepping those tunnel straight through a one-tile
   floor.
   ========================================================================= */

/* Three hit points, shown as hearts (D28). RULES.md said no health indicator
   anywhere and the armour was meant to carry it alone; the owner asked for
   hearts directly, so that rule is retired rather than quietly bent. The
   shoulder panel still sheds on the first hit - it was always the better half
   of the idea. */
const MAX_HP = 3;

const PH = {
  grav:0.55, termVel:9.0,
  /* SCRAP falls under his OWN gravity; `grav` still governs cells, enemies and
     the cart. Splitting them is what lets the jump go higher WITHOUT going
     further (D25).

     Height is v^2/2g and airtime is 2v/g. Raising jumpVel alone raises both,
     and the level's two 5-tile gaps sit about two pixels outside a plain
     running jump - so any extra reach at all turns the roll-jump (F15) from
     required into optional there. Scaling jumpVel and playerGrav TOGETHER
     leaves airtime, and therefore horizontal reach, untouched while the arc
     gets taller and crisper. The cell lob is left alone on purpose: it is
     tuned to a few pixels against THE WARDEN's optic (D20). */
  playerGrav:0.62,
  accel:0.35, fric:0.22, turnDecel:0.55, topSpeed:2.6, airAccel:0.22,
  overSpeedDrag:0.055,                 // how fast carried momentum bleeds off
  jumpVel:-7.7, shortHop:0.42,        // measured: 44px of height, same reach as the old 38px jump
  coyote:6, jumpBuf:8,
  /* Double jump (F12b, D25). One extra jump per airborne stretch, weaker than
     the first, and NOT available once a roll-jump is in progress - the
     roll-jump is already the air move, and letting the two stack put the
     mall's nine-tile crossing inside the moveset, which would have made the
     magnet clamp (F17) skippable. */
  airJumps:1, dblJumpVel:-6.2,
  rollMin:2.9, rollBonus:0.6, rollTop:4.6, rollDur:34,
  rollAccel:0.16, rollDecay:0.02,     // the roll spins UP to rollTop, then holds
  rollJumpVel:-6.9,                   // rescaled with playerGrav: reach unchanged at ~5.9 tiles
  stompVel:11.0,
  clampSpeed:1.4,
  /* A LOB. At the -1.2 in DATA.md the cell flew almost flat and passed about
     11px underneath THE WARDEN's optic housing at every range - 142 throws in
     the boss test landed zero hits. -5.4 arcs up about 26px, which puts the
     cell on the optic anywhere between roughly 20 and 80px of stand-off, so
     distance becomes something the player judges rather than something that
     silently never works. */
  /* ---- THE LASER (F18b, D31) ----
     Replaces carry-and-throw. A flat, fast bolt: it is a weapon, so it does not
     arc, and aiming is just which way SCRAP is facing.

     `boltSpeed` is deliberately well above the fastest thing in the game (the
     stomp, at 11px a tick) so a bolt reads as instant. It still substeps
     against tiles, or it would tunnel through a one-tile wall. */
  boltSpeed:7.6, boltLife:70, fireCool:11,
  /* Generous on purpose. The owner's note was that the game is too hard, and
     ammo anxiety is a difficulty the fight does not need - the skill is meant
     to be in timing the WARDEN's exposed optic, not in rationing. */
  ammoStart:20, ammoMax:40, ammoPerCrate:10,
  invuln:90, respawnDelay:60,
  tyreVel:-9.1                        // rescaled with playerGrav to keep the same bounce height
};

const S = {
  x:96, y:GY * TS, vx:0, vy:0, w:12, h:18, face:1,
  onGround:false, wasOnGround:false, coyote:0, jumpBuf:0, jumpHeld:false,
  airJumpsLeft:0, prevY:0, aimX:1, aimY:0,
  rolling:false, rollT:0, rollJumped:false,
  stomping:false, landT:0, crouchT:0,
  clamped:null, clampY:0, clampSwing:0, jumpLock:0,
  clampCool:0,
  launch:null, launchT:0, flightT:0, flightDur:0,
  inCart:null, ducking:false,
  hp:MAX_HP, ammo:0, fireCool:0, muzzle:0,
  invuln:0, hurtT:0, dead:false, deadT:0,
  panel:true,
  sqX:1, sqY:1,
  treadPhase:0, idleT:0,
  anim:'idle', animT:0, animFrame:0,
  bootT:0, ending:false, endT:0,
  frozen:0
};

function hbox(o) { return { l:o.x - o.w / 2, r:o.x + o.w / 2, t:o.y - o.h, b:o.y }; }

function solidSpan(l, r, t, b) {
  const tx0 = Math.floor(l / TS), tx1 = Math.floor((r - 0.001) / TS);
  const ty0 = Math.floor(t / TS), ty1 = Math.floor((b - 0.001) / TS);
  for (let ty = ty0; ty <= ty1; ty++)
    for (let tx = tx0; tx <= tx1; tx++)
      if (isSolidTile(tx, ty)) return true;
  return false;
}

/* Returns { wall, ceil, floor } - which contacts happened this move. */
function moveActor(o, dx, dy) {
  const res = { wall:0, ceil:false, floor:false };
  const halfW = o.w / 2;

  // ---- X first ----
  let remain = dx;
  while (Math.abs(remain) > 0.0001) {
    const step = clamp(remain, -6, 6);
    remain -= step;
    o.x += step;
    const l = o.x - halfW, r = o.x + halfW, t = o.y - o.h + 0.5, b = o.y - 0.5;
    if (solidSpan(l, r, t, b)) {
      if (step > 0) {
        o.x = Math.floor((o.x + halfW) / TS) * TS - halfW - 0.01;
        res.wall = 1;
      } else {
        o.x = (Math.floor((o.x - halfW) / TS) + 1) * TS + halfW + 0.01;
        res.wall = -1;
      }
      o.vx = 0;
      break;
    }
  }

  // ---- then Y ----
  remain = dy;
  while (Math.abs(remain) > 0.0001) {
    const step = clamp(remain, -6, 6);
    remain -= step;
    o.y += step;
    const l = o.x - halfW + 0.5, r = o.x + halfW - 0.5, t = o.y - o.h, b = o.y;
    if (solidSpan(l, r, t, b)) {
      if (step > 0) {
        o.y = Math.floor(o.y / TS) * TS;
        res.floor = true;
      } else {
        o.y = (Math.floor((o.y - o.h) / TS) + 1) * TS + o.h;
        res.ceil = true;
      }
      o.vy = 0;
      break;
    }
  }
  return res;
}

/* True when the player's column has no solid tile anywhere beneath them - i.e.
   they are in a bottomless pit and nothing can stop the fall. */
function nothingBelow(px, py) {
  const tx0 = Math.floor((px - 5) / TS), tx1 = Math.floor((px + 5) / TS);
  const ty0 = Math.max(0, Math.floor(py / TS));
  for (let ty = ty0; ty < LH; ty++)
    for (let tx = tx0; tx <= tx1; tx++)
      if (isSolidTile(tx, ty)) return false;
  return true;
}

function groundedCheck(o) {
  const l = o.x - o.w / 2 + 1, r = o.x + o.w / 2 - 1;
  return solidSpan(l, r, o.y + 0.5, o.y + 1.5);
}

/* === MOVE ================================================================
   SCRAP's moveset. Six verbs (M1-M6 in ANSWERS.md 4a), each mapped from a
   Donkey Kong Country verb so the feel carries over.

   The one rule that matters most: velocity is NEVER set directly from input.
   Acceleration, friction and a turnaround deceleration that is deliberately
   HIGHER than the acceleration are what make the treads feel like they have
   mass. That is roughly half of the whole game's feel (F11).
   ========================================================================= */

function inputX() {
  return (IN.held.right ? 1 : 0) - (IN.held.left ? 1 : 0);
}

function scrapReset(pt) {
  S.x = pt.x; S.y = pt.y;
  S.vx = 0; S.vy = 0;
  S.onGround = true; S.coyote = 0; S.jumpBuf = 0;
  S.rolling = false; S.rollT = 0; S.rollJumped = false;
  S.stomping = false; S.landT = 0; S.crouchT = 0;
  S.clamped = null;
  S.launch = null; S.launchT = 0; S.flightT = 0; S.flightDur = 0;
  S.inCart = null; S.ducking = false;
  S.hp = MAX_HP; S.panel = true; S.invuln = 0; S.hurtT = 0;
  S.fireCool = 0; S.muzzle = 0;
  /* Top back up to the starting load on every respawn. Dying with an empty gun
     and respawning with an empty gun is how a player gets stuck in front of a
     WATCHER forever - the same unwinnable-state trap DATA.md flags for the
     arena, just earlier in the level. */
  S.ammo = Math.max(S.ammo | 0, PH.ammoStart);
  S.dead = false; S.deadT = 0;
  S.sqX = 1; S.sqY = 1; S.idleT = 0; S.frozen = 0; S.jumpLock = 0;
  S.airJumpsLeft = PH.airJumps;
  // bootT must be cleared here. It is set by respawnAt() only for beat 1, but
  // without this reset it survived into every later beat and left SCRAP locked
  // in the boot animation, unable to move.
  S.bootT = 0;
  S.ending = false; S.endT = 0;
  S.treadPhase = 0;
  S.face = 1;
  // `pressed` is cleared, `held` never is - holding right through a respawn
  // must keep SCRAP running (DATA.md must-never #5).
  clearPressed();
}

function updateScrap() {
  if (S.frozen > 0) { S.frozen--; return; }
  if (S.dead) return;

  const ix = inputX();

  /* ---- ending walk-off: scripted, no input ---- */
  if (S.ending) {
    S.face = 1; S.vx = 1.4; S.vy = 0;
    S.x += S.vx;
    S.treadPhase = (S.treadPhase + 0.09) % 1;
    setAnim('run');
    return;
  }

  /* ---- boot-up sequence (beat 1 only) ---- */
  if (S.bootT > 0) {
    S.bootT--;
    setAnim('boot');
    S.vx = 0;
    if (S.bootT === 40) { SFX.ui(); }
    if (S.bootT === 24) {
      SFX.crack();
      burst(S.x + 10, S.y - 16, 12, { col:'#6b6f76', sp0:0.6, sp1:2.4, grav:0.22, life0:20, life1:46 });
    }
    return;
  }

  /* ---- riding the cart: a scripted mode (F34, G3) ---- */
  if (S.inCart) { updateCartRide(); return; }

  /* ---- inside / fired from a pneumatic tube (F37) ----
     A GUARANTEED ARC, not an impulse. Position is interpolated from the tube to
     the tube's named landing tile and tile collision is ignored for the
     duration, so a launch always ends exactly where the level intends. An
     impulse-based version made the mall's climb impossible to lay out: the
     velocity that cleared one floor bonked on the next floor's underside, and
     the player has no control in flight anyway, so there is nothing to simulate.
     There is also no air control here at all - by design. */
  if (S.launch) {
    const L = S.launch;
    if (S.launchT > 0) {
      S.launchT--;
      S.x = L.x; S.y = L.y + 22;
      S.vx = 0; S.vy = 0;
      setAnim('crouch');
      if (S.launchT % 5 === 0)
        burst(S.x, S.y, 3, { col:'#a8adb5', sp0:0.3, sp1:1.0, grav:-0.02, life0:12, life1:20, kind:'smoke' });
      if (S.launchT === 0) {
        S.flightT = 0;
        // Long enough to read as a flight, short enough not to feel like a cutscene.
        S.flightDur = Math.round(clamp(Math.hypot(L.tx - L.x, L.ty - (L.y + 22)) / 5.2, 16, 44));
        S.face = L.tx >= L.x ? 1 : -1;
        SFX.launch();
        shake(5);
        burst(S.x, S.y, 18, { col:'#e8dcc4', sp0:1.0, sp1:3.4, grav:0.1, life0:14, life1:30 });
      }
      return;
    }
    S.flightT++;
    const u = clamp(S.flightT / S.flightDur, 0, 1);
    const sy = L.y + 22;
    S.x = lerp(L.x, L.tx, u);
    // A real arc: linear travel plus a sine hump, so it looks fired rather than slid.
    S.y = lerp(sy, L.ty, u) - Math.sin(u * Math.PI) * 34;
    S.vx = 0; S.vy = 0;
    setAnim(u < 0.5 ? 'rise' : 'fall');
    S.treadPhase = (S.treadPhase + 0.12) % 1;
    if (S.flightT % 3 === 0)
      burst(S.x, S.y - 8, 2, { col:'#e8dcc4', sp0:0.2, sp1:0.9, grav:0.06, life0:10, life1:20 });
    if (u >= 1) {
      S.launch = null;
      S.x = L.tx; S.y = L.ty;
      S.vx = S.face * 1.4; S.vy = 0;
      S.onGround = true; S.coyote = PH.coyote;
      S.sqY = 0.82; S.sqX = 1.14;
      SFX.land(0.8);
      burst(S.x, S.y, 12, { col:'#b8a98d', a0:Math.PI * 1.05, a1:Math.PI * 1.95,
                            sp0:0.6, sp1:2.0, grav:0.18, life0:10, life1:22 });
    }
    return;
  }

  /* ---- clamped to a cable (F17) ----
     A pendulum and nothing more. One move serving one beat; it is not allowed
     to grow (AUDIT.md G1). */
  if (S.clamped) {
    const c = S.clamped;
    const iy = (IN.held.down ? 1 : 0) - (IN.held.up ? 1 : 0);
    S.clampY = clamp(S.clampY + iy * PH.clampSpeed, c.y0, c.y1);
    S.clampSwing = approach(S.clampSwing, ix * 3.4, 0.32);
    S.x = c.x + S.clampSwing;
    S.y = S.clampY;
    S.vx = 0; S.vy = 0;
    // Hanging off a cable counts as solid footing: let go with a fresh air jump.
    S.airJumpsLeft = PH.airJumps;
    if (ix) S.face = ix;
    setAnim('clamp');

    if (IN.pressed.jump) {
      S.clamped = null;
      /* A short cooldown before any cable can be grabbed again. Without it the
         12px catch radius immediately re-caught the cable just released - the
         player hopped in place on one cable forever instead of crossing. Eight
         ticks carries SCRAP about 28px, just short of the 32px spacing, so the
         NEXT cable is catchable and the last one is not. */
      S.clampCool = 8;
      if (IN.held.down) { S.vy = 1.2; S.vx = S.clampSwing * 0.25; }
      else { S.vy = PH.jumpVel * 0.92; S.vx = S.clampSwing * 0.55 + ix * 2.0; }
      S.jumpHeld = true; S.jumpLock = 3;
      SFX.jump();
    }
    handleFire();
    return;
  }

  /* ---- timers ---- */
  S.wasOnGround = S.onGround;
  if (S.landT > 0) S.landT--;
  if (S.crouchT > 0) S.crouchT--;
  if (S.hurtT > 0) S.hurtT--;
  if (S.invuln > 0) S.invuln--;
  if (S.clampCool > 0) S.clampCool--;
  if (S.coyote > 0) S.coyote--;
  if (S.jumpBuf > 0) S.jumpBuf--;
  if (S.jumpLock > 0) S.jumpLock--;
  if (IN.pressed.jump) S.jumpBuf = PH.jumpBuf;

  /* ---- M3 boost roll (F14) - the signature move ---- */
  if (IN.pressed.roll && !S.rolling && S.hurtT <= 0 &&
      (S.onGround || S.coyote > 0)) {
    S.rolling = true;
    S.rollT = PH.rollDur;
    const dir = ix !== 0 ? ix : S.face;
    S.face = dir;
    S.vx = dir * Math.min(PH.rollTop, Math.max(PH.rollMin, Math.abs(S.vx) + PH.rollBonus));
    S.rollJumped = false;
    SFX.rollStart();
    burst(S.x - dir * 6, S.y - 2, 8, { col:'#8d9299', sp0:0.4, sp1:1.6, grav:0.08, life0:12, life1:24, bx:-dir * 0.6 });
  }

  if (S.rolling) {
    // The roll timer FREEZES in the air. Rolling off a ledge and then jumping is
    // the way this move is actually used, and a roll that expired mid-fall would
    // silently take the option away at the exact moment it is wanted.
    if (S.onGround) S.rollT--;
    /* The roll SPEEDS UP toward rollTop while it lasts, then holds. Without the
       acceleration the roll entered at ~3.2 and only decayed, rollTop was never
       reached, and the roll-jump ended up shorter than a plain jump - which
       inverts the one mechanic the level is built around (F15). */
    const spinUp = S.rollT > 8;
    const mag = spinUp ? Math.abs(S.vx) + PH.rollAccel
                       : Math.max(PH.rollMin * 0.85, Math.abs(S.vx) - PH.rollDecay);
    S.vx = S.face * clamp(mag, PH.rollMin * 0.85, PH.rollTop);

    /* ---- F15 THE ROLL-JUMP ----
       Jump out of a roll in mid-air and keep the horizontal speed in full.
       This is the specific piece of tech the user is buying - the thing DKC
       players still talk about - and it is what clears the 5-tile gaps. */
    // Available for the WHOLE roll, grounded or airborne. No extra timing gate:
    // this is the signature move, so the window is as wide as the roll itself.
    if (S.jumpBuf > 0) {
      S.vy = PH.rollJumpVel;
      S.rolling = false;
      S.rollJumped = true;                     // vx is NOT clamped back down
      S.jumpBuf = 0; S.jumpHeld = true; S.jumpLock = 3;
      S.onGround = false; S.coyote = 0;
      SFX.jump();
      burst(S.x, S.y, 8, { col:'#b8a98d', sp0:0.5, sp1:1.8, grav:0.1, life0:10, life1:20 });
    }
    if (S.rollT <= 0) S.rolling = false;
  }

  /* ---- M4 servo stomp (F16) ----
     Z, and ONLY Z. DOWN used to stomp as well, which meant every descent on a
     cable and every duck in the cart was one mistimed press away from an
     unwanted slam. The stomp is now always deliberate. */
  if (!S.onGround && !S.stomping && !S.rolling && S.hurtT <= 0 && IN.pressed.stomp) {
    S.stomping = true;
    S.vy = PH.stompVel;
    S.vx *= 0.2;
    setAnim('stomp');
    tone({ type:'square', f:900, to:200, dur:0.1, g:0.08, exp:true });
  }

  /* ---- M1/M2 run and jump ---- */
  if (!S.rolling && !S.stomping) {
    if (S.onGround) {
      if (ix !== 0) {
        S.face = ix;
        // Turning around decelerates harder than accelerating. This is what
        // makes the weight legible.
        const rate = (sign(S.vx) !== 0 && sign(S.vx) !== ix) ? PH.turnDecel : PH.accel;
        S.vx = approach(S.vx, ix * PH.topSpeed, rate);
      } else {
        S.vx = approach(S.vx, 0, PH.fric);
      }
      // Momentum carried in from a roll-jump or a tube bleeds off gradually,
      // so a good landing still feels fast for a moment.
      if (Math.abs(S.vx) > PH.topSpeed) {
        S.vx = approach(S.vx, sign(S.vx) * PH.topSpeed, PH.overSpeedDrag);
        if (Math.abs(S.vx) <= PH.topSpeed + 0.01) S.rollJumped = false;
      }
      if (S.jumpBuf > 0) {
        // One frame of anticipation before leaving the ground. Non-negotiable
        // (F19) - it is the difference between a jump that feels connected and
        // one that teleports.
        if (S.crouchT <= 0) { S.crouchT = 3; }
        else if (S.crouchT <= 1) {
          S.vy = PH.jumpVel;
          S.onGround = false; S.coyote = 0; S.jumpBuf = 0;
          S.jumpHeld = true; S.jumpLock = 3;
          S.sqY = 1.16; S.sqX = 0.88;
          SFX.jump();
          burst(S.x, S.y, 6, { col:'#b8a98d', sp0:0.3, sp1:1.2, grav:0.14, life0:8, life1:16 });
        }
      }
    } else {
      if (ix !== 0) {
        S.face = ix;
        const cap = S.rollJumped ? Math.max(PH.topSpeed, Math.abs(S.vx)) : PH.topSpeed;
        S.vx = approach(S.vx, ix * cap, PH.airAccel);
      }
      /* ---- M2b THE DOUBLE JUMP (F12b) ----
         Fires from a buffered press while airborne. No anticipation crouch:
         the first jump earns one because SCRAP is standing on something to
         push off, and a mid-air pause would read as a dropped input.

         `!S.rollJumped` is the load-bearing condition. Stacking an air jump on
         top of roll-jump momentum reaches about eleven tiles, and the mall's
         mandatory cable crossing is nine (F17) - so the clamp would stop being
         the only way over. Spending the roll-jump spends the air jump with it.

         jumpLock is set exactly as the ground jump sets it, so the short hop
         below cuts the SECOND jump's rise too: tap for a small pop, hold for
         the full one. */
      if (S.jumpBuf > 0 && S.airJumpsLeft > 0 && !S.rollJumped && S.jumpLock <= 0) {
        S.airJumpsLeft--;
        S.vy = PH.dblJumpVel;
        S.jumpBuf = 0; S.jumpHeld = true; S.jumpLock = 3;
        S.sqY = 1.14; S.sqX = 0.90;
        SFX.jump();
        // A flat ring of dust rather than the ground burst, so the second jump
        // reads as pushing off nothing.
        burst(S.x, S.y - 6, 9, { col:'#9aa6b4', a0:Math.PI * 0.10, a1:Math.PI * 0.90,
                                 sp0:0.7, sp1:1.9, grav:0.05, life0:9, life1:19 });
      }

      // Short hop: releasing before the apex cuts the rise. The jumpLock guard
      // is what stops this firing on the launch tick itself.
      if (S.vy < 0 && !IN.held.jump && S.jumpHeld && S.jumpLock <= 0) {
        S.vy *= PH.shortHop;
        S.jumpHeld = false;
      }
    }
  }

  /* ---- gravity ---- */
  if (!S.onGround || S.vy < 0) {
    S.vy = Math.min(PH.termVel, S.vy + PH.playerGrav);
  } else {
    S.vy = 0;
  }
  if (S.stomping) S.vy = PH.stompVel;

  /* ---- move ---- */
  S.prevY = S.y;               // where the feet were BEFORE this tick's move
  const before = S.vy;
  const hit = moveActor(S, S.vx, S.vy + (S.onGround ? 1.2 : 0));

  if (hit.wall && S.rolling) {                  // a roll into a wall ends it
    S.rolling = false;
    burst(S.x + hit.wall * 6, S.y - 8, 10, { col:'#a8adb5', sp0:0.6, sp1:2.2, grav:0.15, life0:10, life1:22 });
    SFX.huskBounce();
  }
  if (hit.ceil) S.vy = 0.4;

  S.onGround = hit.floor || groundedCheck(S);
  if (S.onGround) { S.coyote = PH.coyote; S.airJumpsLeft = PH.airJumps; }

  /* ---- landing ---- */
  if (S.onGround && !S.wasOnGround) {
    const hard = clamp(before / 8, 0.15, 1.4);
    S.landT = 9;
    // Squash to 80%, overshoot, settle. Applied at blit time as a scale, which
    // is what makes it affordable.
    S.sqY = clamp(1 - hard * 0.26, 0.74, 0.98);
    S.sqX = clamp(1 + hard * 0.20, 1.02, 1.28);
    SFX.land(hard);
    const n = Math.round(4 + hard * 9);
    burst(S.x, S.y, n, { col:'#b8a98d', a0:Math.PI * 1.05, a1:Math.PI * 1.95,
                         sp0:0.5, sp1:1.2 + hard * 1.4, grav:0.16, life0:10, life1:24 });
    if (S.stomping) {
      S.stomping = false;
      S.frozen = 1;                             // the 1-tick impact freeze
      shake(4);
      SFX.stomp();
      burst(S.x, S.y, 16, { col:'#8d9299', a0:Math.PI * 1.02, a1:Math.PI * 1.98,
                            sp0:1.0, sp1:3.2, grav:0.2, life0:12, life1:30 });
      stompImpact();
    }
    S.rollJumped = S.rollJumped && Math.abs(S.vx) > PH.topSpeed;
  }
  if (!S.onGround && S.wasOnGround && !S.rolling && S.vy > 0) {
    // Walked off an edge: coyote time is already running from above.
  }

  /* ---- squash returns to rest, always eased ---- */
  S.sqX = approach(S.sqX, 1, 0.035);
  S.sqY = approach(S.sqY, 1, 0.035);

  /* ---- tread phase tracks REAL velocity, so speed is legible ---- */
  S.treadPhase = (S.treadPhase + Math.abs(S.vx) * 0.055 + 1) % 1;

  /* ---- world interactions ---- */
  handleTyres();
  handleCables();
  handleTubes();
  handleFire();

  /* ---- fell out of the world: lethal at any health ----
     The test is "is there anything at all below you", not "how far below the
     camera are you". A purely camera-relative check killed the player during
     legitimate long falls: dropping from the mall roof to the ground floor is
     384px, and the camera - which is smoothed, and clamped at the world edges -
     could not always keep within the margin. Asking the tilemap instead is both
     cheap and exactly the question that matters. */
  if (nothingBelow(S.x, S.y) && S.y > cam.y + VIEW_H + 24) killScrap(true);
  else if (S.y > LH * TS + 24) killScrap(true);

  /* ---- idle, and the wave (F20) ---- */
  if (S.onGround && Math.abs(S.vx) < 0.05 && ix === 0) S.idleT++;
  else S.idleT = 0;

  chooseAnim(ix);
}

function setAnim(name) {
  if (S.anim !== name) { S.anim = name; S.animT = 0; S.animFrame = 0; }
}

function chooseAnim(ix) {
  if (S.hurtT > 0)            return setAnim('hurt');
  if (S.rolling)              return setAnim('roll');
  if (S.stomping)             return setAnim('stomp');
  if (!S.onGround)            return setAnim(S.vy < -0.2 ? 'rise' : 'fall');
  if (S.crouchT > 0)          return setAnim('crouch');
  if (S.landT > 5)            return setAnim('land');
  if (ix !== 0 && sign(S.vx) !== 0 && sign(S.vx) !== ix && Math.abs(S.vx) > 1.1)
                              return setAnim('skid');
  if (Math.abs(S.vx) > 0.25)  return setAnim('run');
  if (S.idleT > 300)          return setAnim('wave');
  return setAnim('idle');
}

function advanceAnim() {
  const a = SCRAP_ANIM[S.anim];
  if (!a) return;
  S.animT++;
  let rate = a.rate;
  // The run cycle is driven by actual speed, not by a fixed rate - which is
  // what ties the animation to the physics instead of merely accompanying it.
  if (S.anim === 'run')
    rate = Math.max(2, Math.round(7 - Math.abs(S.vx) * 1.6));
  if (S.anim === 'roll') rate = 2;
  if (S.animT >= rate) {
    S.animT = 0;
    const n = a.frames.length;
    if (S.anim === 'boot' || S.anim === 'land')
      S.animFrame = Math.min(n - 1, S.animFrame + 1);       // one-shot
    else
      S.animFrame = (S.animFrame + 1) % n;
  }
}

/* === PROPS ===============================================================
   The world's interactive furniture: burst-tyre trampolines (F38), clamp
   cables (F17) and pneumatic tubes (F37).
   ========================================================================= */

function handleTyres() {
  for (const ty of LV.tyres) {
    if (ty.squash > 0) ty.squash--;
    if (S.vy <= 0) continue;
    if (Math.abs(S.x - (ty.x + 13)) > 15) continue;
    const top = ty.y - 14;
    if (S.y >= top - 2 && S.y <= top + 10) {
      S.y = top;
      S.vy = PH.tyreVel;
      S.onGround = false;
      S.stomping = false;
      S.sqY = 1.2; S.sqX = 0.86;
      ty.squash = 10;
      SFX.bounce();
