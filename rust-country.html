    musicSet(beat.music);
    UIF.beatText = beat.name;
    UIF.beatName = 150;
  }
  updateEnv(beat);

  if (S.dead) {
    if (--S.deadT <= 0) respawnAt(BEATS[RUN.beat - 1]);
    updateParticles();
    updateCamera();
    setTread(0, false); setRoll(false, 0);
    return;
  }

  updateScrap();
  advanceAnim();

  for (let i = ents.length - 1; i >= 0; i--) {
    const e = ents[i];
    if (e.dead) { ents.splice(i, 1); continue; }
    if (e.type === 'debris') updateDebris(e);
    else if (e.type === 'roller') updateRoller(e);
  }
  updateEnemies();
  updateTips();
  updateBolts();
  updateCrates();
  updateWarden();
  updateTriggers();
  updatePursuit();
  updateWildlife();
  updateParticles();
  updateCamera();

  // Speed, made audible.
  const sp = clamp(Math.abs(S.vx) / PH.rollTop, 0, 1);
  setTread(sp, S.onGround && Math.abs(S.vx) > 0.15 && !S.rolling && !S.inCart);
  setRoll(S.rolling, S.rollT / PH.rollDur);
  if (!S.inCart) setCartNoise(false, 0);
  if (!RUN.pursuit) setRumble(0);
}

function duckAudio(on) {
  if (A.music) A.music.gain.setTargetAtTime(on ? 0.08 : 0.40, now(), 0.1);
  if (on) { setTread(0, false); setRoll(false, 0); setCartNoise(false, 0); setRumble(0); }
}

/* ---- PAUSE, which is also THE MENU (F57, F67) ----------------------------
   One screen doing two jobs: the options menu the owner asked for, and the
   how-to-play the game has never had anywhere else. Driven by UP/DOWN and
   SPACE on a keyboard, and by tapping a row on a phone.
   ------------------------------------------------------------------------ */

function controlsList() {
  // The labels have to match whatever the player is actually holding.
  if (TOUCH_ON) return [
    ['D-PAD',   'MOVE   - HOLD UP TO AIM THE LASER UPWARD'],
    ['A',       'JUMP   - AGAIN IN THE AIR TO DOUBLE JUMP'],
    ['B',       'BOOST ROLL   - JUMP MID-ROLL TO CLEAR BIG GAPS'],
    ['Y',       'FIRE THE LASER   - AMMO COMES FROM CRATES'],
    ['X',       'SERVO STOMP   - A HEAVY MID-AIR SLAM'],
    ['',        'OR JUST LAND ON ANYTHING FROM ABOVE TO KILL IT'],
    ['DOWN',    'DUCK UNDER BEAMS ON THE RAIL CART'],
    ['RETRY',   'RESTART THIS SECTION']
  ];
  return [
    ['WASD / ARROWS', 'MOVE   - HOLD UP TO AIM THE LASER UPWARD'],
    ['SPACE',         'JUMP   - HOLD FOR HIGHER. AGAIN IN THE AIR TO DOUBLE JUMP'],
    ['SHIFT',         'BOOST ROLL   - JUMP MID-ROLL TO CLEAR BIG GAPS'],
    ['X',             'FIRE THE LASER   - AMMO COMES FROM CRATES'],
    ['Z',             'SERVO STOMP   - A HEAVY MID-AIR SLAM'],
    ['',              'OR JUST LAND ON ANYTHING FROM ABOVE TO KILL IT'],
    ['S / DOWN',      'DUCK UNDER BEAMS ON THE RAIL CART'],
    ['R',             'RESTART THIS SECTION'],
    ['M',             'SOUND ON / OFF'],
    ['ESC',           'PAUSE']
  ];
}

const PAUSEUI = { sel:0, page:'menu', rows:[] };

const MENU = [
  { label: () => 'RESUME',
    act: () => { setState(ST.PLAY); duckAudio(false); } },
  { label: () => 'RESTART THIS BEAT',
    act: () => { duckAudio(false); retryBeat(false); setState(ST.PLAY); } },
  { label: () => 'SOUND      ' + (A.muted ? 'OFF' : 'ON'),
    act: () => { setMuted(!A.muted); if (!A.muted) SFX.ui(); } },
  { label: () => 'FULLSCREEN',
    act: () => toggleFullscreen() },
  { label: () => 'CONTROLS',
    act: () => { PAUSEUI.page = 'controls'; } },
  { label: () => 'QUIT TO TITLE',
    act: () => { duckAudio(false); titleCam.x = 300; setState(ST.TITLE); musicSet('title'); } }
];

function openPause() {
  PAUSEUI.sel = 0; PAUSEUI.page = 'menu';
  setState(ST.PAUSE); SFX.ui(); duckAudio(true);
}

function menuMove(d) {
  PAUSEUI.sel = (PAUSEUI.sel + d + MENU.length) % MENU.length;
  SFX.ui();
}

function updatePause() {
  if (PAUSEUI.page === 'controls') {
    // Anything at all backs out of the help page.
    if (IN.pressed.pause || IN.pressed.confirm || IN.pressed.jump ||
        IN.pressed.retry || IN.pressed.roll || IN.pressed.fire) {
      PAUSEUI.page = 'menu'; SFX.ui();
    }
    return;
  }
  if (IN.pressed.up)   menuMove(-1);
  if (IN.pressed.down) menuMove(1);
  if (IN.pressed.confirm || IN.pressed.jump) { SFX.ui(); MENU[PAUSEUI.sel].act(); return; }
  if (IN.pressed.pause) { setState(ST.PLAY); duckAudio(false); SFX.ui(); }
  if (IN.pressed.retry) { duckAudio(false); SFX.ui(); retryBeat(false); setState(ST.PLAY); }
}

/* A tap on the picture. The menu rows record where they were drawn, so the
   hit test is against what the player can actually see. */
function canvasTap(clientX, clientY) {
  const r = cvs.getBoundingClientRect();
  const x = (clientX - r.left) / r.width  * VIEW_W;
  const y = (clientY - r.top)  / r.height * VIEW_H;

  if (G.state === ST.TITLE)  { IN.anyPressed = true; return; }
  if (G.state === ST.FINISH) { IN.pressed.confirm = true; return; }
  if (G.state !== ST.PAUSE)  return;

  if (PAUSEUI.page === 'controls') { PAUSEUI.page = 'menu'; SFX.ui(); return; }
  for (let i = 0; i < PAUSEUI.rows.length; i++) {
    const row = PAUSEUI.rows[i];
    if (y >= row - 5 && y <= row + 8 && x > 40 && x < VIEW_W - 40) {
      PAUSEUI.sel = i; SFX.ui(); MENU[i].act();
      return;
    }
  }
}

function drawPause(c) {
  c.fillStyle = 'rgba(10,11,15,0.93)';
  c.fillRect(0, 0, VIEW_W, VIEW_H);

  if (PAUSEUI.page === 'controls') {
    text(c, 'CONTROLS', VIEW_W / 2, 12, '#f2c14e', { align:'centre', scale:2, shadow:'#54241a' });
    let y = 44;
    for (const kv of controlsList()) {
      text(c, kv[0], 24, y, '#f6d9a8');
      text(c, kv[1], 116, y, '#a8b6c4', { alpha:0.85 });
      y += 12;
    }
    text(c, TOUCH_ON ? 'TAP TO GO BACK' : 'ANY KEY TO GO BACK',
         VIEW_W / 2, VIEW_H - 14, '#a8b6c4', { align:'centre', alpha:0.7 });
    return;
  }

  text(c, 'PAUSED', VIEW_W / 2, 14, '#f2c14e', { align:'centre', scale:2, shadow:'#54241a' });

  PAUSEUI.rows.length = 0;
  let y = 52;
  for (let i = 0; i < MENU.length; i++) {
    const on = i === PAUSEUI.sel;
    PAUSEUI.rows.push(y);
    const label = MENU[i].label();
    if (on) {
      c.globalAlpha = 0.16; c.fillStyle = '#f2c14e';
      c.fillRect(VIEW_W / 2 - 92, y - 4, 184, 13);
      c.globalAlpha = 1;
      text(c, '>', VIEW_W / 2 - 84, y, '#f2c14e');
    }
    text(c, label, VIEW_W / 2, y, on ? '#f6d9a8' : '#8b97a6',
         { align:'centre', shadow: on ? '#54241a' : null });
    y += 17;
  }

  y += 6;
  text(c, 'TIME  ' + fmtTime(RUN.ticks), 26, y, '#e8dcc4');
  text(c, 'DEATHS  ' + RUN.deaths, 150, y, '#e8dcc4');
  text(c, 'SCRAP  ' + RUN.scrap, 250, y, '#f2c14e');
  text(c, 'FUSES  ' + RUN.fuses.filter(Boolean).length + '/4', 340, y, '#f2c14e');

  text(c, TOUCH_ON ? 'TAP A LINE' : 'UP / DOWN TO CHOOSE   SPACE TO PICK   ESC TO RESUME',
       VIEW_W / 2, VIEW_H - 14, '#a8b6c4', { align:'centre', alpha:0.7 });
}

/* ---- ENDING (F56) ---------------------------------------------------------
   THE WARDEN falls, the sun lifts to full, and SCRAP walks off right in pure
   black silhouette. This is the only place he is drawn unlit, and it only
   works because the silhouette test in step 6 passed.
   ------------------------------------------------------------------------ */
function startEnding() {
  S.ending = true;
  S.endT = 0;
  S.dead = false;
  RUN.ended = true;
  setState(ST.ENDING);
  musicSet('ending');
  setTread(0, false); setRoll(false, 0); setRumble(0);
  shake(4);
}

function updateEnding() {
  S.endT++;
  if (S.endT > 70) updateScrap();
  advanceAnim();
  updateParticles();
  updateWildlife();
  updateCamera();
  if (S.endT > 130 && (IN.anyPressed || IN.pressed.confirm)) finishRun();
  if (S.endT > 640) finishRun();
}

function drawEnding(c) {
  const camX = Math.round(cam.x), camY = Math.round(cam.y);
  const t = clamp(S.endT / 240, 0, 1);

  drawLayerSet(c, ENV.ARENA, camX, camY, 1);
  drawProps(c, camX, camY, false);
  drawTiles(c, camX, camY);
  drawParticles(c, camX, camY);

  /* A warm bloom behind him FIRST. He is drawn in pure black, and a black
     sprite on a mid-grey floor is not a silhouette - it is just a dark smudge.
     Backlighting him is what turns it into one. */
  {
    const gx = S.x - camX + 26, gy = S.y - camY - 16;
    c.save();
    c.globalCompositeOperation = 'lighter';
    const bg = c.createRadialGradient(gx, gy, 2, gx, gy, 120);
    bg.addColorStop(0, 'rgba(255,240,196,' + (0.55 * t).toFixed(3) + ')');
    bg.addColorStop(0.5, 'rgba(255,208,138,' + (0.24 * t).toFixed(3) + ')');
    bg.addColorStop(1, 'rgba(255,208,138,0)');
    c.fillStyle = bg;
    c.fillRect(0, 0, VIEW_W, VIEW_H);
    c.restore();
  }

  // SCRAP, in silhouette.
  const a = SCRAP_ANIM.silhouette;
  const fi = Math.floor(S.endT / 5) % a.frames.length;
  c.drawImage(a.frames[fi].r,
              Math.round(S.x - camX - SPR_W / 2 - 3),
              Math.round(S.y - camY - SPR_H - 3));

  // The sun coming fully up. The payoff of the dark-to-light arc.
  c.save();
  c.globalCompositeOperation = 'lighter';
  const g = c.createLinearGradient(0, VIEW_H, 0, 0);
  g.addColorStop(0, 'rgba(255,240,196,' + (0.55 * t).toFixed(3) + ')');
  g.addColorStop(0.5, 'rgba(255,208,138,' + (0.30 * t).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(255,208,138,0)');
  c.fillStyle = g;
  c.fillRect(0, 0, VIEW_W, VIEW_H);
  c.restore();

  drawForeLayer(c, ENV.ARENA, camX, 0.5);

  if (S.endT > 300) {
    const a2 = clamp((S.endT - 300) / 80, 0, 1);
    c.fillStyle = 'rgba(10,11,15,' + (0.74 * a2).toFixed(3) + ')';
    c.fillRect(0, 0, VIEW_W, VIEW_H);
    c.globalAlpha = a2;
    c.drawImage(TITLE_ART, Math.round((VIEW_W - TITLE_ART.width) / 2), 70);
    if ((G.tick % 80) < 56)
      text(c, 'PRESS ANY KEY', VIEW_W / 2, VIEW_H - 26, '#f6d9a8',
           { align:'centre', shadow:'#2c2f35' });
    c.globalAlpha = 1;
  }
}

/* ---- FINISH (F55) ---- */
const FIN = { records:[], saved:false };

function finishRun() {
  FIN.records = [];
  FIN.saved = false;
  const fuses = RUN.fuses.filter(Boolean).length;

  if (!SAVE.bestTimeTicks || RUN.ticks < SAVE.bestTimeTicks) {
    SAVE.bestTimeTicks = RUN.ticks; FIN.records.push('time');
  }
  if (SAVE.fewestDeaths === undefined || RUN.deaths < SAVE.fewestDeaths) {
    SAVE.fewestDeaths = RUN.deaths; FIN.records.push('deaths');
  }
  if (!SAVE.mostScrap || RUN.scrap > SAVE.mostScrap) {
    SAVE.mostScrap = RUN.scrap; FIN.records.push('scrap');
  }
  if (!SAVE.mostFuses || fuses > SAVE.mostFuses) {
    SAVE.mostFuses = fuses; FIN.records.push('fuses');
  }
  FIN.saved = storeSave(SAVE);
  if (FIN.records.length) SFX.record(); else SFX.uiBig();
  setState(ST.FINISH);
}

function updateFinish() {
  musicSet('ending');
  if (G.stateTick > 40 && (IN.anyPressed || IN.pressed.confirm)) {
    SFX.ui();
    setState(ST.TITLE);
  }
}

function drawFinish(c) {
  drawLayerSet(c, ENV.ARENA, 1200, 90, 1);
  c.fillStyle = 'rgba(10,11,15,0.93)';
  c.fillRect(0, 0, VIEW_W, VIEW_H);

  text(c, 'RUST COUNTRY', VIEW_W / 2, 18, '#f2c14e',
       { align:'centre', scale:2, shadow:'#54241a' });
  text(c, 'SCR-4P IS STILL RUNNING', VIEW_W / 2, 40, '#a8b6c4', { align:'centre', alpha:0.8 });

  const fuses = RUN.fuses.filter(Boolean).length;
  const rows = [
    ['TIME',   fmtTime(RUN.ticks),  'time',   SAVE.bestTimeTicks ? fmtTime(SAVE.bestTimeTicks) : '-'],
    ['DEATHS', String(RUN.deaths),  'deaths', String(SAVE.fewestDeaths === undefined ? '-' : SAVE.fewestDeaths)],
    ['SCRAP',  String(RUN.scrap),   'scrap',  String(SAVE.mostScrap || 0)],
    ['FUSES',  fuses + '/4',        'fuses',  (SAVE.mostFuses || 0) + '/4']
  ];
  let y = 64;
  text(c, 'THIS RUN', 210, y - 12, '#a8b6c4', { alpha:0.6 });
  text(c, 'BEST', 320, y - 12, '#a8b6c4', { alpha:0.6 });
  for (const [label, val, key, best] of rows) {
    const isRec = FIN.records.indexOf(key) >= 0;
    text(c, label, 90, y, '#e8dcc4');
    text(c, val, 210, y, isRec ? '#f2c14e' : '#fff6e2', { shadow: isRec ? '#54241a' : null });
    text(c, best, 320, y, '#a8b6c4', { alpha:0.75 });
    if (isRec) text(c, 'NEW!', 380, y, '#f2c14e', { alpha:0.6 + Math.sin(G.tick / 8) * 0.4 });
    y += 16;
  }

  // The fuse letters, shown as found or not.
  let fx = VIEW_W / 2 - 30;
  for (let i = 0; i < 4; i++) {
    c.globalAlpha = RUN.fuses[i] ? 1 : 0.2;
    text(c, FUSE_LETTERS[i], fx + i * 16, y + 8, RUN.fuses[i] ? '#f2c14e' : '#a8b6c4',
         { scale:2, shadow: RUN.fuses[i] ? '#54241a' : null });
    c.globalAlpha = 1;
  }
  if (fuses < 4)
    text(c, 'FOUR FUSES ARE HIDDEN IN THERE. YOU FOUND ' + fuses + '.',
         VIEW_W / 2, y + 32, '#a8b6c4', { align:'centre', alpha:0.7 });
  else
    text(c, 'ALL FOUR FUSES FOUND.', VIEW_W / 2, y + 32, '#f2c14e', { align:'centre' });

  if (!FIN.saved)
    text(c, 'COULD NOT SAVE - BROWSER STORAGE UNAVAILABLE', VIEW_W / 2, VIEW_H - 26,
         '#a8b6c4', { align:'centre', alpha:0.45 });
  if (G.stateTick > 40 && (G.tick % 80) < 56)
    text(c, 'PRESS ANY KEY', VIEW_W / 2, VIEW_H - 14, '#f6d9a8',
         { align:'centre', shadow:'#2c2f35' });
}

/* === BOOT ================================================================
   Build every atlas once, then start the loop. There is no loading screen
   because there is nothing to load - the whole game is generated here, in
   roughly a third of a second.
   ========================================================================= */

function render() {
  const c = ctx;

  if (G.state === ST.BOOTING) {
    c.fillStyle = '#14161c'; c.fillRect(0, 0, VIEW_W, VIEW_H);
    return;
  }
  if (G.state === ST.TITLE)  { drawTitle(c);  return; }
  if (G.state === ST.FINISH) { drawFinish(c); return; }
  if (G.state === ST.ENDING) { drawEnding(c); return; }

  // ---- the play scene ----
  let camX = cam.x, camY = cam.y;
  // The vista lift (F41): the camera rises to show the whole dead skyline.
  if (RUN.vista) {
    const t = RUN.vistaT < 90 ? RUN.vistaT / 90
            : (RUN.vistaT < 150 ? 1 : 1 - (RUN.vistaT - 150) / 50);
    camY -= 72 * clamp(t, 0, 1);
  }
  if (cam.shake > 0) {
    camX += (Math.random() - 0.5) * cam.shake * 2;
    camY += (Math.random() - 0.5) * cam.shake * 2;
  }
  camX = Math.round(camX); camY = Math.round(camY);

  const env = ENVX.cur;
  if (ENVX.mix < 1) {
    drawLayerSet(c, ENVX.prev, camX, camY, 1);
    drawLayerSet(c, env, camX, camY, ENVX.mix);
  } else {
    drawLayerSet(c, env, camX, camY, 1);
  }

  drawProps(c, camX, camY, false);
  drawTiles(c, camX, camY);
  drawWildlife(c, camX, camY);
  drawWorldFurniture(c, camX, camY);

  if (W.alive) drawWardenSprite(c, camX, camY);

  for (const e of ents) drawEnt(c, e, camX, camY);

  // The trolley, then SCRAP on top of it.
  if (S.inCart) {
    const cx = S.inCart.x - camX, cy = S.inCart.y - camY;
    c.drawImage(ART.cart, Math.round(cx - 17), Math.round(cy - 14));
  }
  drawScrap(c, camX, camY);
  drawParticles(c, camX, camY);

  drawPursuitWall(c, camX, camY);
  drawForeLayer(c, env, camX, ENVX.mix);
  drawAtmosphere(c, env, camX, camY);

  drawHUD(c);
  if (G.state === ST.PAUSE) drawPause(c);

  if (S.dead) {
    const a = clamp(1 - S.deadT / PH.respawnDelay, 0, 1) * 0.45;
    c.fillStyle = 'rgba(10,11,15,' + a.toFixed(3) + ')';
    c.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

function update() {
  G.tick++;
  G.stateTick++;
  pollGamepad();
  musicUpdate();

  if (IN.pressed.mute) { setMuted(!A.muted); if (!A.muted) SFX.ui(); }

  switch (G.state) {
    case ST.TITLE:  updateTitle();  break;
    case ST.PLAY:   updatePlay();   break;
    case ST.PAUSE:  updatePause();  break;
    case ST.ENDING: updateEnding(); break;
    case ST.FINISH: updateFinish(); break;
  }
  clearPressed();
}

/* Boot runs ONE STAGE PER FRAME, with a progress bar.

   Generating every sprite, tile and parallax strip takes about a second on this
   machine and the target machine is slower. Done in one synchronous block that
   is a second or more of black canvas with no explanation, before the title
   screen appears - on a game whose whole first impression is that it feels
   responsive. Staging it costs a few lines and turns dead air into a load bar.

   There is still nothing being LOADED: the bar is the game drawing itself. */
const BOOT_STAGES = [
  ['TYPE',        () => { buildFont(); buildTitleArt(); buildHudArt(); }],
  ['SCRAP',       () => buildScrapAnim()],
  ['MACHINES',    () => buildEnemyArt()],
  ['THE WORLD',   () => buildPropArt()],
  ['GROUND',      () => buildTiles()],
  ['THE CITY',    () => buildLayers()],
  ['RUST COUNTRY',() => { buildLevel(); seedWildlife();
                          scrapReset(BEATS[0].spawnPt);
                          cam.x = cam.tx = 0;
                          cam.y = cam.ty = LH * TS - VIEW_H; }]
];
let bootStage = 0, bootT0 = 0;

function drawBootProgress(label, done, total) {
  const c = ctx;
  c.fillStyle = '#14161c';
  c.fillRect(0, 0, VIEW_W, VIEW_H);

  const bw = 200, bx = (VIEW_W - bw) / 2, by = VIEW_H / 2 - 2;
  c.fillStyle = '#2c2f35';
  c.fillRect(bx, by, bw, 5);
  c.fillStyle = '#b4552d';
  c.fillRect(bx, by, Math.round(bw * done / total), 5);
  c.fillStyle = '#f2c14e';
  c.fillRect(bx + Math.round(bw * done / total) - 1, by - 1, 2, 7);

  // The bitmap font may not exist yet on the first stage, so fall back to the
  // browser's own. It is the only place in the game that does.
  if (FONT_ATLAS) {
    text(c, label, VIEW_W / 2, by - 14, '#a8b6c4', { align:'centre' });
    text(c, 'RUST COUNTRY', VIEW_W / 2, by + 16, '#54241a', { align:'centre' });
  } else {
    c.fillStyle = '#a8b6c4';
    c.font = '10px monospace';
    c.textAlign = 'center';
    c.fillText(label, VIEW_W / 2, by - 8);
    c.textAlign = 'left';
  }
}

function bootStep() {
  if (bootStage === 0) bootT0 = (window.performance && performance.now) ? performance.now() : 0;
  drawBootProgress(BOOT_STAGES[bootStage][0], bootStage, BOOT_STAGES.length);
  requestAnimationFrame(() => {
    BOOT_STAGES[bootStage][1]();
    bootStage++;
    if (bootStage < BOOT_STAGES.length) {
      bootStep();
    } else {
      if (bootT0) window.__bootMs = performance.now() - bootT0;
      setState(ST.TITLE);
      requestAnimationFrame(frame);
    }
  });
}

/* Kept as a synchronous entry point too: the build harness needs the whole game
   ready before it can drive a single tick. */
function boot() {
  const t0 = (window.performance && performance.now) ? performance.now() : 0;
  for (const st of BOOT_STAGES) st[1]();
  setState(ST.TITLE);
  if (t0) window.__bootMs = performance.now() - t0;
}

/* Staged, so the first paint happens immediately. */
bootStep();

</script>
